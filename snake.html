<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake 3.0 3D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗА, ШРИФТЫ И ЗАЩИТА ОТ ТЕЛЕГРАМА */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0b0c10; overflow: hidden; touch-action: none; color: white; height: 100vh; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* ИНТЕРФЕЙС ИГРЫ */
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 100; text-shadow: 0 2px 5px rgba(0,0,0,0.8); font-weight: bold; font-size: 20px; pointer-events: none; }
        .score-text { color: #fff; }
        .coins-text { color: #ffd700; font-size: 24px; }
        
        /* КНОПКА МЕНЮ В УГЛУ */
        .smart-menu-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: rgba(11, 12, 16, 0.8); color: #45a29e; border: 2px solid #45a29e; border-radius: 8px; padding: 10px 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(69, 162, 158, 0.3); }

        /* ОКНА (МОДАЛКИ) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .hidden { display: none !important; }
        .modal-content { background: linear-gradient(145deg, #1f2833, #0b0c10); border: 2px solid #45a29e; border-radius: 20px; width: 85%; max-height: 85vh; padding: 25px; display: flex; flex-direction: column; gap: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal-title { color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); }
        
        /* КНОПКИ */
        .btn { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 12px; color: white; border: none; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .btn-blue { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .btn-red { background: linear-gradient(45deg, #cb2d3e, #ef473a); }
        
        /* МАГАЗИН (С ИДЕАЛЬНЫМ СКРОЛЛОМ) */
        .shop-container { overflow-y: auto; max-height: 50vh; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 15px; display: flex; flex-direction: column; gap: 10px; }
        .skin-card { display: flex; justify-content: space-between; align-items: center; background: #1f2833; padding: 15px; border-radius: 12px; border: 1px solid #45a29e; }
        .skin-card.active { border-color: #66fcf1; box-shadow: 0 0 15px rgba(102, 252, 241, 0.4); }
        .skin-name { font-weight: bold; font-size: 16px; color: #fff; }
        .buy-btn { padding: 8px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-buy { background: #ffd700; color: #000; }
        .btn-select { background: #66fcf1; color: #000; }
        .btn-selected { background: #444; color: #888; }
        
        /* ВСПЛЫВАЮЩИЕ ТЕКСТЫ (+100) */
        .floating-text { position: absolute; font-size: 28px; font-weight: bold; color: #ffd700; text-shadow: 0 0 15px #ff8c00; pointer-events: none; animation: floatUp 1s ease-out forwards; z-index: 500; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
    </style>
</head>
<body>

    <!-- Интерфейс -->
    <div id="ui-layer">
        <div class="score-text">Очки: <span id="score">0</span></div>
        <div class="coins-text"><span id="coins">0</span> 💰</div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">⚙️ МЕНЮ</button>
    <canvas id="gameCanvas"></canvas>

    <!-- Смерть -->
    <div id="gameOverScreen" class="modal hidden">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;">
            <h1 style="color: #ff4b2b; font-size: 45px; text-shadow: 0 0 20px red; margin-bottom: 20px;">РАЗБИЛСЯ!</h1>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 15px;">🔄 ИГРАТЬ ЕЩЕ</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ЗАБРАТЬ ДЕНЬГИ</button>
        </div>
    </div>

    <!-- Умное Меню -->
    <div id="smartModal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">ПАУЗА</h2>
            <button class="btn btn-blue" onclick="openHangar()">🎨 СКИНЫ (АНГАР)</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ВЫЙТИ В БОТА</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- Магазин Скинов -->
    <div id="hangarModal" class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">МАГАЗИН СКИНОВ</h2>
            <div style="color: #ffd700; font-size: 18px; margin-bottom: 5px;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="skinsList"></div>
            <button class="btn btn-green" onclick="closeHangar()">НАЗАД</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. БЛОКИРОВКИ ТЕЛЕГРАМА (АНТИ-СВАЙП)
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', function(e) {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗА СКИНОВ (10 штук + 3D Цвета)
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'Green Mamba', price: 0, c1: '#38ef7d', c2: '#11998e' },
        { id: 'water', name: 'Blue Water', price: 1000, c1: '#6dd5ed', c2: '#2193b0' },
        { id: 'fire', name: 'Fire Dragon', price: 1500, c1: '#f12711', c2: '#f5af19' },
        { id: 'gold', name: 'Golden Snake', price: 2000, c1: '#ffe000', c2: '#799f0c' },
        { id: 'amethyst', name: 'Amethyst', price: 2500, c1: '#c31432', c2: '#240b36' },
        { id: 'cyborg', name: 'Cyborg', price: 3000, c1: '#e0eafc', c2: '#cfdef3' },
        { id: 'toxic', name: 'Toxic Neon', price: 3000, c1: '#00ff87', c2: '#60efff' },
        { id: 'albino', name: 'Albino', price: 3000, c1: '#ffc3a0', c2: '#ffafbd' },
        { id: 'lava', name: 'Lava Magma', price: 3000, c1: '#ff4b2b', c2: '#ff416c' },
        { id: 'black_hole', name: 'Black Hole (+20%)', price: 3000, c1: '#4b1248', c2: '#f0c27b' }
    ];

    let localCoins = parseInt(localStorage.getItem('snake_coins')) || 0;
    let unlockedSkins = JSON.parse(localStorage.getItem('snake_unlocked')) || ['default'];
    let activeSkinId = localStorage.getItem('snake_active_skin') || 'default';
    
    let sessionCoins = 0;
    let timeSpent = 0;
    let startTime = Date.now();

    // ==========================================
    // 3. 3D ДВИЖОК ЗМЕЙКИ (CANVAS)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Динамический размер сетки
    let cellSize = Math.floor(window.innerWidth / 15);
    let cols = Math.floor(window.innerWidth / cellSize);
    let rows = Math.floor(window.innerHeight / cellSize);
    
    canvas.width = cols * cellSize;
    canvas.height = rows * cellSize;

    let snake = [];
    let dir = {x: 0, y: -1}; // Изначально едет вверх
    let nextDir = {x: 0, y: -1};
    let food = {};
    let score = 0;
    
    let gameState = 'start'; // start, playing, paused, gameover
    let frames = 0;
    let speedThreshold = 12; // Чем меньше, тем быстрее (кадры между шагами)

    function initGameData() {
        // Змея в центре экрана (3 сегмента)
        let startX = Math.floor(cols/2);
        let startY = Math.floor(rows/2);
        snake = [ {x: startX, y: startY}, {x: startX, y: startY+1}, {x: startX, y: startY+2} ];
        dir = {x: 0, y: -1}; nextDir = {x: 0, y: -1};
        score = 0; speedThreshold = 15;
        document.getElementById('score').innerText = score;
        spawnFood();
    }

    // Спавн Яблока (Обычное или Золотое 3D)
    function spawnFood() {
        let isGolden = Math.random() < 0.15; // 15% шанс на золото
        let valid = false;
        while (!valid) {
            food.x = Math.floor(Math.random() * cols);
            food.y = Math.floor(Math.random() * (rows - 3)) + 3; // Отступ сверху для UI
            valid = true;
            for (let s of snake) { if (s.x === food.x && s.y === food.y) valid = false; }
        }
        food.type = isGolden ? 'gold' : 'apple';
        food.spawnTime = Date.now();
    }

    // Рендер 3D Сферы (Тело змеи)
    function drawSphere(cx, cy, r, color1, color2, isHead) {
        let grad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
        grad.addColorStop(0, color1);
        grad.addColorStop(1, color2);
        
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fillStyle = grad;
        
        // Тень только для головы
        if(isHead) {
            ctx.shadowColor = color1;
            ctx.shadowBlur = 15;
        } else {
            ctx.shadowBlur = 0;
        }
        
        ctx.fill();

        // Глаза для головы
        if (isHead) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            // Вычисляем смещение глаз в зависимости от направления
            let eyeOffsetX = dir.x === 0 ? r*0.4 : dir.x * r*0.4;
            let eyeOffsetY = dir.y === 0 ? r*0.4 : dir.y * r*0.4;
            
            // Левый глаз
            ctx.beginPath(); ctx.arc(cx + (dir.y === 0 ? eyeOffsetX : -r*0.4), cy + (dir.x === 0 ? eyeOffsetY : -r*0.4), r*0.25, 0, Math.PI*2); ctx.fill();
            // Правый глаз
            ctx.beginPath(); ctx.arc(cx + (dir.y === 0 ? eyeOffsetX : r*0.4), cy + (dir.x === 0 ? eyeOffsetY : r*0.4), r*0.25, 0, Math.PI*2); ctx.fill();
            
            // Зрачки
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(cx + (dir.y === 0 ? eyeOffsetX : -r*0.4) + dir.x*2, cy + (dir.x === 0 ? eyeOffsetY : -r*0.4) + dir.y*2, r*0.1, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + (dir.y === 0 ? eyeOffsetX : r*0.4) + dir.x*2, cy + (dir.x === 0 ? eyeOffsetY : r*0.4) + dir.y*2, r*0.1, 0, Math.PI*2); ctx.fill();
        }
    }

    // Рендер 3D Яблока
    function drawFood(fx, fy) {
        let cx = fx * cellSize + cellSize/2;
        let cy = fy * cellSize + cellSize/2;
        let r = cellSize/2.2;
        
        ctx.shadowBlur = 0;
        
        if (food.type === 'apple') {
            // Красное реалистичное яблоко
            let grad = ctx.createRadialGradient(cx-r*0.2, cy-r*0.2, r*0.1, cx, cy, r);
            grad.addColorStop(0, '#ff6b6b'); grad.addColorStop(1, '#8b0000');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
            // Листочек
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath(); ctx.ellipse(cx+r*0.3, cy-r*0.8, r*0.4, r*0.2, Math.PI/4, 0, Math.PI*2); ctx.fill();
        } else {
            // Золотое яблоко (мигает)
            let isBlinking = Math.floor(Date.now() / 200) % 2 === 0;
            let grad = ctx.createRadialGradient(cx-r*0.2, cy-r*0.2, r*0.1, cx, cy, r);
            grad.addColorStop(0, isBlinking ? '#fff' : '#ffe000'); grad.addColorStop(1, '#d4af37');
            ctx.shadowColor = '#ffe000'; ctx.shadowBlur = 20;
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, r*1.1, 0, Math.PI*2); ctx.fill();
        }
    }

    function createFloatingText(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    // Главный игровой цикл
    function loop() {
        requestAnimationFrame(loop);
        if (gameState !== 'playing') return;

        frames++;
        if (frames < speedThreshold) return;
        frames = 0;
        
        // Золотое яблоко пропадает через 8 секунд
        if (food.type === 'gold' && Date.now() - food.spawnTime > 8000) spawnFood();

        dir = nextDir;
        let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

        // Столкновение со стеной (Смерть)
        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
            gameState = 'gameover';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            return;
        }

        // Столкновение с собой (Смерть)
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameState = 'gameover';
                document.getElementById('gameOverScreen').classList.remove('hidden');
                return;
            }
        }

        snake.unshift(head); // Двигаем голову

        // Поедание
        if (head.x === food.x && head.y === food.y) {
            let reward = food.type === 'gold' ? 100 : 10;
            let pts = food.type === 'gold' ? 3 : 1;
            
            score += pts;
            sessionCoins += reward;
            localCoins += reward;
            
            document.getElementById('score').innerText = score;
            document.getElementById('coins').innerText = sessionCoins;
            
            // Всплывающий текст над яблоком
            createFloatingText(head.x * cellSize, head.y * cellSize, `+${reward}`);

            // Усложнение: каждые 5 очков скорость растет
            if (score % 5 === 0 && speedThreshold > 4) speedThreshold--;
            
            spawnFood();
        } else {
            snake.pop(); // Удаляем хвост, если не съели
        }

        render();
    }

    function render() {
        // Отрисовка стильной сетки (пола)
        ctx.fillStyle = '#0b0c10';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#1f2833';
        ctx.lineWidth = 1;
        for (let i = 0; i <= cols; i++) { ctx.beginPath(); ctx.moveTo(i*cellSize, 0); ctx.lineTo(i*cellSize, canvas.height); ctx.stroke(); }
        for (let i = 0; i <= rows; i++) { ctx.beginPath(); ctx.moveTo(0, i*cellSize); ctx.lineTo(canvas.width, i*cellSize); ctx.stroke(); }

        drawFood(food.x, food.y);

        let activeSkin = SKINS.find(s => s.id === activeSkinId);
        
        // Отрисовка хвоста
        for (let i = snake.length - 1; i >= 0; i--) {
            let cx = snake[i].x * cellSize + cellSize/2;
            let cy = snake[i].y * cellSize + cellSize/2;
            // Хвост плавно уменьшается к концу
            let r = (cellSize/2.2) * (1 - (i / snake.length) * 0.4); 
            drawSphere(cx, cy, r, activeSkin.c1, activeSkin.c2, i === 0);
        }
    }

    // ==========================================
    // 4. УПРАВЛЕНИЕ СВАЙПАМИ (Надежное!)
    // ==========================================
    let touchStartX = 0; let touchStartY = 0;
    window.addEventListener('touchstart', e => {
        if(e.target.closest('.btn') || e.target.closest('.smart-menu-btn') || gameState !== 'playing') {
            if(gameState === 'start' && !e.target.closest('.btn')) {
                gameState = 'playing'; initGameData();
            }
            return;
        }
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    });

    window.addEventListener('touchend', e => {
        if (gameState !== 'playing') return;
        let dx = e.changedTouches[0].screenX - touchStartX;
        let dy = e.changedTouches[0].screenY - touchStartY;
        
        // Определяем направление свайпа
        if (Math.abs(dx) > Math.abs(dy)) {
            // Горизонтально
            if (dx > 30 && dir.x !== -1) nextDir = {x: 1, y: 0};
            else if (dx < -30 && dir.x !== 1) nextDir = {x: -1, y: 0};
        } else {
            // Вертикально
            if (dy > 30 && dir.y !== -1) nextDir = {x: 0, y: 1};
            else if (dy < -30 && dir.y !== 1) nextDir = {x: 0, y: -1};
        }
    });

    function resetGame() {
        document.getElementById('gameOverScreen').classList.add('hidden');
        gameState = 'playing';
        initGameData();
    }

    // ==========================================
    // 5. МЕНЮ И МАГАЗИН (УМНЫЙ UI)
    // ==========================================
    document.getElementById('mainMenuBtn').onclick = () => {
        if (gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.remove('hidden');
    };

    function closeMenu() {
        document.getElementById('smartModal').classList.add('hidden');
        if (gameState === 'paused') gameState = 'playing';
    }

    function openHangar() {
        document.getElementById('smartModal').classList.add('hidden');
        document.getElementById('hangarModal').classList.remove('hidden');
        document.getElementById('shopCoins').innerText = localCoins;
        renderSkins();
    }

    function closeHangar() {
        document.getElementById('hangarModal').classList.add('hidden');
        document.getElementById('smartModal').classList.remove('hidden');
    }

    function renderSkins() {
        const list = document.getElementById('skinsList');
        list.innerHTML = '';
        
        SKINS.forEach(skin => {
            let isUnlocked = unlockedSkins.includes(skin.id);
            let isActive = activeSkinId === skin.id;
            let btnHtml = isActive ? `<button class="buy-btn btn-selected">ВЫБРАН</button>` :
                          isUnlocked ? `<button class="buy-btn btn-select" onclick="equipSkin('${skin.id}')">НАДЕТЬ</button>` :
                          `<button class="buy-btn btn-buy" onclick="buySkin('${skin.id}', ${skin.price})">КУПИТЬ (${skin.price})</button>`;

            list.innerHTML += `
                <div class="skin-card ${isActive ? 'active' : ''}">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(${skin.c1}, ${skin.c2}); border: 2px solid #fff;"></div>
                        <div class="skin-name">${skin.name}</div>
                    </div>
                    ${btnHtml}
                </div>`;
        });
    }

    window.buySkin = function(id, price) {
        if (localCoins >= price) {
            localCoins -= price; unlockedSkins.push(id);
            localStorage.setItem('snake_coins', localCoins);
            localStorage.setItem('snake_unlocked', JSON.stringify(unlockedSkins));
            equipSkin(id);
        } else {
            tg.showAlert('Бро, не хватает монет! Нужно играть.');
        }
    }

    window.equipSkin = function(id) {
        activeSkinId = id;
        localStorage.setItem('snake_active_skin', activeSkinId);
        document.getElementById('shopCoins').innerText = localCoins;
        renderSkins(); render(); // Перерисовываем змею в паузе
    }

    // ОТПРАВКА ДАННЫХ В PYTHON БОТА
    window.saveAndExit = function() {
        timeSpent = Math.floor((Date.now() - startTime) / 1000);
        let data = {
            game: "snake",
            coins: sessionCoins,
            score: score,
            time_spent: timeSpent,
            active_skin: activeSkinId
        };
        tg.sendData(JSON.stringify(data));
    }

    // Запуск стартового экрана
    ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#66fcf1'; ctx.font = '30px Arial'; ctx.textAlign = 'center';
    ctx.fillText("ТАПНИ ЧТОБЫ НАЧАТЬ", canvas.width/2, canvas.height/2);
    requestAnimationFrame(loop);

</script>
</body>
</html>
