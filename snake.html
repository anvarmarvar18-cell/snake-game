<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #0f0f1b; display: flex; flex-direction: column; align-items: center; color: white; touch-action: none; font-family: sans-serif;}
        canvas { background-color: #000; box-shadow: 0 0 20px #00ffcc; margin-top: 20px; }
        h1 { margin: 10px; font-size: 30px; color: #00ffcc; }
    </style>
</head>
<body>
    <h1 id="score">Счет: 0</h1>
    <canvas id="gameCanvas" width="300" height="400"></canvas>
    
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let score = 0;
        
        let snake = [];
        snake[0] = { x: 9 * box, y: 10 * box };
        let food = { x: Math.floor(Math.random()*15)*box, y: Math.floor(Math.random()*20)*box };
        let d = "RIGHT";

        // Управление свайпами по экрану
        let touchStartX = 0; let touchStartY = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX; let touchEndY = e.changedTouches[0].screenY;
            let dx = touchEndX - touchStartX; let dy = touchEndY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && d != "LEFT") d = "RIGHT";
                else if (dx < -30 && d != "RIGHT") d = "LEFT";
            } else {
                if (dy > 30 && d != "UP") d = "DOWN";
                else if (dy < -30 && d != "DOWN") d = "UP";
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(let i = 0; i < snake.length; i++){
                ctx.fillStyle = (i === 0) ? "#00ffcc" : "#00aa88";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
            
            ctx.fillStyle = "#ff00ff";
            ctx.fillRect(food.x, food.y, box, box);
            
            let snakeX = snake[0].x; let snakeY = snake[0].y;
            
            if(d == "LEFT") snakeX -= box; if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box; if(d == "DOWN") snakeY += box;
            
            if(snakeX == food.x && snakeY == food.y){
                score++; document.getElementById('score').innerText = "Счет: " + score;
                food = { x: Math.floor(Math.random()*15)*box, y: Math.floor(Math.random()*20)*box };
            } else { snake.pop(); }
            
            let newHead = { x: snakeX, y: snakeY };
            
            // Проигрыш (удар о стену)
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height){
                clearInterval(game);
                tg.sendData(JSON.stringify({ game: "snake", earned: score * 2, score: score }));
            }
            snake.unshift(newHead);
        }
        let game = setInterval(draw, 150);
    </script>
</body>
</html>
