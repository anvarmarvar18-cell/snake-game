<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake: Cyber Evolution</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗА И ИДЕАЛЬНАЯ ЗАЩИТА */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'SF Pro Display', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #050508; overflow: hidden; touch-action: none; color: white; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* ГЛАССМОРФИЗМ UI */
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .hud-panel { background: rgba(10, 15, 30, 0.65); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 255, 0.2); padding: 15px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .score-label { color: #88ccff; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
        .score-val { color: #fff; font-size: 38px; font-weight: 900; text-shadow: 0 0 15px #0ff; line-height: 1.1; }
        .coins-val { color: #ffd700; font-size: 18px; font-weight: 800; margin-top: 5px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); display: flex; align-items: center; gap: 8px; }
        
        /* КНОПКА МЕНЮ */
        .smart-menu-btn { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(10, 15, 30, 0.7); backdrop-filter: blur(10px); color: #0ff; border: 1px solid rgba(0,255,255,0.4); border-radius: 16px; padding: 12px 20px; font-weight: 900; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 255, 0.15); transition: 0.2s; pointer-events: auto; }
        .smart-menu-btn:active { transform: scale(0.92); }

        /* ЭЛИТНЫЕ МОДАЛЬНЫЕ ОКНА */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 1, 8, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: radial-gradient(circle at top right, #111a3a, #050814); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 28px; width: 88%; max-width: 420px; max-height: 85vh; padding: 30px; display: flex; flex-direction: column; gap: 15px; text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9); transform: scale(0.95); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal.active .modal-content { transform: scale(1); }
        
        .modal-title { color: #fff; text-transform: uppercase; letter-spacing: 4px; font-size: 24px; font-weight: 900; background: linear-gradient(90deg, #fff, #0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { padding: 16px; font-size: 16px; font-weight: 900; border-radius: 16px; color: white; border: none; text-transform: uppercase; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .btn:active { transform: scale(0.95) translateY(2px); }
        .btn-green { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .btn-blue { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .btn-red { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-gold { background: linear-gradient(135deg, #f12711, #f5af19); color: #000; }

        /* МАГАЗИН И ПРОКАЧКА */
        .shop-container { overflow-y: auto; max-height: 50vh; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; padding: 5px; border-radius: 16px; }
        .shop-container::-webkit-scrollbar { width: 5px; }
        .shop-container::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.5); border-radius: 10px; }
        
        .card { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; text-align: left; }
        .card.active { background: rgba(0, 255, 255, 0.08); border-color: rgba(0, 255, 255, 0.8); box-shadow: 0 0 20px rgba(0,255,255,0.15); }
        .card-icon { font-size: 28px; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 50%; background: rgba(0,0,0,0.5); }
        
        .buy-btn { padding: 12px 16px; border-radius: 12px; border: none; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-buy { background: #ffd700; color: #000; }
        .btn-select { background: #0ff; color: #000; }
        .btn-max { background: rgba(255,255,255,0.1); color: #888; pointer-events: none; }

        /* ВСПЛЫВАЮЩИЕ ЦИФРЫ */
        .float-text { position: absolute; font-size: 24px; font-weight: 900; color: #fff; pointer-events: none; animation: floatUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; z-index: 500; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
        
        /* ШЕЙДЕР СМЕРТИ */
        .glitch-effect { animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel">
            <div class="score-label">Очки</div>
            <div class="score-val" id="score">0</div>
            <div class="coins-val">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffd700"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.64-2.25 1.64-1.74 0-2.24-1.06-2.28-1.92H7.9c.04 1.46 1.06 2.67 2.97 3.03V19h1.76v-1.67c1.76-.3 2.94-1.42 2.94-2.93 0-2.36-1.98-3.07-3.26-3.36z"/></svg>
                <span id="coins">0</span>
            </div>
        </div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">⚙️ MENU</button>
    <canvas id="gameCanvas"></canvas>

    <!-- МЕНЮ ПАУЗЫ -->
    <div id="smartModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">ТЕРМИНАЛ</div>
            <button class="btn btn-gold" onclick="openShop('boosts')">⚡ УЛУЧШЕНИЯ</button>
            <button class="btn btn-blue" onclick="openShop('skins')">🧬 МУТАЦИИ (СКИНЫ)</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ВЫХОД В БАЗУ</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- УНИВЕРСАЛЬНЫЙ МАГАЗИН -->
    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="shopTitle">МАГАЗИН</div>
            <div style="color: #ffd700; font-weight: 900; font-size: 18px; margin-bottom: 5px;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="shopList"></div>
            <button class="btn btn-green" onclick="closeShop()">НАЗАД</button>
        </div>
    </div>

    <!-- ЭКРАН СМЕРТИ -->
    <div id="gameOverScreen" class="modal">
        <div class="modal-content" style="background: rgba(10,0,5,0.95); border-color: #ff0055;">
            <h1 style="color: #ff0055; font-size: 42px; text-shadow: 0 0 30px #ff0055; font-weight: 900;">СВЯЗЬ ПРЕРВАНА</h1>
            <p style="color: #aaa; font-size: 16px; margin-bottom: 20px;">Критическое столкновение</p>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 12px;">🔄 РЕСПАВН</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ЗАБРАТЬ МОНЕТЫ</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ И ЗАЩИТА
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', e => {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗЫ ДАННЫХ (ЭКОНОМИКА)
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'Cyber Python', price: 0, head: '#00ffff', body: '#0088cc', glow: '#00ffff', icon: '🐍' },
        { id: 'blood', name: 'Blood Worm', price: 1000, head: '#ff0000', body: '#880000', glow: '#ff0000', icon: '🩸' },
        { id: 'toxic', name: 'Acid Mamba', price: 1500, head: '#39ff14', body: '#008800', glow: '#39ff14', icon: '🧪' },
        { id: 'gold', name: 'Golden Wyrm', price: 2000, head: '#ffd700', body: '#ccaa00', glow: '#ffd700', icon: '👑' },
        { id: 'amethyst', name: 'Amethyst', price: 2500, head: '#d400ff', body: '#8800cc', glow: '#d400ff', icon: '🔮' },
        { id: 'ghost', name: 'Phantom', price: 3000, head: '#ffffff', body: '#aaaaaa', glow: '#ffffff', icon: '👻' },
        { id: 'fire', name: 'Fire Dragon', price: 3500, head: '#ff8c00', body: '#ff0000', glow: '#ff4500', icon: '🔥' },
        { id: 'black_hole', name: 'Dark Matter (+20%)', price: 5000, head: '#000000', body: '#222222', glow: '#800080', icon: '🌀' }
    ];

    const UPGRADES = {
        multiplier: { name: 'Coin Magnet', desc: 'Увеличивает добычу монет', icon: '🧲', baseCost: 1000, costMult: 1.5, maxLvl: 10, val: 1 }, // +1 монета за уровень
        scoreBoost: { name: 'Score Booster', desc: 'Ускоряет набор очков', icon: '📈', baseCost: 1500, costMult: 1.5, maxLvl: 5, val: 1 } // +1 очко за уровень
    };

    let localCoins = parseInt(localStorage.getItem('snake_coins')) || 0;
    let unlockedSkins = JSON.parse(localStorage.getItem('snake_skins')) || ['default'];
    let activeSkin = localStorage.getItem('snake_active_skin') || 'default';
    let levels = JSON.parse(localStorage.getItem('snake_levels')) || { multiplier: 1, scoreBoost: 1 };
    
    let sessionCoins = 0; let startTime = Date.now();

    // ==========================================
    // 3. АРХИТЕКТУРА ИГРЫ (AAA Grid + Lerp Render)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = canvas.width = window.innerWidth;
    let ch = canvas.height = window.innerHeight;

    let gameState = 'start'; 
    let score = 0;

    // Сетка (адаптивная)
    const gridSize = Math.floor(cw / 20); // 20 клеток в ширину
    const cols = Math.floor(cw / gridSize);
    const rows = Math.floor(ch / gridSize);
    
    // Центрируем игровое поле
    const offsetX = (cw - cols * gridSize) / 2;
    const offsetY = (ch - rows * gridSize) / 2;

    let snake = [];
    let dir = {x: 0, y: -1}; // Вектор движения
    let swipeQueue = []; // Очередь свайпов (чтобы не пропускать команды!)
    let food = {};
    
    let frames = 0;
    let baseSpeed = 8; // Кадры между шагами (меньше = быстрее)
    
    let particles = [];
    let shockwaves = []; // Эффект волны при поедании

    function initGame() {
        score = 0; sessionCoins = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('coins').innerText = sessionCoins;
        
        let startX = Math.floor(cols / 2);
        let startY = Math.floor(rows / 2);
        // Змея из 3 сегментов
        snake = [ {x: startX, y: startY}, {x: startX, y: startY+1}, {x: startX, y: startY+2} ];
        
        dir = {x: 0, y: -1};
        swipeQueue = [];
        baseSpeed = 8;
        
        spawnFood();
        particles = []; shockwaves = [];
        gameState = 'playing';
    }

    function spawnFood() {
        let valid = false;
        while (!valid) {
            food.x = Math.floor(Math.random() * (cols - 2)) + 1;
            food.y = Math.floor(Math.random() * (rows - 4)) + 4; // Отступ от UI сверху
            valid = true;
            for (let s of snake) { if (s.x === food.x && s.y === food.y) valid = false; }
        }
        // 10% шанс на ЗОЛОТОЕ яблоко
        food.isGold = Math.random() < 0.1;
    }

    function createShockwave(x, y, color) {
        shockwaves.push({ x: x, y: y, radius: 0, maxRadius: gridSize * 4, alpha: 1, color: color });
    }

    function createParticles(x, y, color) {
        for(let i=0; i<12; i++) {
            particles.push({
                x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                life: 1, color: color, size: Math.random()*4 + 2
            });
        }
    }

    function createFloatText(x, y, txt, color) {
        const el = document.createElement('div');
        el.className = 'float-text'; el.innerText = txt;
        el.style.color = color;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    // --- ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ (ЛОГИКА + РЕНДЕР) ---
    function loop() {
        requestAnimationFrame(loop);
        if (gameState !== 'playing') return;

        frames++;
        
        // 1. ЛОГИКА ДВИЖЕНИЯ (Выполняется раз в N кадров)
        if (frames >= baseSpeed) {
            frames = 0;
            
            // Идеальная обработка очереди свайпов
            if (swipeQueue.length > 0) {
                let nextDir = swipeQueue.shift();
                // Защита от разворота на 180 градусов
                if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
                    dir = nextDir;
                }
            }

            let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            // Смерть от стен
            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
                gameOver(); return;
            }
            // Смерть от себя
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver(); return;
                }
            }

            snake.unshift(head); // Добавляем новую голову

            // Поедание еды
            if (head.x === food.x && head.y === food.y) {
                let skin = SKINS.find(s => s.id === activeSkin);
                
                // Прокачка работает здесь!
                let pts = food.isGold ? 3 : 1;
                let coinsReward = (food.isGold ? 50 : 10) + (levels.multiplier - 1);
                
                score += pts + (levels.scoreBoost - 1);
                sessionCoins += coinsReward; localCoins += coinsReward;
                
                document.getElementById('score').innerText = score;
                document.getElementById('coins').innerText = sessionCoins;
                
                let px = offsetX + head.x * gridSize + gridSize/2;
                let py = offsetY + head.y * gridSize + gridSize/2;
                
                createShockwave(px, py, food.isGold ? '#ffd700' : skin.head);
                createParticles(px, py, food.isGold ? '#ffd700' : '#fff');
                createFloatText(px - 15, py - 30, `+${coinsReward}`, food.isGold ? '#ffd700' : '#0ff');
                
                // Усложнение: каждые 10 очков скорость чуть растет
                if (score % 10 === 0 && baseSpeed > 3) baseSpeed--;
                
                spawnFood();
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            } else {
                snake.pop(); // Если не съели, удаляем хвост
            }
        }

        // 2. РЕНДЕР (Отрисовка в 60 FPS)
        ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, cw, ch);

        // Кибер-сетка на фоне
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<=cols; i++) { ctx.moveTo(offsetX + i*gridSize, offsetY); ctx.lineTo(offsetX + i*gridSize, offsetY + rows*gridSize); }
        for(let i=0; i<=rows; i++) { ctx.moveTo(offsetX, offsetY + i*gridSize); ctx.lineTo(offsetX + cols*gridSize, offsetY + i*gridSize); }
        ctx.stroke();

        let skin = SKINS.find(s => s.id === activeSkin);

        // Ударные волны
        for(let i=shockwaves.length-1; i>=0; i--) {
            let sw = shockwaves[i];
            sw.radius += 8; sw.alpha -= 0.05;
            if(sw.alpha <= 0) { shockwaves.splice(i, 1); continue; }
            ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI*2);
            ctx.strokeStyle = `rgba(${hexToRgb(sw.color)}, ${sw.alpha})`;
            ctx.lineWidth = 4; ctx.stroke();
        }

        // Отрисовка ЕДЫ
        let fx = offsetX + food.x * gridSize + gridSize/2;
        let fy = offsetY + food.y * gridSize + gridSize/2;
        ctx.shadowBlur = 20; ctx.shadowColor = food.isGold ? '#ffd700' : '#ff0055';
        ctx.fillStyle = food.isGold ? '#ffd700' : '#ff0055';
        ctx.beginPath(); ctx.arc(fx, fy, gridSize*0.4, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // Отрисовка ЗМЕИ (Гладкие круги)
        for (let i = snake.length - 1; i >= 0; i--) {
            let seg = snake[i];
            let px = offsetX + seg.x * gridSize + gridSize/2;
            let py = offsetY + seg.y * gridSize + gridSize/2;
            
            // Хвост плавно сужается
            let radius = (gridSize * 0.45) * (1 - (i / snake.length) * 0.5);
            
            ctx.shadowBlur = i === 0 ? 25 : 10;
            ctx.shadowColor = skin.glow;
            
            // 3D Градиент для тела
            let grad = ctx.createRadialGradient(px-2, py-2, radius*0.2, px, py, radius);
            grad.addColorStop(0, i === 0 ? skin.head : skin.body);
            grad.addColorStop(1, i === 0 ? skin.glow : '#000');
            
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI*2); ctx.fill();

            // Глаза на голове
            if (i === 0) {
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
                let eyeOffX = dir.x === 0 ? radius*0.5 : dir.x * radius*0.4;
                let eyeOffY = dir.y === 0 ? radius*0.5 : dir.y * radius*0.4;
                ctx.beginPath(); ctx.arc(px + (dir.y === 0 ? eyeOffX : -radius*0.4), py + (dir.x === 0 ? eyeOffY : -radius*0.4), radius*0.3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + (dir.y === 0 ? eyeOffX : radius*0.4), py + (dir.x === 0 ? eyeOffY : radius*0.4), radius*0.3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(px + (dir.y === 0 ? eyeOffX : -radius*0.4) + dir.x*2, py + (dir.x === 0 ? eyeOffY : -radius*0.4) + dir.y*2, radius*0.15, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + (dir.y === 0 ? eyeOffX : radius*0.4) + dir.x*2, py + (dir.x === 0 ? eyeOffY : radius*0.4) + dir.y*2, radius*0.15, 0, Math.PI*2); ctx.fill();
            }
        }

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color; ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
    }

    // Хелпер для цвета
    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '0,255,255';
    }

    // ==========================================
    // 4. УПРАВЛЕНИЕ СВАЙПАМИ (ИДЕАЛЬНЫЙ АЛГОРИТМ)
    // ==========================================
    let touchStartX = 0; let touchStartY = 0;

    window.addEventListener('touchstart', e => {
        if(e.target.closest('.smart-menu-btn') || e.target.closest('.modal')) return;
        if(gameState === 'start') { initGame(); return; }
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: false});

    window.addEventListener('touchend', e => {
        if (gameState !== 'playing') return;
        let dx = e.changedTouches[0].screenX - touchStartX;
        let dy = e.changedTouches[0].screenY - touchStartY;
        
        // Порог свайпа 30px
        if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
            let newDir = null;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) newDir = {x: 1, y: 0}; // Вправо
                else newDir = {x: -1, y: 0}; // Влево
            } else {
                if (dy > 0) newDir = {x: 0, y: 1}; // Вниз
                else newDir = {x: 0, y: -1}; // Вверх
            }
            
            // ДОБАВЛЯЕМ В ОЧЕРЕДЬ (Защита от быстрых двойных свайпов)
            if (newDir) {
                let lastDirInQueue = swipeQueue.length > 0 ? swipeQueue[swipeQueue.length - 1] : dir;
                // Нельзя добавлять поворот на 180
                if (newDir.x !== -lastDirInQueue.x || newDir.y !== -lastDirInQueue.y) {
                    if (swipeQueue.length < 3) swipeQueue.push(newDir); // Максимум 3 команды в памяти
                }
            }
        }
    });

    function gameOver() {
        gameState = 'gameover';
        // Мега-взрыв головы змеи
        let head = snake[0];
        createParticles(offsetX + head.x * gridSize, offsetY + head.y * gridSize, '#ff0000');
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        
        document.body.classList.add('glitch-effect');
        setTimeout(() => document.body.classList.remove('glitch-effect'), 300);
        
        localStorage.setItem('snake_coins', localCoins);
        setTimeout(() => document.getElementById('gameOverScreen').classList.add('active'), 500);
    }

    function resetGame() {
        document.getElementById('gameOverScreen').classList.remove('active');
        gameState = 'start';
    }

    // ==========================================
    // 5. МЕНЮ, МАГАЗИН И БОНУСЫ
    // ==========================================
    document.getElementById('mainMenuBtn').onclick = () => {
        if(gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.add('active');
    }
    function closeMenu() {
        document.getElementById('smartModal').classList.remove('active');
        if(gameState === 'paused') gameState = 'playing';
    }

    function openShop(type) {
        document.getElementById('smartModal').classList.remove('active');
        document.getElementById('shopModal').classList.add('active');
        document.getElementById('shopCoins').innerText = localCoins.toLocaleString();
        
        const list = document.getElementById('shopList'); list.innerHTML = '';
        
        if (type === 'skins') {
            document.getElementById('shopTitle').innerText = 'МУТАЦИИ ЗМЕИ';
            SKINS.forEach(s => {
                let isUnl = unlockedSkins.includes(s.id); let isAct = activeSkin === s.id;
                let btn = isAct ? `<button class="buy-btn btn-max">АКТИВЕН</button>` :
                          isUnl ? `<button class="buy-btn btn-select" onclick="equipSkin('${s.id}')">ВЫБРАТЬ</button>` :
                          `<button class="buy-btn btn-buy" onclick="buySkin('${s.id}', ${s.price})">${s.price.toLocaleString()}💰</button>`;

                list.innerHTML += `
                    <div class="card ${isAct ? 'active' : ''}">
                        <div class="card-icon" style="box-shadow: 0 0 15px ${s.glow}; border: 2px solid ${s.head};">${s.icon}</div>
                        <div style="flex-grow:1; margin-left:15px;">
                            <div style="font-weight:900; font-size:16px;">${s.name}</div>
                        </div>
                        ${btn}
                    </div>`;
            });
        } else if (type === 'boosts') {
            document.getElementById('shopTitle').innerText = 'УЛУЧШЕНИЯ';
            Object.keys(UPGRADES).forEach(key => {
                let u = UPGRADES[key]; let lvl = levels[key];
                let isMax = lvl >= u.maxLvl;
                let cost = Math.floor(u.baseCost * Math.pow(u.costMult, lvl));
                
                let btn = isMax ? `<button class="buy-btn btn-max">MAX LVL</button>` :
                                  `<button class="buy-btn btn-buy" onclick="buyUpgrade('${key}', ${cost})">${cost.toLocaleString()}💰</button>`;

                list.innerHTML += `
                    <div class="card">
                        <div class="card-icon">${u.icon}</div>
                        <div style="flex-grow:1; margin-left:15px;">
                            <div style="font-weight:900; font-size:16px;">${u.name} <span style="color:#0ff; font-size:12px;">Lvl ${lvl}</span></div>
                            <div style="font-size:12px; color:#aaa;">${u.desc}</div>
                        </div>
                        ${btn}
                    </div>`;
            });
        }
    }

    function closeShop() { document.getElementById('shopModal').classList.remove('active'); document.getElementById('smartModal').classList.add('active'); }

    window.buySkin = function(id, price) {
        if (localCoins >= price) { localCoins -= price; unlockedSkins.push(id); equipSkin(id); saveData(); }
        else tg.showAlert('Недостаточно монет для мутации!');
    }
    window.equipSkin = function(id) { activeSkin = id; openShop('skins'); saveData(); }

    window.buyUpgrade = function(key, cost) {
        if (localCoins >= cost) {
            localCoins -= cost; levels[key]++; openShop('boosts'); saveData();
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else {
            tg.showAlert('Нужно больше золота, милорд!');
        }
    }

    function saveData() {
        localStorage.setItem('snake_coins', localCoins);
        localStorage.setItem('snake_skins', JSON.stringify(unlockedSkins));
        localStorage.setItem('snake_active_skin', activeSkin);
        localStorage.setItem('snake_levels', JSON.stringify(levels));
    }

    window.saveAndExit = function() {
        saveData();
        tg.sendData(JSON.stringify({ game: "snake", coins: sessionCoins, score: score, time_spent: Math.floor((Date.now() - startTime) / 1000), active_skin: activeSkin }));
    }

    // СТАРТ
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#0ff'; ctx.font = '900 24px Arial'; ctx.textAlign = 'center';
    ctx.fillText("ТАПНИ ЧТОБЫ ПОЛЗТИ", cw/2, ch/2);
    requestAnimationFrame(loop);

</script>
</body>
</html>
