<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #050510; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: white; touch-action: none; font-family: 'Courier New', monospace;}
        canvas { background-color: #0a0a1a; border: 2px solid #00ffcc; box-shadow: 0 0 30px rgba(0, 255, 204, 0.5); border-radius: 10px; }
        #scoreBoard { position: absolute; top: 5%; font-size: 35px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
    </style>
</head>
<body>
    <div id="scoreBoard">Счет: 0</div>
    <canvas id="gameCanvas" width="320" height="400"></canvas>
    
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = 20; let score = 0;
        
        let snake = []; snake[0] = { x: 8 * box, y: 10 * box };
        let food = { x: Math.floor(Math.random()*15)*box, y: Math.floor(Math.random()*19)*box };
        let d = "UP";

        // Читаем скин змейки из ссылки
        const urlParams = new URLSearchParams(window.location.search);
        const skin = urlParams.get('skin') || 'neon';
        let headColor = skin === 'fire' ? '#ff3300' : '#00ffcc';
        let bodyColor = skin === 'fire' ? '#ff9900' : '#00aa88';

        // Управление свайпами
        let touchStartX = 0; let touchStartY = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; });
        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].screenX - touchStartX; let dy = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && d != "LEFT") d = "RIGHT"; else if (dx < -30 && d != "RIGHT") d = "LEFT";
            } else {
                if (dy > 30 && d != "UP") d = "DOWN"; else if (dy < -30 && d != "DOWN") d = "UP";
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Рисуем сетку для красоты
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            for(let i=0; i<=320; i+=20) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,400); ctx.stroke(); }
            for(let i=0; i<=400; i+=20) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(320,i); ctx.stroke(); }

            for(let i = 0; i < snake.length; i++){
                ctx.fillStyle = (i === 0) ? headColor : bodyColor;
                ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(snake[i].x, snake[i].y, box-2, box-2);
                ctx.shadowBlur = 0;
            }
            
            ctx.fillStyle = "#ff00ff"; ctx.shadowBlur = 15; ctx.shadowColor = "#ff00ff";
            ctx.fillRect(food.x, food.y, box-2, box-2); ctx.shadowBlur = 0;
            
            let snakeX = snake[0].x; let snakeY = snake[0].y;
            if(d == "LEFT") snakeX -= box; if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box; if(d == "DOWN") snakeY += box;
            
            if(snakeX == food.x && snakeY == food.y){
                score++; document.getElementById('scoreBoard').innerText = "Счет: " + score;
                food = { x: Math.floor(Math.random()*15)*box, y: Math.floor(Math.random()*19)*box };
            } else { snake.pop(); }
            
            let newHead = { x: snakeX, y: snakeY };
            
            // Проигрыш
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)){
                clearInterval(game);
                document.getElementById('scoreBoard').innerText = "ИГРА ОКОНЧЕНА";
                setTimeout(() => { tg.sendData(JSON.stringify({ game: "snake", earned: score * 3, score: score })); }, 1000); // 3 монеты за яблоко
            }
            snake.unshift(newHead);
        }
        function collision(head, array) { for(let i = 0; i < array.length; i++) { if(head.x == array[i].x && head.y == array[i].y) return true; } return false; }
        
        let game = setInterval(draw, 120);
    </script>
</body>
</html>
