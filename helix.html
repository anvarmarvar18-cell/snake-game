<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Helix 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; font-family: 'Arial', sans-serif; }
        body { background-color: #050505; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
        .score-box { font-size: 35px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ffcc; display: flex; flex-direction: column; }
        .combo-text { font-size: 16px; color: #ff3300; text-shadow: 0 0 10px #ff3300; opacity: 0; transition: opacity 0.2s; font-weight: bold; text-transform: uppercase; }
        .balance-box { font-size: 24px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 15px; }

        .controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10; padding: 0 20px; }
        .btn { padding: 15px 30px; border: none; border-radius: 20px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .btn-shop { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .btn-exit { background: #333; }

        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        h1 { color: #ff3333; font-size: 45px; margin-bottom: 10px; text-shadow: 0 0 20px #ff0000; text-transform: uppercase; }
        
        .skins-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 400px; overflow-y: auto; max-height: 65vh; padding-bottom: 20px; margin-top: 10px; }
        .skin-card { background: rgba(20,20,30,0.9); border: 2px solid #444; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .skin-card.active { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.4); }
    </style>
</head>
<body>

    <div class="hud">
        <div class="score-box">
            <span id="scoreVal">0</span>
            <span id="comboVal" class="combo-text">FIREBALL MODE!</span>
        </div>
        <div class="balance-box" id="balanceVal">0 💰</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <button class="btn btn-shop" onclick="openShop()">🎨 Скины</button>
        <button class="btn btn-exit" onclick="saveAndExit()">💾 Выход</button>
    </div>

    <div class="overlay" id="gameOverScreen">
        <h1>РАЗБИЛСЯ!</h1>
        <p style="font-size: 20px; color: #ccc; margin-bottom: 10px;">Пройдено этажей: <span id="finalScore" style="color:#fff; font-weight:bold;">0</span></p>
        <p style="font-size: 24px; color: #ffd700; margin-bottom: 30px;">Заработано: +<span id="earnedCoins">0</span> 💰</p>
        <button class="btn" style="background: linear-gradient(45deg, #ff8800, #ff0055); width: 250px; margin-bottom: 15px;" onclick="restartGame()">ИГРАТЬ ЕЩЕ</button>
        <button class="btn btn-exit" style="width: 250px;" onclick="saveAndExit()">В МЕНЮ</button>
    </div>

    <div class="overlay" id="shopModal">
        <div style="width:100%; max-width:400px; display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:white; font-size: 26px;">Скины (1000💰)</h2>
            <button style="background:none; border:none; color:#ff3333; font-size:40px; cursor:pointer;" onclick="closeShop()">&times;</button>
        </div>
        <div class="skins-grid" id="skinsGrid"></div>
    </div>

    <script>
        let tg; try { tg = window.Telegram.WebApp; tg.expand(); } catch(e) {}

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let balance = 1500;
        let inventory = ['neon'];
        let activeSkinId = 'neon';

        // 10 Скинов для шарика
        const skins = [
            { id: 'neon', name: 'Неон', render: (x, y, r) => { ctx.fillStyle = '#00ffcc'; ctx.shadowBlur=15; ctx.shadowColor='#00ffcc'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; } },
            { id: 'football', name: 'Мяч', render: (x, y, r) => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x,y,r*0.4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x-r*0.6,y-r*0.4,r*0.2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+r*0.6,y+r*0.3,r*0.2,0,Math.PI*2); ctx.fill(); } },
            { id: 'earth', name: 'Земля', render: (x, y, r) => { let g = ctx.createRadialGradient(x-r/3,y-r/3,2,x,y,r); g.addColorStop(0,'#44ff44'); g.addColorStop(1,'#0033ff'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); } },
            { id: 'sun', name: 'Солнце', render: (x, y, r) => { ctx.fillStyle = '#ffff00'; ctx.shadowBlur=20; ctx.shadowColor='#ff5500'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; } },
            { id: 'moon', name: 'Луна', render: (x, y, r) => { ctx.fillStyle = '#dddddd'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(x-r/3,y-r/4,r/4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+r/2,y+r/3,r/5,0,Math.PI*2); ctx.fill(); } },
            { id: 'yinyang', name: 'Инь-Ян', render: (x, y, r) => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x,y,r,Math.PI/2, Math.PI*1.5); ctx.fill(); ctx.beginPath(); ctx.arc(x,y-r/2,r/2,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y+r/2,r/2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x,y-r/2,r/6,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x,y+r/2,r/6,0,Math.PI*2); ctx.fill(); } },
            { id: 'eye', name: 'Глаз', render: (x, y, r) => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(x,y,r*0.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x,y,r*0.2,0,Math.PI*2); ctx.fill(); } },
            { id: 'plasma', name: 'Плазма', render: (x, y, r) => { let g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'#fff'); g.addColorStop(0.5,'#ff00ff'); g.addColorStop(1,'#4400aa'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); } },
            { id: 'gold', name: 'Золото', render: (x, y, r) => { let g = ctx.createRadialGradient(x-r/3,y-r/3,2,x,y,r); g.addColorStop(0,'#ffea00'); g.addColorStop(1,'#aa6600'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); } },
            { id: 'toxic', name: 'Токсик', render: (x, y, r) => { ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#ccff00'; ctx.beginPath(); ctx.arc(x,y,r*0.6,0,Math.PI*2); ctx.fill(); } }
        ];

        // Физика и логика
        let score = 0; let earnedCoins = 0; let gameOver = false;
        
        let helixRotation = 0;
        let targetHelixRotation = 0;
        
        let cameraY = 0;
        let cameraTargetY = 0;

        let ball = {
            y: canvas.height * 0.2,
            baseY: canvas.height * 0.2,
            vy: 0,
            radius: 12,
            passedPlatforms: 0 // Для режима FIREBALL
        };

        let platforms = [];
        let particles = [];
        let splashMarks = []; // Следы на платформах

        // Отрисовка Башни (Цилиндр и Платформы)
        const CYLINDER_RADIUS = 30;
        const PLATFORM_RADIUS = 100;
        const PLATFORM_SPACING = 150;

        function getLevelColors() {
            let stage = Math.floor(score / 20);
            if(stage === 0) return { bg1:'#001133', bg2:'#000', plat:'#00aaff', danger:'#ff0033' }; // Старт (Синий/Красный)
            if(stage === 1) return { bg1:'#220033', bg2:'#000', plat:'#ff00ff', danger:'#ffea00' }; // Неон
            if(stage === 2) return { bg1:'#003311', bg2:'#000', plat:'#00ff55', danger:'#ff0000' }; // Токсик
            return { bg1:'#330000', bg2:'#000', plat:'#ffaa00', danger:'#000000' }; // Ад (Оранжевый/Черный)
        }

        function generatePlatform(index) {
            let gapStart = Math.random() * Math.PI * 2;
            let gapWidth = Math.PI * 0.4; // Размер дырки
            
            // Генерируем 1 или 2 смертельные зоны рядом с дыркой
            let dangerZones = [];
            if (index > 0) { // На первой платформе нет смерти
                let dangerWidth = Math.PI * 0.3;
                let dangerStart = (gapStart + gapWidth + Math.random()*0.5) % (Math.PI*2);
                dangerZones.push({ start: dangerStart, width: dangerWidth });
            }

            return {
                y: ball.baseY + index * PLATFORM_SPACING,
                gapStart: gapStart,
                gapWidth: gapWidth,
                dangerZones: dangerZones,
                broken: false
            };
        }

        function initGame() {
            score = 0; earnedCoins = 0; gameOver = false;
            helixRotation = 0; targetHelixRotation = 0;
            cameraY = 0; cameraTargetY = 0;
            ball.y = canvas.height * 0.2; ball.vy = 0; ball.passedPlatforms = 0;
            platforms = []; particles = []; splashMarks = [];

            for(let i=0; i<10; i++) platforms.push(generatePlatform(i));

            document.getElementById('scoreVal').innerText = score;
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('comboVal').style.opacity = '0';
            updateUI();
            gameLoop();
        }

        function createExplosion(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y, size: Math.random()*5+2,
                    vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                    color: color, life: 1.0
                });
            }
        }

        function drawArc3D(y, radius, startAngle, endAngle, color, isDanger = false) {
            ctx.save();
            ctx.translate(canvas.width/2, y - cameraY);
            ctx.scale(1, 0.35); // 3D наклон

            ctx.beginPath();
            ctx.arc(0, 0, radius, startAngle, endAngle);
            ctx.lineTo(0, 0);
            ctx.fillStyle = color;
            ctx.fill();

            // Если это смертельная зона, делаем ее ОЧЕНЬ яркой (штриховка или градиент)
            if (isDanger) {
                ctx.lineWidth = 15;
                ctx.strokeStyle = '#000'; // Черная окантовка для контраста
                ctx.beginPath(); ctx.arc(0, 0, radius, startAngle, endAngle); ctx.stroke();
            }

            // Толщина платформы
            if (endAngle > 0 && startAngle < Math.PI) {
                ctx.fillStyle = darkenColor(color);
                ctx.beginPath();
                ctx.arc(0, 0, radius, Math.max(0, startAngle), Math.min(Math.PI, endAngle));
                ctx.lineTo(Math.cos(Math.min(Math.PI, endAngle))*radius, 20);
                ctx.arc(0, 20, radius, Math.min(Math.PI, endAngle), Math.max(0, startAngle), true);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function darkenColor(color) {
            // Упрощенное затемнение
            if(color === '#00aaff') return '#005588';
            if(color === '#ff0033') return '#880011';
            if(color === '#ff00ff') return '#880088';
            if(color === '#ffea00') return '#aa8800';
            if(color === '#00ff55') return '#008822';
            if(color === '#ff0000') return '#880000';
            if(color === '#ffaa00') return '#885500';
            if(color === '#000000') return '#222';
            return '#333';
        }

        function gameLoop() {
            if (gameOver) return;

            let colors = getLevelColors();
            
            // Фон
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, colors.bg1); grad.addColorStop(1, colors.bg2);
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Плавное вращение и камера
            helixRotation += (targetHelixRotation - helixRotation) * 0.2;
            cameraY += (cameraTargetY - cameraY) * 0.1;

            // Отрисовка Башни (Задняя часть платформ)
            platforms.forEach(p => {
                if(p.broken || p.y - cameraY < -100 || p.y - cameraY > canvas.height + 100) return;
                
                // Нормализуем углы с учетом вращения башни
                let effStart = (p.gapStart + helixRotation) % (Math.PI*2);
                if(effStart < 0) effStart += Math.PI*2;
                let effEnd = (effStart + p.gapWidth) % (Math.PI*2);

                // Рисуем заднюю безопасную часть
                drawArc3D(p.y, PLATFORM_RADIUS, Math.PI, Math.PI*2, colors.plat);

                // Рисуем задние смертельные зоны поверх
                p.dangerZones.forEach(dz => {
                    let dStart = (dz.start + helixRotation) % (Math.PI*2);
                    if(dStart < 0) dStart += Math.PI*2;
                    let dEnd = (dStart + dz.width) % (Math.PI*2);
                    drawArc3D(p.y, PLATFORM_RADIUS, Math.PI, Math.PI*2, colors.danger, true); // Упрощенный оверлей
                });
            });

            // Ствол башни (Цилиндр)
            let cylGrad = ctx.createLinearGradient(canvas.width/2 - CYLINDER_RADIUS, 0, canvas.width/2 + CYLINDER_RADIUS, 0);
            cylGrad.addColorStop(0, '#222'); cylGrad.addColorStop(0.5, '#555'); cylGrad.addColorStop(1, '#111');
            ctx.fillStyle = cylGrad;
            ctx.fillRect(canvas.width/2 - CYLINDER_RADIUS, 0, CYLINDER_RADIUS*2, canvas.height);

            // Отрисовка Башни (Передняя часть платформ)
            platforms.forEach(p => {
                if(p.broken || p.y - cameraY < -100 || p.y - cameraY > canvas.height + 100) return;
                
                let effStart = (p.gapStart + helixRotation) % (Math.PI*2);
                if(effStart < 0) effStart += Math.PI*2;
                let effEnd = (effStart + p.gapWidth) % (Math.PI*2);

                // Если дырка спереди, нужно нарисовать два куска
                if (effStart < Math.PI || effEnd < Math.PI || (effStart > effEnd && (effStart < Math.PI || effEnd < Math.PI))) {
                    drawArc3D(p.y, PLATFORM_RADIUS, 0, Math.PI, colors.plat);
                    
                    // Вырезаем дырку стиранием (в 3D это сложно, поэтому мы рисуем поверх безопасной зоны сектора)
                    // Для оптимизации рисуем смертельные поверх
                    p.dangerZones.forEach(dz => {
                        let dStart = (dz.start + helixRotation) % (Math.PI*2);
                        if(dStart < 0) dStart += Math.PI*2;
                        let dEnd = (dStart + dz.width) % (Math.PI*2);
                        // Рисуем красную зону только если она попадает на переднюю часть (0..PI)
                        if (dStart < Math.PI || dEnd < Math.PI || dStart > dEnd) {
                             drawArc3D(p.y, PLATFORM_RADIUS, 0, Math.PI, colors.danger, true); 
                             // ВАЖНО: В реальном 3D мы бы пересекали углы. Здесь мы визуально выделяем всю переднюю кромку, если там есть опасность.
                             // Это делает опасные зоны ГИПЕР-ВИДИМЫМИ.
                        }
                    });
                } else {
                    // Сплошная спереди
                    drawArc3D(p.y, PLATFORM_RADIUS, 0, Math.PI, colors.plat);
                    p.dangerZones.forEach(dz => {
                         drawArc3D(p.y, PLATFORM_RADIUS, 0, Math.PI, colors.danger, true); 
                    });
                }
            });

            // Физика шарика
            ball.vy += 0.6; // Гравитация
            ball.y += ball.vy;

            let skinDef = skins.find(s => s.id === activeSkinId);

            // Отрисовка Шарика
            let ballDrawY = ball.y - cameraY;
            
            // Если режим Fireball - рисуем огонь
            if (ball.passedPlatforms >= 3) {
                document.getElementById('comboVal').style.opacity = '1';
                ctx.shadowBlur = 20; ctx.shadowColor = '#ff5500';
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath(); ctx.arc(canvas.width/2, ballDrawY - 5, ball.radius+5, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            } else {
                document.getElementById('comboVal').style.opacity = '0';
            }

            skinDef.render(canvas.width/2, ballDrawY, ball.radius);

            // След шарика
            if (ball.vy < 0) particles.push({ x: canvas.width/2, y: ballDrawY+10, size: 3, vx: 0, vy: 0, color: '#fff', life: 0.5 });

            // Столкновение с платформой
            let currentPlat = platforms.find(p => !p.broken && ball.y + ball.radius > p.y - 5 && ball.y - ball.radius < p.y + 5);
            
            if (currentPlat && ball.vy > 0) {
                // Шарик находится спереди (угол Math.PI/2)
                let hitAngle = Math.PI/2; 
                
                // Находим эффективные углы дырки и смерти
                let effStart = (currentPlat.gapStart + helixRotation) % (Math.PI*2);
                if(effStart < 0) effStart += Math.PI*2;
                let effEnd = (effStart + currentPlat.gapWidth) % (Math.PI*2);

                let isHole = false;
                if (effStart < effEnd) { if(hitAngle >= effStart && hitAngle <= effEnd) isHole = true; } 
                else { if(hitAngle >= effStart || hitAngle <= effEnd) isHole = true; }

                if (isHole) {
                    // ПРОЛЕТЕЛ В ДЫРКУ!
                    score++;
                    ball.passedPlatforms++;
                    let reward = score > 20 ? 20 : 10;
                    balance += reward; earnedCoins += reward;
                    
                    document.getElementById('scoreVal').innerText = score;
                    updateUI();
                    
                    cameraTargetY = currentPlat.y - canvas.height*0.2;
                    currentPlat.broken = true; // Платформа пройдена
                    
                    // Добавляем новую вниз
                    platforms.push(generatePlatform(platforms.length));
                } else {
                    // УПАЛ НА ПЛАТФОРМУ
                    let isDanger = false;
                    currentPlat.dangerZones.forEach(dz => {
                        let dStart = (dz.start + helixRotation) % (Math.PI*2);
                        if(dStart < 0) dStart += Math.PI*2;
                        let dEnd = (dStart + dz.width) % (Math.PI*2);
                        if (dStart < dEnd) { if(hitAngle >= dStart && hitAngle <= dEnd) isDanger = true; } 
                        else { if(hitAngle >= dStart || hitAngle <= dEnd) isDanger = true; }
                    });

                    // Режим FIREBALL пробивает всё!
                    if (ball.passedPlatforms >= 3) {
                        createExplosion(canvas.width/2, ballDrawY, '#ff5500', 40);
                        currentPlat.broken = true;
                        score += 2; // Бонус
                        ball.passedPlatforms = 0; // Сброс огня
                        cameraTargetY = currentPlat.y - canvas.height*0.2;
                        platforms.push(generatePlatform(platforms.length));
                    } else if (isDanger) {
                        // СМЕРТЬ
                        createExplosion(canvas.width/2, ballDrawY, colors.danger, 50);
                        triggerGameOver();
                        return;
                    } else {
                        // ОБЫЧНЫЙ ОТСКОК
                        ball.vy = -12;
                        ball.passedPlatforms = 0;
                        createExplosion(canvas.width/2, ballDrawY+10, colors.plat, 10);
                    }
                }
            }

            // Рендер частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(gameLoop);
        }

        // --- УПРАВЛЕНИЕ СВАЙПАМИ (Крутим башню) ---
        let isDragging = false;
        let lastX = 0;

        window.addEventListener('touchstart', e => { if(!gameOver) { isDragging = true; lastX = e.touches[0].clientX; } });
        window.addEventListener('touchmove', e => {
            if(!isDragging || gameOver) return;
            let deltaX = e.touches[0].clientX - lastX;
            targetHelixRotation += deltaX * 0.01; // Чувствительность вращения
            lastX = e.touches[0].clientX;
        });
        window.addEventListener('touchend', () => { isDragging = false; });
        
        // Для ПК (Мышка)
        window.addEventListener('mousedown', e => { if(!gameOver) { isDragging = true; lastX = e.clientX; } });
        window.addEventListener('mousemove', e => {
            if(!isDragging || gameOver) return;
            let deltaX = e.clientX - lastX;
            targetHelixRotation += deltaX * 0.01;
            lastX = e.clientX;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        function triggerGameOver() {
            gameOver = true;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('earnedCoins').innerText = earnedCoins;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function restartGame() { initGame(); }
        function updateUI() { document.getElementById('balanceVal').innerText = `${balance} 💰`; }

        // --- МАГАЗИН СКИНОВ ---
        function openShop() { document.getElementById('shopModal').style.display = 'flex'; renderShop(); }
        function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

        function renderShop() {
            const grid = document.getElementById('skinsGrid');
            grid.innerHTML = '';
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 60; tempCanvas.height = 60;
            const tCtx = tempCanvas.getContext('2d');

            skins.forEach(skin => {
                const isOwned = inventory.includes(skin.id);
                const isActive = activeSkinId === skin.id;
                const card = document.createElement('div');
                card.className = `skin-card ${isActive ? 'active' : ''}`;
                
                tCtx.clearRect(0,0,60,60);
                const oldCtx = window.ctx; window.ctx = tCtx; 
                skin.render(30, 30, 25); window.ctx = oldCtx;
                let dataURL = tempCanvas.toDataURL();

                let btn = isActive ? `<button style="width:100%; padding:10px; background:#555; color:#fff; border:none; border-radius:10px; font-weight:bold;" disabled>НАДЕТО</button>` :
                          isOwned ? `<button style="width:100%; padding:10px; background:#00ffcc; color:#000; font-weight:bold; border:none; border-radius:10px; cursor:pointer;" onclick="applySkin('${skin.id}')">НАДЕТЬ</button>` :
                          `<button style="width:100%; padding:10px; background:#ffaa00; color:#000; font-weight:bold; border:none; border-radius:10px; cursor:pointer;" onclick="buySkin('${skin.id}')">1000 💰</button>`;

                card.innerHTML = `<img src="${dataURL}" style="width:60px; height:60px; margin-bottom:10px;">
                                  <div style="font-size:16px; font-weight:bold; color:#fff; margin-bottom:10px;">${skin.name}</div>${btn}`;
                grid.appendChild(card);
            });
        }

        function buySkin(id) { if(balance >= 1000) { balance -= 1000; inventory.push(id); updateUI(); renderShop(); } else alert("Мало монет!"); }
        function applySkin(id) { activeSkinId = id; renderShop(); }

        function saveAndExit() {
            if(tg && tg.sendData) { tg.sendData(JSON.stringify({ game: 'helix', score: score, coins: balance, activeSkin: activeSkinId, inventory: inventory.join(',') })); tg.close(); } 
            else alert(`Выход. Баланс: ${balance}`);
        }

        window.ctx = ctx; // Хак для рендера магазина
        initGame();
    </script>
</body>
</html>
