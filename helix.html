<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helix Drop 8.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #1a1a2e; overflow: hidden; touch-action: none; color: white; height: 100vh; transition: background 0.5s; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 100; text-shadow: 0 0 10px #000; font-weight: bold; pointer-events: none; }
        .score-text { color: #fff; font-size: 26px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 10px #0ff; }
        .coins-text { color: #ffd700; font-size: 22px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .combo-text { color: #ff0055; font-size: 20px; font-weight: bold; margin-top: 5px; opacity: 0; transition: 0.2s; text-shadow: 0 0 15px #ff0055; }
        
        .smart-menu-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: rgba(0, 0, 0, 0.7); color: #0ff; border: 2px solid #0ff; border-radius: 8px; padding: 10px 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #0ff; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        .modal-content { background: linear-gradient(135deg, #111, #1a1a2e); border: 2px solid #0ff; border-radius: 15px; width: 85%; max-height: 85vh; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); }
        
        .btn { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; color: white; border: none; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .btn-blue { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .btn-red { background: linear-gradient(45deg, #ff416c, #ff4b2b); }

        .shop-container { overflow-y: auto; max-height: 50vh; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 5px; }
        .skin-card { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .skin-card.active { border-color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .buy-btn { padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; }
        .btn-buy { background: #ffd700; color: #000; }
        .btn-select { background: #0ff; color: #000; }
        .btn-selected { background: #444; color: #888; }
        
        .floating-text { position: absolute; font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #0f0; pointer-events: none; animation: floatUp 1s ease-out forwards; z-index: 500; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="score-text">Этаж: <span id="score">0</span></div>
        <div class="coins-text"><span id="coins">0</span> 💰</div>
        <div class="combo-text" id="comboText">🔥 FIREBALL!</div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">⚙️ МЕНЮ</button>
    <canvas id="gameCanvas"></canvas>

    <!-- Главное Меню -->
    <div id="smartModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: white;">ПАУЗА</h2>
            <button class="btn btn-blue" onclick="openShop()">🎨 ТЕМЫ (СКИНЫ)</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ВЫХОД В БОТА</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- Ангар -->
    <div id="shopModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: #0ff;">МАГАЗИН ТЕМ</h2>
            <div style="color: #ffd700;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="shopList"></div>
            <button class="btn btn-green" onclick="closeShop()">НАЗАД</button>
        </div>
    </div>

    <!-- Смерть -->
    <div id="gameOverScreen" class="modal hidden">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;">
            <h1 style="color: #ff416c; font-size: 45px; text-shadow: 0 0 20px red; margin-bottom: 20px;">РАЗБИЛСЯ!</h1>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 15px;">🔄 НАЧАТЬ ЗАНОВО</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ЗАБРАТЬ МОНЕТЫ</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ И БЛОКИРОВКИ ТЕЛЕГРАМА
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', e => {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗА СКИНОВ (Меняют цвета Башни, Фона и Платформ)
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'Neon City', price: 0, bg: '#1a1a2e', tower: '#2d2d44', plat: '#00ffff', danger: '#ff0055' },
        { id: 'gold', name: 'Golden Helix', price: 1000, bg: '#221100', tower: '#442200', plat: '#ffd700', danger: '#ff0000' },
        { id: 'toxic', name: 'Toxic Dump', price: 1500, bg: '#002200', tower: '#004400', plat: '#39ff14', danger: '#8a0303' },
        { id: 'blood', name: 'Vampire', price: 2000, bg: '#1a0000', tower: '#330000', plat: '#ff416c', danger: '#000000' },
        { id: 'ice', name: 'Frostbite', price: 2500, bg: '#001a33', tower: '#003366', plat: '#89f7fe', danger: '#ff4500' },
        { id: 'matrix', name: 'Matrix Code', price: 3000, bg: '#001100', tower: '#000000', plat: '#00ff00', danger: '#ff00ff' },
        { id: 'amethyst', name: 'Amethyst', price: 3000, bg: '#110022', tower: '#330044', plat: '#d400ff', danger: '#00ffcc' },
        { id: 'desert', name: 'Desert Sand', price: 3000, bg: '#332211', tower: '#554422', plat: '#ff9900', danger: '#333333' },
        { id: 'mono', name: 'Monochrome', price: 3000, bg: '#111111', tower: '#444444', plat: '#ffffff', danger: '#555555' },
        { id: 'black_hole', name: 'Dark Matter (+20%)', price: 3000, bg: '#000000', tower: '#111111', plat: '#800080', danger: '#ffff00' }
    ];

    let localCoins = parseInt(localStorage.getItem('helix_coins')) || 0;
    let unlocked = JSON.parse(localStorage.getItem('helix_unlocked')) || ['default'];
    let activeSkin = localStorage.getItem('helix_skin') || 'default';
    
    let sessionCoins = 0;
    let startTime = Date.now();

    // ==========================================
    // 3. 3D ДВИЖОК СПИРАЛИ И МАТЕМАТИКА
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = canvas.width = window.innerWidth;
    let ch = canvas.height = window.innerHeight;

    let gameState = 'start'; 
    let score = 0;
    let platforms = [];
    let particles = [];
    let shards = []; // Осколки разбитых платформ
    
    // Камера и цилиндр
    let towerRotation = 0;
    let towerRotVelocity = 0;
    let towerY = 0; // Положение цилиндра по вертикали
    let targetTowerY = 0;
    
    const towerRadius = 40;
    const platRadius = 110;
    const platHeight = 15;
    const distanceBetween = 150; // Расстояние между этажами

    // Шар (Игрок) - Он стоит на месте, башня движется вверх!
    const ball = {
        r: 10,
        y: ch * 0.25, // Шар всегда висит в верхней четверти экрана
        vy: 0,
        gravity: 0.5,
        jumpForce: -8,
        combo: 0, // Количество пробитых этажей
        isFireball: false // Режим огня
    };

    // Генератор платформы с дырой и смертельными зонами
    function createPlatform(index) {
        let yPos = index * distanceBetween;
        let gapStart = Math.random() * Math.PI * 2; // Где начинается дыра
        let gapSize = Math.PI / (1.5 + Math.min(score * 0.05, 1)); // Дыра сужается со временем
        
        let dangerStart = -1, dangerSize = 0;
        // Начиная с 3 этажа добавляем красные смертельные зоны
        if (index > 2 && Math.random() > 0.3) {
            dangerStart = (gapStart + gapSize + Math.random() * Math.PI) % (Math.PI * 2);
            dangerSize = Math.PI / (3 + Math.random() * 2); // Размер красной зоны
        }

        return { y: yPos, gapStart: gapStart, gapSize: gapSize, dangerStart: dangerStart, dangerSize: dangerSize, passed: false };
    }

    function initGame() {
        score = 0; sessionCoins = 0; ball.combo = 0; ball.isFireball = false;
        document.getElementById('comboText').style.opacity = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('coins').innerText = sessionCoins;
        
        platforms = [];
        for (let i = 0; i < 20; i++) platforms.push(createPlatform(i + 1));
        
        towerRotation = 0; towerRotVelocity = 0;
        targetTowerY = -ch * 0.25; // Смещение вниз, чтобы первая платформа была под шаром
        towerY = targetTowerY;
        
        ball.y = ch * 0.25;
        ball.vy = ball.jumpForce; // Сразу прыгаем
        
        particles = []; shards = [];
        gameState = 'playing';
        updateColors();
    }

    function updateColors() {
        let s = SKINS.find(sk => sk.id === activeSkin);
        document.body.style.background = s.bg;
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<20; i++) particles.push({x: x, y: y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, c: color});
    }

    function shatterPlatform(platIndex) {
        let p = platforms[platIndex];
        let s = SKINS.find(sk => sk.id === activeSkin);
        
        // Создаем осколки платформы, которые падают вниз
        for(let i=0; i<8; i++) {
            shards.push({
                y: p.y, angle: i * (Math.PI/4), vy: (Math.random()-0.5)*5 - 5,
                c: i%2===0 ? s.plat : s.danger
            });
        }
        platforms.splice(platIndex, 1);
        platforms.push(createPlatform(platforms[platforms.length-1].y/distanceBetween + 1));
    }

    // 3D Отрисовка Эллипсов (Псевдо-3D)
    function drawPlatform(yOffset, gapStart, gapSize, dangerStart, dangerSize, color, dangerColor) {
        let screenY = yOffset - towerY;
        if (screenY < -50 || screenY > ch + 50) return; // Не рисуем то, что за экраном
        
        let cy = screenY;
        let cx = cw / 2;
        let rx = platRadius;
        let ry = platRadius * 0.4; // Искажение перспективы

        // Чтобы платформа крутилась, мы просто сдвигаем углы дыр
        let currentGapStart = (gapStart + towerRotation) % (Math.PI * 2);
        if(currentGapStart < 0) currentGapStart += Math.PI * 2;
        
        let currentDangerStart = -1;
        if(dangerStart !== -1) {
            currentDangerStart = (dangerStart + towerRotation) % (Math.PI * 2);
            if(currentDangerStart < 0) currentDangerStart += Math.PI * 2;
        }

        // Рисуем толщину (Объем)
        ctx.fillStyle = adjustColor(color, -40); // Темнее для боковины
        ctx.beginPath();
        ctx.ellipse(cx, cy + platHeight, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();

        // Рисуем верхнюю плоскость (Основной цвет)
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        
        // ВЫРЕЗАЕМ ДЫРУ! 
        // В Canvas мы рисуем клин (wedge) режимом 'destination-out', чтобы стереть часть эллипса
        ctx.fill();
        
        // Рисуем красную смертельную зону (поверх основного цвета)
        if(currentDangerStart !== -1) {
            ctx.fillStyle = dangerColor;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.ellipse(cx, cy, rx, ry, 0, currentDangerStart, currentDangerStart + dangerSize);
            ctx.closePath();
            ctx.fill();
        }

        // Вырезаем саму дыру
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.ellipse(cx, cy, rx + 10, ry + 10, 0, currentGapStart, currentGapStart + gapSize);
        ctx.closePath();
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
    }

    function adjustColor(color, amount) {
        if(color.length === 7) return '#' + color.replace(/^#/, '').replace(/../g, c => ('0'+Math.min(255, Math.max(0, parseInt(c, 16) + amount)).toString(16)).substr(-2));
        return color;
    }

    function loop() {
        requestAnimationFrame(loop);
        if (gameState !== 'playing') return;

        let s = SKINS.find(sk => sk.id === activeSkin);
        ctx.clearRect(0, 0, cw, ch);

        // Инерция башни
        towerRotation += towerRotVelocity;
        towerRotVelocity *= 0.9; // Торможение
        
        // Плавное движение камеры вниз (башня ползет вверх)
        towerY += (targetTowerY - towerY) * 0.1;

        // Физика шара
        ball.vy += ball.gravity;
        ball.y += ball.vy;

        // РИСУЕМ БАШНЮ (ЦИЛИНДР)
        // 3D градиент, имитирующий свет слева и тень справа
        let grad = ctx.createLinearGradient(cw/2 - towerRadius, 0, cw/2 + towerRadius, 0);
        grad.addColorStop(0, adjustColor(s.tower, 30));
        grad.addColorStop(0.5, s.tower);
        grad.addColorStop(1, adjustColor(s.tower, -50));
        ctx.fillStyle = grad;
        ctx.fillRect(cw/2 - towerRadius, 0, towerRadius*2, ch);

        // ИДЕАЛЬНАЯ МАТЕМАТИКА СТОЛКНОВЕНИЙ
        let ballRelativeZ = Math.PI / 2; // Шар всегда спереди (угол 90 градусов или PI/2 на круге)
        
        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];
            let screenY = p.y - towerY;

            // Если шар пролетает уровень платформы
            if (ball.y + ball.r > screenY && ball.y - ball.vy <= screenY) {
                
                // Вычисляем, где находится дыра В ДАННЫЙ МОМЕНТ (с учетом вращения башни)
                let currentGapStart = (p.gapStart + towerRotation) % (Math.PI * 2);
                if(currentGapStart < 0) currentGapStart += Math.PI * 2;
                let gapEnd = (currentGapStart + p.gapSize) % (Math.PI*2);
                
                // Летит ли шар в дыру?
                let inGap = false;
                if (currentGapStart < gapEnd) {
                    if (ballRelativeZ >= currentGapStart && ballRelativeZ <= gapEnd) inGap = true;
                } else { // Дыра проходит через 0
                    if (ballRelativeZ >= currentGapStart || ballRelativeZ <= gapEnd) inGap = true;
                }

                if (inGap) {
                    // ПРОЛЕТЕЛ В ДЫРУ!
                    if (!p.passed) {
                        p.passed = true;
                        score++;
                        document.getElementById('score').innerText = score;
                        sessionCoins += 10; localCoins += 10;
                        document.getElementById('coins').innerText = sessionCoins;
                        
                        ball.combo++;
                        targetTowerY += distanceBetween; // Сдвигаем башню вверх
                        
                        // Активация FIREBALL
                        if(ball.combo >= 3) {
                            ball.isFireball = true;
                            document.getElementById('comboText').style.opacity = 1;
                        }
                    }
                } else {
                    // УДАР О ПЛАТФОРМУ
                    // 1. Если был Fireball - пробиваем с силой!
                    if (ball.isFireball) {
                        shatterPlatform(i);
                        ball.isFireball = false;
                        ball.combo = 0;
                        document.getElementById('comboText').style.opacity = 0;
                        ball.vy = ball.jumpForce; // Легкий отскок после пробития
                        
                        score++; sessionCoins += 50; localCoins += 50; // Бонус за пробитие
                        document.getElementById('score').innerText = score;
                        document.getElementById('coins').innerText = sessionCoins;
                        targetTowerY += distanceBetween;
                        break;
                    }

                    // 2. Обычный удар - проверяем, не красная ли это зона
                    let inDanger = false;
                    if (p.dangerStart !== -1) {
                        let dStart = (p.dangerStart + towerRotation) % (Math.PI*2);
                        if(dStart < 0) dStart += Math.PI*2;
                        let dEnd = (dStart + p.dangerSize) % (Math.PI*2);
                        if (dStart < dEnd) {
                            if (ballRelativeZ >= dStart && ballRelativeZ <= dEnd) inDanger = true;
                        } else {
                            if (ballRelativeZ >= dStart || ballRelativeZ <= dEnd) inDanger = true;
                        }
                    }

                    if (inDanger) {
                        // СМЕРТЬ!
                        createExplosion(cw/2, ball.y, '#f00');
                        gameState = 'gameover';
                        localStorage.setItem('helix_coins', localCoins);
                        setTimeout(() => document.getElementById('gameOverScreen').classList.remove('hidden'), 500);
                        return;
                    } else {
                        // Обычный отскок (Жив)
                        ball.y = screenY - ball.r;
                        ball.vy = ball.jumpForce;
                        createExplosion(cw/2, ball.y + ball.r, s.plat); // Брызги краски
                        
                        // Сброс комбо, если мы коснулись платформы
                        if(ball.combo > 0) {
                            ball.combo = 0;
                            ball.isFireball = false;
                            document.getElementById('comboText').style.opacity = 0;
                        }
                    }
                }
            }
        }

        // Рисуем платформы (сверху вниз)
        for (let p of platforms) drawPlatform(p.y, p.gapStart, p.gapSize, p.dangerStart, p.dangerSize, s.plat, s.danger);

        // Физика осколков (если разбили)
        for(let i=shards.length-1; i>=0; i--) {
            let sh = shards[i];
            sh.vy += 0.5; sh.y += sh.vy;
            let sy = sh.y - towerY;
            ctx.fillStyle = sh.c;
            ctx.beginPath(); ctx.arc(cw/2 + Math.cos(sh.angle)*platRadius, sy, 10, 0, Math.PI*2); ctx.fill();
            if(sy > ch) shards.splice(i, 1);
        }

        // РИСУЕМ ШАР ИГРОКА
        ctx.shadowBlur = ball.isFireball ? 20 : 10;
        ctx.shadowColor = ball.isFireball ? '#ff0055' : '#fff';
        ctx.fillStyle = ball.isFireball ? '#ff0055' : '#fff';
        ctx.beginPath(); ctx.arc(cw/2, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

        // Огонь вокруг шара в режиме Fireball
        if (ball.isFireball) {
            ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
            ctx.beginPath(); ctx.arc(cw/2, ball.y - 10, ball.r*1.5, 0, Math.PI*2); ctx.fill();
        }

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.c; ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
    }

    // ==========================================
    // 4. УПРАВЛЕНИЕ (ВРАЩЕНИЕ БАШНИ) И UI
    // ==========================================
    let touchStartX = 0;
    
    window.addEventListener('touchstart', e => {
        if(e.target.closest('.smart-menu-btn') || e.target.closest('.modal')) return;
        if(gameState === 'start') { initGame(); return; }
        if(gameState === 'playing') touchStartX = e.touches[0].clientX;
    }, {passive: false});

    window.addEventListener('touchmove', e => {
        if(gameState !== 'playing' || e.target.closest('.shop-container')) return;
        
        let dx = e.touches[0].clientX - touchStartX;
        // Крутим башню (Чувствительность)
        towerRotation += dx * 0.015;
        touchStartX = e.touches[0].clientX;
    }, {passive: false});

    function resetGame() {
        document.getElementById('gameOverScreen').classList.add('hidden');
        initGame();
    }

    // МЕНЮ И МАГАЗИН
    document.getElementById('mainMenuBtn').onclick = () => {
        if(gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.remove('hidden');
    }
    function closeMenu() {
        document.getElementById('smartModal').classList.add('hidden');
        if(gameState === 'paused') gameState = 'playing';
    }
    
    function openShop() {
        document.getElementById('smartModal').classList.add('hidden');
        document.getElementById('shopModal').classList.remove('hidden');
        document.getElementById('shopCoins').innerText = localCoins;
        let list = document.getElementById('shopList'); list.innerHTML = '';
        
        SKINS.forEach(s => {
            let isUnl = unlocked.includes(s.id); let isAct = activeSkin === s.id;
            let btn = isAct ? `<button class="buy-btn btn-selected">ВЫБРАН</button>` :
                      isUnl ? `<button class="buy-btn btn-select" onclick="equipSkin('${s.id}')">НАДЕТЬ</button>` :
                      `<button class="buy-btn btn-buy" onclick="buySkin('${s.id}', ${s.price})">КУПИТЬ (${s.price})</button>`;
            list.innerHTML += `
                <div class="skin-card ${isAct ? 'active' : ''}">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:30px; height:30px; background:${s.plat}; border-radius:5px; border:2px solid ${s.danger};"></div>
                        <div style="font-weight:bold;">${s.name}</div>
                    </div>
                    ${btn}
                </div>`;
        });
    }
    function closeShop() { document.getElementById('shopModal').classList.add('hidden'); document.getElementById('smartModal').classList.remove('hidden'); }
    
    window.buySkin = function(id, price) {
        if (localCoins >= price) { localCoins -= price; unlocked.push(id); equipSkin(id); saveData(); }
        else tg.showAlert('Мало монет, бро! Разбивай платформы!');
    }
    window.equipSkin = function(id) { activeSkin = id; openShop(); saveData(); updateColors(); }
    
    function saveData() {
        localStorage.setItem('helix_coins', localCoins);
        localStorage.setItem('helix_unlocked', JSON.stringify(unlocked));
        localStorage.setItem('helix_skin', activeSkin);
    }

    window.saveAndExit = function() {
        tg.sendData(JSON.stringify({
            game: "helix", coins: sessionCoins, score: score,
            time_spent: Math.floor((Date.now() - startTime) / 1000), active_skin: activeSkin
        }));
    }

    // Запуск стартового экрана
    updateColors();
    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
    ctx.fillText("ТАПНИ, ЧТОБЫ УПАСТЬ", cw/2, ch/2);
    requestAnimationFrame(loop);

</script>
</body>
</html>
