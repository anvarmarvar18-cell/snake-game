<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Defender PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; touch-action: none; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10%; width: 100%; text-align: center; font-size: 30px; font-weight: bold; pointer-events: none; text-shadow: 0 0 15px #00ffff; }
        #bossHpContainer { display: none; position: absolute; top: 5%; left: 10%; width: 80%; height: 20px; background: #333; border: 2px solid #ff0000; }
        #bossHpFill { width: 100%; height: 100%; background: #ff0000; transition: width 0.1s; }
    </style>
</head>
<body>
    <div id="ui">СЧЕТ: <span id="score">0</span></div>
    <div id="bossHpContainer"><div id="bossHpFill"></div></div>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        if(tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let score = 0; let gameActive = true; let frames = 0;
        let player = { x: canvas.width/2 - 25, y: canvas.height - 100, width: 50, height: 50 };
        
        window.addEventListener('touchmove', e => { player.x = e.touches[0].clientX - player.width/2; });
        window.addEventListener('mousemove', e => { player.x = e.clientX - player.width/2; });

        let bullets = []; let enemies = []; let bossBullets = [];
        let boss = { active: false, hp: 0, maxHp: 0, x: 0, y: 50, width: 120, height: 80, speedX: 3 };

        function drawPlayer() {
            ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff';
            ctx.beginPath(); ctx.moveTo(player.x+25, player.y); ctx.lineTo(player.x+50, player.y+50); ctx.lineTo(player.x, player.y+50); ctx.fill();
        }

        function drawBoss() {
            if(!boss.active) return;
            boss.x += boss.speedX;
            if(boss.x <= 0 || boss.x + boss.width >= canvas.width) boss.speedX *= -1;
            
            ctx.fillStyle = '#ff0000'; ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000';
            ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
            
            // Босс стреляет
            if(frames % 30 === 0) {
                bossBullets.push({ x: boss.x + boss.width/2 - 5, y: boss.y + boss.height, width: 10, height: 20, speed: 8 });
            }
        }

        function handleBullets() {
            // Игрок стреляет
            if(frames % 12 === 0 && gameActive) bullets.push({ x: player.x+20, y: player.y, width: 10, height: 20, speed: 12 });
            
            ctx.fillStyle = '#ff00ff'; ctx.shadowColor = '#ff00ff';
            for(let i=0; i<bullets.length; i++) {
                bullets[i].y -= bullets[i].speed;
                ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].width, bullets[i].height);
                
                // Попадание в босса
                if(boss.active && bullets[i].x < boss.x + boss.width && bullets[i].x + bullets[i].width > boss.x && bullets[i].y < boss.y + boss.height) {
                    boss.hp--; 
                    document.getElementById('bossHpFill').style.width = (boss.hp / boss.maxHp * 100) + '%';
                    bullets.splice(i, 1); i--;
                    if(boss.hp <= 0) {
                        boss.active = false; score += 5; document.getElementById('score').innerText = score;
                        document.getElementById('bossHpContainer').style.display = 'none';
                    }
                }
            }

            // Пули босса
            ctx.fillStyle = '#ff3300'; ctx.shadowColor = '#ff3300';
            for(let i=0; i<bossBullets.length; i++) {
                bossBullets[i].y += bossBullets[i].speed;
                ctx.fillRect(bossBullets[i].x, bossBullets[i].y, bossBullets[i].width, bossBullets[i].height);
                
                if(bossBullets[i].x < player.x + player.width && bossBullets[i].x + bossBullets[i].width > player.x && bossBullets[i].y > player.y && bossBullets[i].y < player.y + player.height) {
                    endGame();
                }
            }
        }

        function handleEnemies() {
            if(!boss.active) {
                // Появление босса каждые 10 очков
                if(score > 0 && score % 10 === 0) {
                    boss.active = true; boss.maxHp = 20 + (score * 2); boss.hp = boss.maxHp;
                    boss.x = canvas.width/2 - boss.width/2;
                    document.getElementById('bossHpContainer').style.display = 'block';
                    enemies = []; // Очищаем мелких врагов
                    return;
                }

                // Спавн мелких врагов (ускоряются со временем)
                let spawnRate = Math.max(15, 40 - score);
                if(frames % spawnRate === 0) enemies.push({ x: Math.random()*(canvas.width-40), y: -40, width: 40, height: 40, speed: Math.random()*2 + 3 + (score*0.1) });
            }

            ctx.fillStyle = '#ff9900'; ctx.shadowColor = '#ff9900';
            for(let i=0; i<enemies.length; i++) {
                enemies[i].y += enemies[i].speed;
                ctx.fillRect(enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height);
                
                if(enemies[i].x < player.x + player.width && enemies[i].x + enemies[i].width > player.x && enemies[i].y + enemies[i].height > player.y) endGame();

                for(let j=0; j<bullets.length; j++) {
                    if(bullets[j].x < enemies[i].x + enemies[i].width && bullets[j].x + bullets[j].width > enemies[i].x && bullets[j].y < enemies[i].y + enemies[i].height) {
                        score++; document.getElementById('score').innerText = score;
                        enemies.splice(i, 1); bullets.splice(j, 1); i--; break;
                    }
                }
            }
        }

        function endGame() {
            gameActive = false; document.getElementById('ui').innerHTML = "РАЗБИТ!";
            setTimeout(() => { tg.sendData(JSON.stringify({ game: "space", earned: score * 10, score: score })); }, 1500);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Чистим экран
            if(gameActive) { drawPlayer(); drawBoss(); handleBullets(); handleEnemies(); frames++; requestAnimationFrame(animate); }
        }
        animate();
    </script>
</body>
</html>
