<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Wars 4.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗА И ЗАЩИТА */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #020205; overflow: hidden; touch-action: none; color: white; height: 100vh; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* ИНТЕРФЕЙС ИГРЫ */
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 100; text-shadow: 0 0 10px #0ff; font-weight: bold; pointer-events: none; }
        .score-text { color: #fff; font-size: 22px; margin-bottom: 5px; }
        .coins-text { color: #ffd700; font-size: 20px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        
        .smart-menu-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: rgba(0, 0, 0, 0.7); color: #0ff; border: 2px solid #0ff; border-radius: 8px; padding: 10px 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #0ff; }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        .modal-content { background: linear-gradient(135deg, #111, #1a1a2e); border: 2px solid #0ff; border-radius: 15px; width: 85%; max-height: 85vh; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); }
        
        .btn { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; color: white; border: none; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .btn-blue { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .btn-red { background: linear-gradient(45deg, #ff416c, #ff4b2b); }

        /* МАГАЗИН (С ИДЕАЛЬНЫМ СКРОЛЛОМ) */
        .shop-container { overflow-y: auto; max-height: 50vh; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 5px; }
        .skin-card { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .skin-card.active { border-color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .buy-btn { padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; }
        .btn-buy { background: #ffd700; color: #000; }
        .btn-select { background: #0ff; color: #000; }
        .btn-selected { background: #444; color: #888; }
        
        /* BOSS ALERT */
        #boss-alert { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #ff0000; font-weight: 900; text-shadow: 0 0 30px #ff0000; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="score-text">Уничтожено: <span id="score">0</span></div>
        <div class="coins-text"><span id="coins">0</span> 💰</div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">⚙️ МЕНЮ</button>
    <div id="boss-alert">ВНИМАНИЕ: БОСС!</div>
    <canvas id="gameCanvas"></canvas>

    <!-- Главное Меню -->
    <div id="smartModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: white;">ПАУЗА</h2>
            <button class="btn btn-blue" onclick="openShop()">🚀 АНГАР (СКИНЫ)</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ВЫХОД В БОТА</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- Ангар -->
    <div id="shopModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: #0ff;">АНГАР</h2>
            <div style="color: #ffd700;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="shopList"></div>
            <button class="btn btn-green" onclick="closeShop()">НАЗАД</button>
        </div>
    </div>

    <!-- Смерть -->
    <div id="gameOverScreen" class="modal hidden">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;">
            <h1 style="color: #ff416c; font-size: 45px; text-shadow: 0 0 20px red; margin-bottom: 20px;">КОРАБЛЬ УНИЧТОЖЕН</h1>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 15px;">🔄 НОВЫЙ ВЫЛЕТ</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ЗАБРАТЬ МОНЕТЫ</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ И БЛОКИРОВКА СВАЙПОВ
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', e => {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗА СКИНОВ (10 шт, влияют на цвет лазера и корабля)
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'Cyber Blue', price: 0, color: '#00ffff' },
        { id: 'crimson', name: 'Crimson Fighter', price: 1000, color: '#ff003c' },
        { id: 'toxic', name: 'Toxic Viper', price: 1500, color: '#39ff14' },
        { id: 'gold', name: 'Golden Falcon', price: 2000, color: '#ffd700' },
        { id: 'dark', name: 'Dark Matter', price: 2500, color: '#8a2be2' },
        { id: 'stealth', name: 'Stealth Bomber', price: 3000, color: '#a9a9a9' },
        { id: 'plasma', name: 'Plasma Ray', price: 3000, color: '#ff1493' },
        { id: 'solar', name: 'Solar Flare', price: 3000, color: '#ff4500' },
        { id: 'ice', name: 'Ice Ghost', price: 3000, color: '#e0ffff' },
        { id: 'black_hole', name: 'Black Hole (+20%)', price: 3000, color: '#111111', glow: '#800080' }
    ];

    let localCoins = parseInt(localStorage.getItem('galactic_coins')) || 0;
    let unlocked = JSON.parse(localStorage.getItem('galactic_unlocked')) || ['default'];
    let activeSkin = localStorage.getItem('galactic_skin') || 'default';
    
    let sessionCoins = 0;
    let startTime = Date.now();

    // ==========================================
    // 3. ДВИЖОК ИГРЫ (CANVAS)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = canvas.width = window.innerWidth;
    let ch = canvas.height = window.innerHeight;

    let gameState = 'start'; // start, playing, paused, gameover
    let score = 0;
    let frames = 0;
    
    // Эффект звездного параллакса (3 слоя)
    const stars = Array(100).fill().map(() => ({
        x: Math.random() * cw, y: Math.random() * ch, 
        r: Math.random() * 2, speed: Math.random() * 3 + 1
    }));

    const particles = [];
    const bullets = [];
    const enemies = [];
    const enemyBullets = []; // Для босса

    let bossActive = false;
    let boss = null;

    // Корабль игрока
    const player = {
        x: cw / 2, y: ch - 100, width: 40, height: 50, speed: 0, targetX: cw / 2,
        draw() {
            let s = SKINS.find(sk => sk.id === activeSkin);
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Свечение двигателя
            ctx.shadowBlur = 15; ctx.shadowColor = s.color;
            ctx.fillStyle = s.glow || s.color;
            ctx.beginPath(); ctx.moveTo(-10, 15); ctx.lineTo(10, 15); ctx.lineTo(0, 30 + Math.random()*10); ctx.fill();
            
            // Корпус корабля (3D градиент)
            let grad = ctx.createLinearGradient(0, -25, 0, 25);
            grad.addColorStop(0, '#fff'); grad.addColorStop(1, s.glow || s.color);
            ctx.fillStyle = grad;
            ctx.shadowBlur = 10; ctx.shadowColor = s.glow || s.color;
            
            ctx.beginPath();
            ctx.moveTo(0, -25); // Нос
            ctx.lineTo(20, 15); // Правое крыло
            ctx.lineTo(10, 15);
            ctx.lineTo(15, 25); // Правая пушка
            ctx.lineTo(5, 20);
            ctx.lineTo(-5, 20);
            ctx.lineTo(-15, 25); // Левая пушка
            ctx.lineTo(-10, 15);
            ctx.lineTo(-20, 15); // Левое крыло
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        },
        update() {
            // Плавное следование за пальцем (Lerp)
            this.x += (this.targetX - this.x) * 0.2;
            // Ограничение по краям
            if(this.x < 20) this.x = 20;
            if(this.x > cw - 20) this.x = cw - 20;
            
            // Авто-стрельба
            if (frames % 12 === 0) {
                let s = SKINS.find(sk => sk.id === activeSkin);
                if (score >= 50) {
                    // Двойные лазеры
                    bullets.push({x: this.x - 12, y: this.y - 20, speed: 12, color: s.color});
                    bullets.push({x: this.x + 12, y: this.y - 20, speed: 12, color: s.color});
                } else {
                    // Одинарный лазер
                    bullets.push({x: this.x, y: this.y - 25, speed: 12, color: s.color});
                }
            }
        }
    };

    // Класс Босса
    class Boss {
        constructor() {
            this.x = cw/2; this.y = -100; this.width = 100; this.height = 80;
            this.hp = 100 + (score * 2); // Здоровье растет с каждым боссом
            this.maxHp = this.hp;
            this.speedX = 2; this.speedY = 1;
        }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            ctx.fillStyle = '#ff003c'; ctx.shadowBlur = 20; ctx.shadowColor = 'red';
            ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(50, -20); ctx.lineTo(30, -40); ctx.lineTo(-30, -40); ctx.lineTo(-50, -20); ctx.closePath(); ctx.fill();
            // Глаз босса
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            
            // Полоска ХП
            ctx.fillStyle = 'red'; ctx.fillRect(this.x - 50, this.y - 60, 100, 10);
            ctx.fillStyle = '#0f0'; ctx.fillRect(this.x - 50, this.y - 60, (this.hp/this.maxHp)*100, 10);
        }
        update() {
            if (this.y < 100) this.y += this.speedY; // Выход на арену
            else {
                this.x += this.speedX;
                if (this.x > cw - 60 || this.x < 60) this.speedX *= -1; // Движение влево-вправо
                
                // Стрельба босса
                if (frames % 40 === 0) {
                    enemyBullets.push({x: this.x, y: this.y + 40, vx: 0, vy: 6});
                    enemyBullets.push({x: this.x - 20, y: this.y + 30, vx: -2, vy: 5});
                    enemyBullets.push({x: this.x + 20, y: this.y + 30, vx: 2, vy: 5});
                }
            }
        }
    }

    function spawnEnemy() {
        if (bossActive) return;
        enemies.push({
            x: Math.random() * (cw - 40) + 20, y: -30, r: Math.random() * 10 + 15,
            speed: Math.random() * 2 + 2, hp: 2, type: Math.random() > 0.5 ? 'asteroid' : 'alien'
        });
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push({ x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, color: color });
        }
    }

    function loop() {
        requestAnimationFrame(loop);
        if (gameState !== 'playing') return;
        frames++;

        // Очистка и фон
        ctx.fillStyle = 'rgba(2, 2, 5, 0.5)'; // Эффект шлейфа (motion blur)
        ctx.fillRect(0, 0, cw, ch);

        // Звезды
        ctx.fillStyle = '#fff';
        stars.forEach(s => {
            s.y += s.speed; if (s.y > ch) { s.y = 0; s.x = Math.random() * cw; }
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
        });

        player.update();
        player.draw();

        // Спавн обычных врагов
        if (frames % 40 === 0 && !bossActive) spawnEnemy();
        
        // Появление БОССА каждые 20 очков
        if (score > 0 && score % 20 === 0 && !bossActive && !boss) {
            bossActive = true;
            boss = new Boss();
            let alertEl = document.getElementById('boss-alert');
            alertEl.style.opacity = 1;
            setTimeout(() => alertEl.style.opacity = 0, 2000);
        }

        // Обновление пуль игрока
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.y -= b.speed;
            ctx.shadowBlur = 10; ctx.shadowColor = b.color; ctx.fillStyle = '#fff';
            ctx.fillRect(b.x - 2, b.y, 4, 15);
            if (b.y < 0) bullets.splice(i, 1);
        }

        // Обновление врагов
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i]; e.y += e.speed;
            
            ctx.save(); ctx.translate(e.x, e.y); ctx.shadowBlur = 0;
            if(e.type === 'asteroid') {
                ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r); ctx.lineTo(-e.r, -e.r); ctx.closePath(); ctx.fill();
            }
            ctx.restore();

            // Столкновение пули с врагом
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (Math.abs(b.x - e.x) < e.r + 10 && Math.abs(b.y - e.y) < e.r + 10) {
                    e.hp--; bullets.splice(j, 1);
                    if (e.hp <= 0) {
                        createExplosion(e.x, e.y, e.type === 'asteroid' ? '#888' : '#0f0');
                        enemies.splice(i, 1);
                        score++;
                        let earned = score > 100 ? 20 : 10; // ЭКОНОМИКА
                        sessionCoins += earned; localCoins += earned;
                        document.getElementById('score').innerText = score;
                        document.getElementById('coins').innerText = sessionCoins;
                        break;
                    }
                }
            }
            // Столкновение врага с игроком
            if (e && Math.abs(player.x - e.x) < e.r + 15 && Math.abs(player.y - e.y) < e.r + 15) {
                gameOver();
            }
            if (e && e.y > ch) enemies.splice(i, 1);
        }

        // Обновление Босса
        if (bossActive && boss) {
            boss.update(); boss.draw();
            // Урон боссу от пуль
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (Math.abs(b.x - boss.x) < 50 && Math.abs(b.y - boss.y) < 40) {
                    boss.hp--; bullets.splice(j, 1); createExplosion(b.x, b.y, '#ff0');
                    if (boss.hp <= 0) {
                        createExplosion(boss.x, boss.y, '#f00'); createExplosion(boss.x-20, boss.y+20, '#ff0');
                        bossActive = false; boss = null;
                        score++; sessionCoins += 500; localCoins += 500; // Награда за босса
                        document.getElementById('score').innerText = score; document.getElementById('coins').innerText = sessionCoins;
                    }
                }
            }
        }

        // Пули босса
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let b = enemyBullets[i]; b.x += b.vx; b.y += b.vy;
            ctx.shadowBlur = 10; ctx.shadowColor = '#f00'; ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            if (b.y > ch || b.x < 0 || b.x > cw) enemyBullets.splice(i, 1);
            // Попадание в игрока
            if (Math.abs(b.x - player.x) < 20 && Math.abs(b.y - player.y) < 25) gameOver();
        }

        // Частицы взрывов
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            ctx.globalAlpha = p.life > 0 ? p.life : 0;
            ctx.fillStyle = p.color; ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
    }

    // ==========================================
    // 4. УПРАВЛЕНИЕ И UI
    // ==========================================
    canvas.addEventListener('touchmove', e => {
        if(gameState === 'playing') player.targetX = e.touches[0].clientX;
    }, {passive: false});

    window.addEventListener('touchstart', e => {
        if(gameState === 'start' && !e.target.closest('.smart-menu-btn')) {
            gameState = 'playing';
        }
    });

    function gameOver() {
        gameState = 'gameover';
        localStorage.setItem('galactic_coins', localCoins);
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function resetGame() {
        enemies.length = 0; bullets.length = 0; enemyBullets.length = 0; particles.length = 0;
        score = 0; bossActive = false; boss = null; frames = 0;
        player.x = cw/2; player.targetX = cw/2;
        document.getElementById('score').innerText = score;
        document.getElementById('gameOverScreen').classList.add('hidden');
        gameState = 'start';
    }

    // МЕНЮ И МАГАЗИН
    document.getElementById('mainMenuBtn').onclick = () => {
        if(gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.remove('hidden');
    }
    function closeMenu() {
        document.getElementById('smartModal').classList.add('hidden');
        if(gameState === 'paused') gameState = 'playing';
    }
    
    function openShop() {
        document.getElementById('smartModal').classList.add('hidden');
        document.getElementById('shopModal').classList.remove('hidden');
        document.getElementById('shopCoins').innerText = localCoins;
        let list = document.getElementById('shopList'); list.innerHTML = '';
        
        SKINS.forEach(s => {
            let isUnl = unlocked.includes(s.id); let isAct = activeSkin === s.id;
            let btn = isAct ? `<button class="buy-btn btn-selected">ВЫБРАН</button>` :
                      isUnl ? `<button class="buy-btn btn-select" onclick="equipSkin('${s.id}')">НАДЕТЬ</button>` :
                      `<button class="buy-btn btn-buy" onclick="buySkin('${s.id}', ${s.price})">КУПИТЬ (${s.price})</button>`;
            list.innerHTML += `
                <div class="skin-card ${isAct ? 'active' : ''}">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:30px; height:30px; background:${s.color}; border-radius:5px; box-shadow:0 0 10px ${s.color};"></div>
                        <div style="font-weight:bold;">${s.name}</div>
                    </div>
                    ${btn}
                </div>`;
        });
    }
    function closeShop() { document.getElementById('shopModal').classList.add('hidden'); document.getElementById('smartModal').classList.remove('hidden'); }
    
    window.buySkin = function(id, price) {
        if (localCoins >= price) { localCoins -= price; unlocked.push(id); equipSkin(id); saveData(); }
        else tg.showAlert('Мало монет, бро!');
    }
    window.equipSkin = function(id) { activeSkin = id; openShop(); saveData(); }
    
    function saveData() {
        localStorage.setItem('galactic_coins', localCoins);
        localStorage.setItem('galactic_unlocked', JSON.stringify(unlocked));
        localStorage.setItem('galactic_skin', activeSkin);
    }

    window.saveAndExit = function() {
        tg.sendData(JSON.stringify({
            game: "galactic", coins: sessionCoins, score: score,
            time_spent: Math.floor((Date.now() - startTime) / 1000), active_skin: activeSkin
        }));
    }

    // Запуск графики
    ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
    ctx.fillText("ТАПНИ, ЧТОБЫ ВЗЛЕТЕТЬ", cw/2, ch/2);
    requestAnimationFrame(loop);

</script>
</body>
</html>
