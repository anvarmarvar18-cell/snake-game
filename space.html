<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Defender</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; color: white; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; font-size: 30px; font-weight: bold; text-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>
    <div id="ui">Сбито: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let score = 0; let gameActive = true;
        
        // Корабль игрока
        const player = { x: canvas.width/2 - 20, y: canvas.height - 80, width: 40, height: 40 };
        
        // Управление: корабль следует за пальцем
        window.addEventListener('touchmove', e => {
            let touchX = e.touches[0].clientX;
            player.x = touchX - player.width / 2;
            if(player.x < 0) player.x = 0;
            if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        });

        let bullets = []; let enemies = []; let frames = 0;

        function drawPlayer() {
            ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff';
            ctx.beginPath(); ctx.moveTo(player.x + 20, player.y); ctx.lineTo(player.x + 40, player.y + 40); ctx.lineTo(player.x, player.y + 40); ctx.fill();
            ctx.shadowBlur = 0;
        }

        function handleBullets() {
            // Автоматическая стрельба каждые 15 кадров
            if(frames % 15 === 0 && gameActive) { bullets.push({ x: player.x + 18, y: player.y, width: 4, height: 15, speed: 10 }); }
            
            ctx.fillStyle = '#ff00ff'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff00ff';
            for(let i=0; i<bullets.length; i++) {
                bullets[i].y -= bullets[i].speed;
                ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].width, bullets[i].height);
                if(bullets[i].y < 0) { bullets.splice(i, 1); i--; }
            }
            ctx.shadowBlur = 0;
        }

        function handleEnemies() {
            // Враги появляются всё чаще
            let spawnRate = Math.max(20, 60 - Math.floor(score/5));
            if(frames % spawnRate === 0) { enemies.push({ x: Math.random()*(canvas.width-30), y: -30, width: 30, height: 30, speed: Math.random()*2 + 2 }); }
            
            ctx.fillStyle = '#ff3300'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff3300';
            for(let i=0; i<enemies.length; i++) {
                let e = enemies[i]; e.y += e.speed;
                ctx.fillRect(e.x, e.y, e.width, e.height);
                
                // Столкновение врага с игроком
                if(e.x < player.x + player.width && e.x + e.width > player.x && e.y < player.y + player.height && e.y + e.height > player.y) {
                    gameActive = false;
                    document.getElementById('ui').innerHTML = "КОРАБЛЬ УНИЧТОЖЕН!";
                    setTimeout(() => { tg.sendData(JSON.stringify({ game: "space", earned: score * 4, score: score })); }, 1500);
                }
                
                // Попадание пули во врага
                for(let j=0; j<bullets.length; j++) {
                    let b = bullets[j];
                    if(b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
                        score++; document.getElementById('score').innerText = score;
                        enemies.splice(i, 1); bullets.splice(j, 1);
                        i--; break;
                    }
                }
                if(e.y > canvas.height) { enemies.splice(i, 1); i--; } // Враг улетел вниз
            }
            ctx.shadowBlur = 0;
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Эффект следа
            if(gameActive) { drawPlayer(); handleBullets(); handleEnemies(); frames++; requestAnimationFrame(animate); }
        }
        animate();
    </script>
</body>
</html>
