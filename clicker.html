<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Empire: Crypto Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; font-family: 'Arial', sans-serif; }
        body { 
            background: #000; 
            background-image: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #000000 100%);
            color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
        }
        
        /* Верхняя панель (Баланс) */
        .header { padding: 30px 20px 10px; text-align: center; z-index: 10; }
        .balance-value { font-size: 55px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .balance-coin-icon { width: 45px; height: 45px; }

        /* Монета (Кликер) */
        .coin-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; }
        .coin-btn { 
            width: 280px; height: 280px; border-radius: 50%; border: none; outline: none;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), inset 0 -15px 30px rgba(0,0,0,0.4), inset 0 15px 30px rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center; font-size: 110px;
            transition: transform 0.05s ease-out; cursor: pointer; z-index: 5;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-btn:active { transform: scale(0.94); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        
        /* Всплывающие цифры */
        .floating-text { position: absolute; font-size: 35px; font-weight: 900; color: #fff; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }

        /* Нижняя панель */
        .footer { padding: 20px; background: rgba(0,0,0,0.8); border-top: 1px solid #333; display: flex; flex-direction: column; gap: 15px; z-index: 20; }
        .miner-status { font-size: 14px; color: #00ffcc; text-align: center; font-weight: bold; }
        
        .action-row { display: flex; gap: 10px; }
        .btn { 
            flex: 1; padding: 15px; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-miner { background: linear-gradient(45deg, #2b5876, #4e4376); box-shadow: 0 4px 15px rgba(78,67,118,0.4); }
        .btn-shop { background: linear-gradient(45deg, #11998e, #38ef7d); box-shadow: 0 4px 15px rgba(56,239,125,0.4); }
        .btn-save { background: #333; width: 100%; margin-top: 5px; }

        /* Магазин Скинов (Модальное окно) */
        .shop-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; padding: 20px; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .shop-title { font-size: 24px; font-weight: bold; color: #fff; }
        .close-btn { background: none; border: none; color: #ff3333; font-size: 30px; cursor: pointer; }
        .skins-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; overflow-y: auto; padding-bottom: 20px; }
        .skin-card { background: #1a1a2e; border: 2px solid #333; border-radius: 15px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .skin-card.active { border-color: #00ffcc; background: #162a35; }
        .skin-preview { font-size: 50px; }
        .skin-name { font-size: 14px; font-weight: bold; }
        .buy-skin-btn { background: #ffaa00; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; color: #000; width: 100%; cursor: pointer; }
        .equip-skin-btn { background: #00ffcc; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; color: #000; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <!-- БАЛАНС -->
    <div class="header">
        <div class="balance-value">
            <span id="balanceDisplay">0</span>
        </div>
    </div>

    <!-- КЛИКЕР -->
    <div class="coin-container" id="coinContainer">
        <button class="coin-btn" id="mainCoin" onmousedown="tap(event)" ontouchstart="tap(event)">💰</button>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="footer">
        <div id="minerStatus" class="miner-status">Майнинг выключен</div>
        <div class="action-row">
            <button id="minerBtn" class="btn btn-miner" onclick="buyMiner()">⚡ Ферма (50,000)</button>
            <button class="btn btn-shop" onclick="openShop()">🎨 Скины</button>
        </div>
        <button class="btn btn-save" onclick="saveAndExit()">💾 Сохранить и выйти</button>
    </div>

    <!-- МАГАЗИН СКИНОВ -->
    <div class="shop-modal" id="shopModal">
        <div class="shop-header">
            <div class="shop-title">Магазин (1000 💰)</div>
            <button class="close-btn" onclick="closeShop()">&times;</button>
        </div>
        <div class="skins-grid" id="skinsGrid">
            <!-- Скины генерируются через JS -->
        </div>
    </div>

    <script>
        // Инициализация Telegram
        let tg;
        try { tg = window.Telegram.WebApp; tg.expand(); } catch(e) {}

        // --- ДАННЫЕ ИГРОКА (В будущем загружаются из Python) ---
        let balance = 0; 
        let hasMiner = false;
        
        // 10 Легендарных скинов
        const skins = [
            { id: 'gold', name: 'Gold Coin', icon: '💰', bg: 'radial-gradient(circle at 30% 30%, #ffd700, #b8860b)', shadow: 'rgba(255, 215, 0, 0.3)' },
            { id: 'notcoin', name: 'Notcoin', icon: '⚪', bg: 'radial-gradient(circle at 30% 30%, #ffffff, #aaaaaa)', shadow: 'rgba(255, 255, 255, 0.3)' },
            { id: 'btc', name: 'Bitcoin', icon: '₿', bg: 'radial-gradient(circle at 30% 30%, #ffaa00, #cc7700)', shadow: 'rgba(255, 170, 0, 0.3)' },
            { id: 'ton', name: 'TON', icon: '💎', bg: 'radial-gradient(circle at 30% 30%, #0088ff, #0044aa)', shadow: 'rgba(0, 136, 255, 0.3)' },
            { id: 'tg', name: 'Telegram', icon: '✈️', bg: 'radial-gradient(circle at 30% 30%, #00ccff, #0088cc)', shadow: 'rgba(0, 204, 255, 0.3)' },
            { id: 'eth', name: 'Ethereum', icon: '⧫', bg: 'radial-gradient(circle at 30% 30%, #a09fe6, #59588c)', shadow: 'rgba(160, 159, 230, 0.3)' },
            { id: 'star', name: 'Star', icon: '⭐', bg: 'radial-gradient(circle at 30% 30%, #ffea00, #ccaa00)', shadow: 'rgba(255, 234, 0, 0.3)' },
            { id: 'sol', name: 'Solana', icon: '🧬', bg: 'radial-gradient(circle at 30% 30%, #00ffa3, #03e1ff)', shadow: 'rgba(0, 255, 163, 0.3)' },
            { id: 'doge', name: 'Doge', icon: '🐶', bg: 'radial-gradient(circle at 30% 30%, #ffcc66, #cc9933)', shadow: 'rgba(255, 204, 102, 0.3)' },
            { id: 'fire', name: 'Fire', icon: '🔥', bg: 'radial-gradient(circle at 30% 30%, #ff3300, #990000)', shadow: 'rgba(255, 51, 0, 0.3)' }
        ];

        // Инвентарь (какие скины куплены). gold всегда куплен.
        let inventory = ['gold'];
        let activeSkinId = 'gold';

        // Анти-чит
        let clicksThisSecond = 0;
        setInterval(() => { clicksThisSecond = 0; }, 1000);

        const balanceDisplay = document.getElementById('balanceDisplay');
        const mainCoin = document.getElementById('mainCoin');
        const minerStatus = document.getElementById('minerStatus');
        const minerBtn = document.getElementById('minerBtn');

        // --- ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ---
        function updateUI() {
            balanceDisplay.innerText = Math.floor(balance).toLocaleString('ru-RU');
            
            if (hasMiner) {
                minerBtn.style.display = 'none';
                minerStatus.innerText = "⚡ Ферма добывает 30,000 / день";
            }
        }

        // --- ПРИМЕНЕНИЕ СКИНА ---
        function applySkin(skinId) {
            const skin = skins.find(s => s.id === skinId);
            if (!skin) return;
            activeSkinId = skin.id;
            mainCoin.innerText = skin.icon;
            mainCoin.style.background = skin.bg;
            mainCoin.style.boxShadow = `0 0 50px ${skin.shadow}, inset 0 -15px 30px rgba(0,0,0,0.4), inset 0 15px 30px rgba(255,255,255,0.4)`;
            renderShop();
        }

        // --- ЛОГИКА ТАПА (КЛИКА) ---
        function tap(e) {
            e.preventDefault(); 
            if (clicksThisSecond > 15) return; // АНТИ-ЧИТ
            clicksThisSecond++;

            balance += 1;
            
            let x = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
            let y = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
            
            createFloatingText(x, y, "+1");
            updateUI();
        }

        function createFloatingText(x, y, text) {
            const container = document.getElementById('coinContainer');
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            
            const rect = container.getBoundingClientRect();
            // Случайный разброс цифр вокруг пальца
            let offsetX = (Math.random() - 0.5) * 40;
            el.style.left = (x - rect.left - 20 + offsetX) + 'px';
            el.style.top = (y - rect.top - 20) + 'px';
            
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 800);
        }

        // --- МАЙНИНГ (30,000 монет в день) ---
        function buyMiner() {
            if (balance >= 50000) {
                balance -= 50000;
                hasMiner = true;
                updateUI();
                startMining();
            } else {
                alert("Не хватает монет! Нужно 50,000.");
            }
        }

        function startMining() {
            if (!hasMiner) return;
            // 30,000 монет / 86400 секунд в сутках = 0.3472 монет/сек.
            // Обновляем баланс каждые 100мс (10 раз в секунду) -> +0.03472 за тик
            setInterval(() => {
                balance += 0.03472;
                balanceDisplay.innerText = Math.floor(balance).toLocaleString('ru-RU');
            }, 100);
        }

        // --- МАГАЗИН СКИНОВ ---
        function openShop() { document.getElementById('shopModal').style.display = 'flex'; renderShop(); }
        function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

        function renderShop() {
            const grid = document.getElementById('skinsGrid');
            grid.innerHTML = '';
            
            skins.forEach(skin => {
                const isOwned = inventory.includes(skin.id);
                const isActive = activeSkinId === skin.id;
                
                const card = document.createElement('div');
                card.className = `skin-card ${isActive ? 'active' : ''}`;
                
                let btnHTML = '';
                if (isActive) {
                    btnHTML = `<button class="equip-skin-btn" style="background:#555; color:#fff;" disabled>Надето</button>`;
                } else if (isOwned) {
                    btnHTML = `<button class="equip-skin-btn" onclick="applySkin('${skin.id}')">Надеть</button>`;
                } else {
                    btnHTML = `<button class="buy-skin-btn" onclick="buySkin('${skin.id}')">Купить (1000)</button>`;
                }

                card.innerHTML = `
                    <div class="skin-preview" style="background: ${skin.bg}; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.5);">${skin.icon}</div>
                    <div class="skin-name">${skin.name}</div>
                    ${btnHTML}
                `;
                grid.appendChild(card);
            });
        }

        function buySkin(skinId) {
            if (balance >= 1000) {
                balance -= 1000;
                inventory.push(skinId);
                updateUI();
                renderShop();
            } else {
                alert("Не хватает монет! Нужно 1000.");
            }
        }

        // --- СОХРАНЕНИЕ ---
        function saveAndExit() {
            if(tg && tg.sendData) {
                let data = JSON.stringify({ 
                    game: 'clicker', 
                    score: Math.floor(balance),
                    hasMiner: hasMiner,
                    activeSkin: activeSkinId,
                    inventory: inventory.join(',')
                });
                tg.sendData(data);
                tg.close();
            } else {
                alert(`Сохранено локально. Баланс: ${Math.floor(balance)}`);
            }
        }

        // Запуск
        applySkin('gold');
        updateUI();
        if (hasMiner) startMining();
    </script>
</body>
</html>
