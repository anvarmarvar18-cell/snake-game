<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyper Traffic</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; overflow: hidden; font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Запрет свайпов браузера */
        }
        canvas {
            display: block; width: 100%; height: 100%;
        }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #00ffcc; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 10px #00ffcc; z-index: 10;
        }
        #gameOverScreen {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
            color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        h1 { color: #ff0055; text-shadow: 0 0 20px #ff0055; font-size: 40px; margin-bottom: 10px; }
        p { font-size: 20px; margin-bottom: 30px; color: #aaa; }
        .btn {
            background: linear-gradient(45deg, #00ffcc, #0088ff);
            border: none; padding: 15px 40px; font-size: 22px; color: #000;
            font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6); margin: 10px;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="scoreVal">0</span></div>

    <div id="gameOverScreen">
        <h1>CRASHED!</h1>
        <p>Your Score: <span id="finalScore">0</span></p>
        <button class="btn" onclick="sendScore()">Получить монеты</button>
        <button class="btn" style="background: #333; color: white; box-shadow: none;" onclick="restartGame()">Играть еще</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // Настройки дороги
        const laneCount = 3;
        const laneWidth = width / laneCount;
        let roadOffset = 0;
        let gameSpeed = 5;
        let score = 0;
        let gameOver = false;
        let animationId;

        // Физика частиц (Выхлоп)
        let particles = [];
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = Math.random() * 3 + 2;
                this.color = `rgba(255, ${Math.floor(Math.random() * 150 + 100)}, 0, ${Math.random()})`;
                this.life = 1.0;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.05;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // Класс Машины
        class Car {
            constructor(lane, isPlayer = false) {
                this.lane = lane; // 0 (left), 1 (center), 2 (right)
                this.isPlayer = isPlayer;
                this.carWidth = laneWidth * 0.6;
                this.carHeight = this.carWidth * 2;
                this.x = this.getLaneCenterX();
                this.y = isPlayer ? height - this.carHeight - 40 : -this.carHeight;
                // Плавное перестроение
                this.targetX = this.x; 
            }

            getLaneCenterX() {
                return (this.lane * laneWidth) + (laneWidth / 2) - (this.carWidth / 2);
            }

            moveLeft() { if (this.lane > 0) { this.lane--; this.targetX = this.getLaneCenterX(); } }
            moveRight() { if (this.lane < laneCount - 1) { this.lane++; this.targetX = this.getLaneCenterX(); } }

            update() {
                // Интерполяция для плавного движения влево/вправо
                this.x += (this.targetX - this.x) * 0.15;

                if (!this.isPlayer) {
                    this.y += gameSpeed * 0.7; // Скорость встречного трафика
                } else {
                    // Спавн частиц для игрока
                    particles.push(new Particle(this.x + this.carWidth/2 - 10, this.y + this.carHeight));
                    particles.push(new Particle(this.x + this.carWidth/2 + 10, this.y + this.carHeight));
                }
            }

            draw() {
                ctx.save();
                // Тень машины
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 5;
                ctx.shadowOffsetY = 10;

                // Градиент кузова
                let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.carWidth, this.y + this.carHeight);
                if (this.isPlayer) {
                    grad.addColorStop(0, '#00ffcc'); grad.addColorStop(1, '#0055ff');
                } else {
                    grad.addColorStop(0, '#ff0055'); grad.addColorStop(1, '#880000');
                }
                
                // Рисуем кузов
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.carWidth, this.carHeight, 10);
                ctx.fill();

                // Лобовое стекло
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#111';
                ctx.fillRect(this.x + 5, this.y + 15, this.carWidth - 10, this.carHeight * 0.25);
                
                // Заднее стекло
                ctx.fillRect(this.x + 5, this.y + this.carHeight - 30, this.carWidth - 10, 15);

                // Фары
                ctx.shadowColor = this.isPlayer ? '#00ffcc' : '#ff0000';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 5, this.y - 2, 10, 5); // Левая
                ctx.fillRect(this.x + this.carWidth - 15, this.y - 2, 10, 5); // Правая

                ctx.restore();
            }
        }

        let player = new Car(1, true);
        let traffic = [];

        function spawnTraffic() {
            if (frames % (Math.max(40, 100 - Math.floor(score/5))) === 0) {
                let randomLane = Math.floor(Math.random() * laneCount);
                traffic.push(new Car(randomLane, false));
            }
        }

        let frames = 0;

        function drawRoad() {
            // Асфальт
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);

            // Разделительные полосы
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 4;
            ctx.setLineDash([40, 40]);
            
            roadOffset += gameSpeed;
            if (roadOffset > 80) roadOffset = 0;

            for (let i = 1; i < laneCount; i++) {
                ctx.lineDashOffset = -roadOffset;
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, height);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        function checkCollision(rect1, rect2) {
            // Уменьшаем хитбокс для честной игры (на 10 пикселей)
            return (
                rect1.x + 10 < rect2.x + rect2.carWidth - 10 &&
                rect1.x + rect1.carWidth - 10 > rect2.x + 10 &&
                rect1.y + 10 < rect2.y + rect2.carHeight - 10 &&
                rect1.y + rect1.carHeight - 10 > rect2.y + 10
            );
        }

        function gameLoop() {
            if (gameOver) return;
            
            ctx.clearRect(0, 0, width, height);
            drawRoad();

            player.update();
            player.draw();

            spawnTraffic();

            // Обновляем и рисуем встречку
            for (let i = traffic.length - 1; i >= 0; i--) {
                let car = traffic[i];
                car.update();
                car.draw();

                // Удаляем машины, которые уехали вниз
                if (car.y > height) {
                    traffic.splice(i, 1);
                    score += 10;
                    document.getElementById('scoreVal').innerText = score;
                    
                    // Увеличиваем скорость
                    if (score % 100 === 0) gameSpeed += 0.5;
                }

                // Проверка столкновения
                if (checkCollision(player, car)) {
                    gameOver = true;
                    document.getElementById('finalScore').innerText = score;
                    document.getElementById('gameOverScreen').style.display = 'flex';
                }
            }

            // Обновляем частицы
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            frames++;
            animationId = requestAnimationFrame(gameLoop);
        }

        // Управление тапами по краям экрана
        window.addEventListener('touchstart', (e) => {
            if (gameOver) return;
            let touchX = e.touches[0].clientX;
            if (touchX < width / 2) player.moveLeft();
            else player.moveRight();
        });

        // Управление клавиатурой (для тестов на Маке)
        window.addEventListener('keydown', (e) => {
            if (gameOver) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') player.moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') player.moveRight();
        });

        function sendScore() {
            tg.sendData(JSON.stringify({ game: 'traffic', score: score }));
            tg.close();
        }

        function restartGame() {
            gameOver = false;
            score = 0;
            gameSpeed = 5;
            traffic = [];
            particles = [];
            player = new Car(1, true);
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('gameOverScreen').style.display = 'none';
            gameLoop();
        }

        // Запуск
        gameLoop();
    </script>
</body>
</html>
