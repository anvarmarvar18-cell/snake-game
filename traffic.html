<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyper Traffic - Perfect Logic</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #111; overflow: hidden; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; font-weight: bold; z-index: 10; pointer-events: none; }
        .hud-box { background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
        #gameOverScreen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        h1 { color: #ff3333; font-size: 45px; margin-bottom: 10px; text-transform: uppercase; }
        p { font-size: 22px; margin-bottom: 30px; color: #ddd; }
        .btn { background: linear-gradient(45deg, #ff8800, #ff0055); border: none; padding: 15px 40px; font-size: 20px; color: white; font-weight: bold; border-radius: 30px; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>
    <div id="ui"><div class="hud-box">SCORE: <span id="scoreVal">0</span></div></div>
    
    <div id="gameOverScreen">
        <h1>АВАРИЯ!</h1>
        <p>Счет: <span id="finalScore">0</span></p>
        <button class="btn" onclick="sendScore()">Сохранить монеты</button>
        <button class="btn" style="background: #333;" onclick="restartGame()">Повторить</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        let tg;
        try { tg = window.Telegram.WebApp; tg.expand(); } catch(e) {}

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const skinsColors = { 'lambo': '#ffcc00', 'ferrari': '#ff0000', 'bmw': '#0055ff', 'mercedes': '#dddddd', 'bugatti': '#002288' };
        const skinsList = Object.keys(skinsColors);
        
        const urlParams = new URLSearchParams(window.location.search);
        let playerSkin = urlParams.get('skin');
        if (!skinsList.includes(playerSkin)) playerSkin = 'lambo';

        const loadedImages = {};
        skinsList.forEach(skin => {
            let img = new Image();
            img.src = `${skin}.png`; 
            img.onload = () => { loadedImages[skin] = img; };
        });

        const laneCount = 3;
        const laneWidth = canvas.width / laneCount;
        let gameSpeed = 6;
        let score = 0;
        let gameOver = false;
        let roadOffset = 0;

        function drawProceduralCar(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.roundRect(x + 5, y, w - 10, h, 10); ctx.fill();
            ctx.fillStyle = '#111';
            ctx.fillRect(x + 10, y + h * 0.2, w - 20, h * 0.2); // Лобовое
            ctx.fillRect(x + 10, y + h * 0.7, w - 20, h * 0.15); // Заднее
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x + 8, y + h - 5, 8, 4); // Фары задние
            ctx.fillRect(x + w - 16, y + h - 5, 8, 4);
        }

        class Car {
            constructor(lane, isPlayer = false, skinName = 'lambo') {
                this.lane = lane;
                this.isPlayer = isPlayer;
                this.skin = skinName;
                this.width = laneWidth * 0.55;
                this.height = this.width * 2;
                this.x = (this.lane * laneWidth) + (laneWidth / 2) - (this.width / 2);
                this.y = isPlayer ? canvas.height - this.height - 50 : -this.height * 2;
                this.targetX = this.x; 
            }

            moveLeft() { if (this.lane > 0) { this.lane--; this.targetX = (this.lane * laneWidth) + (laneWidth / 2) - (this.width / 2); } }
            moveRight() { if (this.lane < laneCount - 1) { this.lane++; this.targetX = (this.lane * laneWidth) + (laneWidth / 2) - (this.width / 2); } }

            update() {
                this.x += (this.targetX - this.x) * 0.25; // Плавность поворота
                if (!this.isPlayer) this.y += gameSpeed * 0.6; // Скорость встречных
            }

            draw() {
                if (loadedImages[this.skin]) {
                    ctx.drawImage(loadedImages[this.skin], this.x, this.y, this.width, this.height);
                } else {
                    drawProceduralCar(this.x, this.y, this.width, this.height, skinsColors[this.skin] || '#ff0000');
                }
            }
        }

        let player = new Car(1, true, playerSkin);
        let traffic = [];
        let frames = 0;

        function spawnTraffic() {
            let spawnInterval = Math.max(50, 120 - Math.floor(score / 5)); // Чем больше очков, тем чаще машины
            if (frames % spawnInterval === 0) {
                // ИДЕАЛЬНАЯ ЛОГИКА: Всегда оставляем 1 пустую полосу
                let safeLane = Math.floor(Math.random() * 3); 
                let availableLanes = [0, 1, 2];
                availableLanes.splice(safeLane, 1); // Удаляем безопасную полосу из списка для спавна

                availableLanes.forEach(lane => {
                    // 70% шанс появления машины на оставшихся полосах
                    if (Math.random() > 0.3) {
                        let randomSkin = skinsList[Math.floor(Math.random() * skinsList.length)];
                        traffic.push(new Car(lane, false, randomSkin));
                    }
                });
            }
        }

        function drawRoad() {
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            roadOffset += gameSpeed; if (roadOffset > 100) roadOffset = 0;
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.setLineDash([40, 60]);
            for (let i = 1; i < laneCount; i++) {
                ctx.lineDashOffset = -roadOffset;
                ctx.beginPath(); ctx.moveTo(i * laneWidth, 0); ctx.lineTo(i * laneWidth, canvas.height); ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        function checkCollision(rect1, rect2) {
            // Уменьшенный хитбокс (Прощаем 20% по краям для честности)
            let mx = rect1.width * 0.2; 
            let my = rect1.height * 0.15;
            return (
                rect1.x + mx < rect2.x + rect2.width - mx &&
                rect1.x + rect1.width - mx > rect2.x + mx &&
                rect1.y + my < rect2.y + rect2.height - my &&
                rect1.y + rect1.height - my > rect2.y + my
            );
        }

        function gameLoop() {
            if (gameOver) return;
            drawRoad();
            spawnTraffic();

            for (let i = traffic.length - 1; i >= 0; i--) {
                let car = traffic[i];
                car.update(); car.draw();

                if (car.y > canvas.height) {
                    traffic.splice(i, 1);
                    score += 10;
                    document.getElementById('scoreVal').innerText = score;
                    if (score % 50 === 0) gameSpeed += 0.5; // Ускорение
                }

                if (checkCollision(player, car)) {
                    gameOver = true;
                    document.getElementById('finalScore').innerText = score;
                    document.getElementById('gameOverScreen').style.display = 'flex';
                }
            }

            player.update(); player.draw();
            frames++;
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('touchstart', (e) => {
            if (gameOver) return;
            if (e.touches[0].clientX < canvas.width / 2) player.moveLeft(); else player.moveRight();
        });

        function sendScore() {
            if(tg && tg.sendData) { tg.sendData(JSON.stringify({ game: 'traffic', score: score })); tg.close(); } 
            else restartGame();
        }

        function restartGame() {
            gameOver = false; score = 0; gameSpeed = 6; traffic = []; frames = 0;
            player = new Car(1, true, playerSkin);
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('gameOverScreen').style.display = 'none';
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
