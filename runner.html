<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Runner SYNTHWAVE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: linear-gradient(to bottom, #1a0b2e, #2a0033); overflow: hidden; color: white; touch-action: none; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 10%; width: 100%; text-align: center; font-size: 70px; font-weight: 900; color: #00ffcc; text-shadow: 0 0 25px #00ffcc; pointer-events: none; z-index: 10;}
    </style>
</head>
<body>
    <div id="ui">ТАПАЙ = ПРЫЖОК<br><span style="font-size:30px">В ВОЗДУХЕ = ДВОЙНОЙ ПРЫЖОК</span></div>
    <canvas id="gameCanvas"></canvas>
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        if(tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let score = 0; let gameActive = false; let gameOver = false;
        let groundY = canvas.height - 100;
        let gameSpeed = 8; let frames = 0;

        let player = {
            x: 80, y: groundY - 40, w: 40, h: 40,
            dy: 0, gravity: 1.2, jumpForce: -16, jumps: 0
        };

        let obstacles = [];

        function drawBackground() {
            // Synthwave Солнце
            ctx.fillStyle = '#ff0055'; ctx.shadowBlur = 50; ctx.shadowColor = '#ff0055';
            ctx.beginPath(); ctx.arc(canvas.width/2, groundY, 150, Math.PI, 0); ctx.fill(); ctx.shadowBlur = 0;
            // Полоски на солнце (эффект ретро)
            ctx.fillStyle = '#2a0033';
            for(let i=0; i<5; i++) ctx.fillRect(canvas.width/2 - 150, groundY - i*30 - 10, 300, 10);

            // 3D Сетка на земле
            ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
            for(let i=0; i<canvas.width; i+=60) {
                let shift = (frames * gameSpeed) % 60;
                ctx.beginPath(); ctx.moveTo(i - shift, groundY); ctx.lineTo(i - shift - 150, canvas.height); ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            if (gameActive) {
                player.dy += player.gravity; player.y += player.dy;

                if (player.y >= groundY - player.h) {
                    player.y = groundY - player.h; player.dy = 0; player.jumps = 0; // Сброс прыжков
                }

                // Сложный генератор (иногда спавнит широкие ямы, требующие 2 прыжка)
                if (frames % Math.max(45, 90 - score) === 0) {
                    let w = Math.random() > 0.7 ? 80 : 40; // Широкий блок
                    let h = Math.random() > 0.5 ? 60 : 40; // Высокий блок
                    obstacles.push({ x: canvas.width, y: groundY - h, w: w, h: h, passed: false });
                }

                ctx.fillStyle = '#ff00ff'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff00ff';
                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.x -= gameSpeed;
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

                    // Смерть
                    if (player.x < obs.x + obs.w && player.x + player.w > obs.x && player.y < obs.y + obs.h) {
                        gameActive = false; gameOver = true;
                        document.getElementById('ui').innerHTML = `УБИТ!<br>${score}`;
                        setTimeout(() => tg.sendData(JSON.stringify({ game: "runner", earned: score * 8, score: score })), 1500);
                    }

                    if (obs.x + obs.w < player.x && !obs.passed) {
                        score++; document.getElementById('ui').innerText = score; obs.passed = true;
                        if(score % 10 === 0) gameSpeed += 1; // Ускорение как в Формуле 1!
                    }
                }
                ctx.shadowBlur = 0;
                obstacles = obstacles.filter(o => o.x + o.w > 0);
                frames++;
            }

            // Игрок
            ctx.fillStyle = '#00ffcc'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffcc';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.shadowBlur = 0;

            if (!gameOver) requestAnimationFrame(draw);
        }

        function action() {
            if (!gameActive && !gameOver) { gameActive = true; document.getElementById('ui').innerText = '0'; }
            if (gameActive && player.jumps < 2) { // ДВОЙНОЙ ПРЫЖОК
                player.dy = player.jumpForce;
                player.jumps++;
            }
        }
        window.addEventListener('touchstart', action); window.addEventListener('mousedown', action);
        draw();
    </script>
</body>
</html>
