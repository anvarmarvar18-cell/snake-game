<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aero City - NEXT GEN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗА: Идеальный сброс и защита */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #030108; overflow: hidden; touch-action: none; color: white; height: 100vh; width: 100vw; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* ИНТЕРФЕЙС (Глассморфизм) */
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .hud-panel { background: rgba(10, 15, 30, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.2); padding: 15px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .score-label { color: #0ff; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; font-weight: 800; opacity: 0.8; }
        .score-val { color: #fff; font-size: 42px; font-weight: 900; text-shadow: 0 0 20px rgba(0, 255, 255, 0.8); line-height: 1.1; }
        .coins-val { color: #ffd700; font-size: 20px; font-weight: 800; margin-top: 5px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); display: flex; align-items: center; gap: 8px; }
        
        /* КНОПКА МЕНЮ */
        .smart-menu-btn { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(10, 15, 30, 0.6); backdrop-filter: blur(10px); color: #0ff; border: 1px solid rgba(0,255,255,0.4); border-radius: 16px; padding: 14px 22px; font-weight: 900; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 255, 0.15); transition: transform 0.1s, background 0.3s; }
        .smart-menu-btn:active { transform: scale(0.92); background: rgba(0, 255, 255, 0.2); }

        /* МОДАЛЬНЫЕ ОКНА (ААА Дизайн) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 1, 8, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal.active { opacity: 1; pointer-events: all; }
        
        .modal-content { background: radial-gradient(circle at top right, #111a3a, #050814); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 28px; width: 88%; max-width: 420px; max-height: 85vh; padding: 35px 25px; display: flex; flex-direction: column; gap: 16px; text-align: center; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 255, 255, 0.05); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal.active .modal-content { transform: scale(1); }
        
        .modal-title { color: #fff; text-transform: uppercase; letter-spacing: 5px; font-size: 24px; margin-bottom: 5px; font-weight: 900; background: linear-gradient(90deg, #fff, #0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { padding: 18px; font-size: 17px; font-weight: 900; border-radius: 18px; color: white; border: none; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .btn:active { transform: scale(0.95) translateY(2px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn-green { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .btn-blue { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .btn-red { background: linear-gradient(135deg, #ff416c, #ff4b2b); }

        /* МАГАЗИН И СКРОЛЛ */
        .shop-container { overflow-y: auto; max-height: 50vh; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 12px; padding: 5px; border-radius: 16px; }
        .shop-container::-webkit-scrollbar { width: 5px; }
        .shop-container::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.5); border-radius: 10px; }
        
        .skin-card { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .skin-card.active { background: rgba(0, 255, 255, 0.08); border-color: rgba(0, 255, 255, 0.8); box-shadow: 0 0 25px rgba(0,255,255,0.15); transform: scale(1.02); }
        .skin-icon { width: 45px; height: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .skin-name { font-weight: 800; font-size: 16px; color: #fff; letter-spacing: 0.5px; }
        
        .buy-btn { padding: 12px 18px; border-radius: 12px; border: none; font-weight: 900; font-size: 14px; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .btn-buy { background: #ffd700; color: #000; box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); }
        .btn-select { background: #0ff; color: #000; box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3); }
        .btn-selected { background: rgba(255,255,255,0.1); color: #888; box-shadow: none; pointer-events: none; }
        
        /* АНИМАЦИИ */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(6px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }
        
        .flash { animation: flash 0.3s ease-out; }
        @keyframes flash { 0% { background: rgba(255,255,255,0.8); } 100% { background: transparent; } }
        #flash-overlay { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1500; }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="ui-layer">
        <div class="hud-panel">
            <div class="score-label">Сектор</div>
            <div class="score-val" id="score">0</div>
            <div class="coins-val">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffd700"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.64-2.25 1.64-1.74 0-2.24-1.06-2.28-1.92H7.9c.04 1.46 1.06 2.67 2.97 3.03V19h1.76v-1.67c1.76-.3 2.94-1.42 2.94-2.93 0-2.36-1.98-3.07-3.26-3.36z"/></svg>
                <span id="coins">0</span>
            </div>
        </div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">⚙️ MENU</button>
    <canvas id="gameCanvas"></canvas>

    <!-- МЕНЮ ПАУЗЫ -->
    <div id="smartModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">ТЕРМИНАЛ</div>
            <button class="btn btn-blue" onclick="openShop()">🚀 АНГАР (12 КОРАБЛЕЙ)</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ВЫХОД В БАЗУ</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ ВЫЛЕТ</button>
        </div>
    </div>

    <!-- АНГАР -->
    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">АНГАР</div>
            <div style="color: #ffd700; font-weight: 900; font-size: 20px; margin-bottom: 5px;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="shopList"></div>
            <button class="btn btn-green" onclick="closeShop()">НАЗАД</button>
        </div>
    </div>

    <!-- ЭКРАН СМЕРТИ -->
    <div id="gameOverScreen" class="modal">
        <div class="modal-content" style="background: rgba(10,0,0,0.9); border-color: #ff0055;">
            <h1 style="color: #ff0055; font-size: 46px; text-shadow: 0 0 30px #ff0055; margin-bottom: 25px; font-weight: 900; line-height: 1;">СИГНАЛ<br>ПОТЕРЯН</h1>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 15px;">🔄 НОВЫЙ ВЫЛЕТ</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 СОХРАНИТЬ И ВЫЙТИ</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM API
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', e => {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗА ДАННЫХ: 12 ЭЛИТНЫХ СКИНОВ
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'MK-1 Scout', price: 0, c1: '#e0e0e0', c2: '#00ffff', trail: '#00ffff' },
        { id: 'crimson', name: 'Crimson Fury', price: 1000, c1: '#ffffff', c2: '#ff003c', trail: '#ff0000' },
        { id: 'toxic', name: 'Toxic Viper', price: 1500, c1: '#111111', c2: '#39ff14', trail: '#00ff00' },
        { id: 'gold', name: 'Solar Flare', price: 2000, c1: '#ffffff', c2: '#ffd700', trail: '#ffaa00' },
        { id: 'phantom', name: 'Phantom X', price: 2500, c1: '#1a1a1a', c2: '#888888', trail: '#aaaaaa' },
        { id: 'neon', name: 'Neon Rider', price: 3000, c1: '#ff00ff', c2: '#00ffff', trail: '#ff00ff' },
        { id: 'plasma', name: 'Plasma Core', price: 3000, c1: '#ffffff', c2: '#ff00ff', trail: '#ff00aa' },
        { id: 'glitch', name: 'Glitch Hack', price: 3000, c1: '#00ffff', c2: '#ff0000', trail: '#ffffff' },
        { id: 'obsidian', name: 'Obsidian', price: 3000, c1: '#050505', c2: '#444444', trail: '#ff0000' },
        { id: 'quantum', name: 'Quantum Leap', price: 3500, c1: '#0000ff', c2: '#00ff00', trail: '#ffffff' },
        { id: 'celestial', name: 'Celestial', price: 3500, c1: '#ffffff', c2: '#ffffff', trail: '#ffff00' },
        { id: 'black_hole', name: 'Dark Matter (+20%)', price: 4000, c1: '#000000', c2: '#9d00ff', trail: '#800080' }
    ];

    let localCoins = parseInt(localStorage.getItem('aero_coins')) || 0;
    let unlocked = JSON.parse(localStorage.getItem('aero_unlocked')) || ['default'];
    let activeSkin = localStorage.getItem('aero_active_skin') || 'default';
    let sessionCoins = 0; let startTime = Date.now();

    // ==========================================
    // 3. AAA ДВИЖОК (ФИЗИКА, МАТЕМАТИКА, РЕНДЕР)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = canvas.width = window.innerWidth;
    let ch = canvas.height = window.innerHeight;

    let gameState = 'start'; 
    let score = 0;
    let frames = 0;
    let baseSpeed = (cw > 600) ? 7 : 4.5; // Адаптация под экраны
    
    // Параллакс Звезд (4 слоя для 3D эффекта)
    const stars = Array(80).fill().map(() => ({
        x: Math.random() * cw, y: Math.random() * ch,
        r: Math.random() * 1.5 + 0.2, 
        speed: Math.random() * 0.8 + 0.1,
        color: Math.random() > 0.8 ? '#0ff' : '#fff'
    }));

    // --- ИДЕАЛЬНАЯ МАТЕМАТИКА ИГРОКА ---
    const player = {
        x: cw * 0.3, y: ch / 2, 
        r: 14, // РАДИУС ИДЕАЛЬНОГО КРУГЛОГО ХИТБОКСА (AAA collision)
        vy: 0, gravity: 0.45, jumpForce: -8,
        
        draw(skin) {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Динамический наклон (Плавный Lerp)
            let targetRot = Math.min(Math.PI / 3, Math.max(-Math.PI / 3, (this.vy * 0.08)));
            ctx.rotate(targetRot);
            
            ctx.shadowBlur = 20; ctx.shadowColor = skin.c2;
            
            // Отрисовка Кибер-Истребителя
            ctx.fillStyle = skin.c1;
            ctx.beginPath();
            ctx.moveTo(20, 0); // Нос
            ctx.lineTo(-12, -14); // Верхнее крыло
            ctx.lineTo(-18, -14);
            ctx.lineTo(-14, 0); // Сопло двигателя
            ctx.lineTo(-18, 14);
            ctx.lineTo(-12, 14); // Нижнее крыло
            ctx.closePath();
            ctx.fill();

            // Энергетическое ядро
            ctx.fillStyle = skin.c2;
            ctx.beginPath(); ctx.ellipse(4, 0, 10, 4, 0, 0, Math.PI*2); ctx.fill();
            
            // Для дебага (скрыто): показ идеального хитбокса
            // ctx.strokeStyle = 'red'; ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2); ctx.stroke();
            
            ctx.restore();
        },
        update() {
            this.vy += this.gravity;
            this.y += this.vy;

            // Генерация частиц двигателя
            if (frames % 2 === 0 && this.vy < 5) {
                let s = SKINS.find(sk => sk.id === activeSkin);
                particles.push({
                    x: this.x - 20, y: this.y + (Math.random()-0.5)*10,
                    vx: -baseSpeed * 1.5 - Math.random()*2, vy: (Math.random()-0.5)*2,
                    life: 1, color: s.trail, size: Math.random()*4 + 3
                });
            }

            // Упал на землю или улетел в космос
            if (this.y - this.r < -50 || this.y + this.r > ch + 50) gameOver();
        },
        jump() {
            this.vy = this.jumpForce;
            // Вспышка под кораблем
            createParticles(this.x - 10, this.y + 10, '#fff', 8, 3);
        }
    };

    let pipes = [];
    let coins = []; // Парящие монеты
    let particles = [];
    const pipeWidth = 70;
    let gapSize = Math.max(150, ch * 0.25); // Окно адаптивно

    function spawnPipe() {
        let minHeight = 80;
        let maxHeight = ch - gapSize - 80;
        let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
        
        // Умная сложность: после 10 очков трубы начинают двигаться!
        let isMoving = score > 10 && Math.random() > 0.5;
        
        pipes.push({
            x: cw, top: topHeight, bottom: topHeight + gapSize,
            passed: false,
            moving: isMoving, dir: Math.random() > 0.5 ? 1 : -1,
            speedY: Math.random() * 1.5 + 0.5
        });

        // Спавн монеты в центре прохода с шансом 50%
        if (Math.random() > 0.5) {
            coins.push({
                x: cw + pipeWidth / 2, y: topHeight + gapSize / 2,
                r: 12, collected: false, angle: 0
            });
        }
    }

    function createParticles(x, y, color, count, speedMax) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y, vx: (Math.random()-0.5)*speedMax, vy: (Math.random()-0.5)*speedMax,
                life: 1, color: color, size: Math.random()*5 + 2
            });
        }
    }

    // --- ИДЕАЛЬНАЯ МАТЕМАТИКА AABB-CIRCLE ---
    function isCollision(circle, rx, ry, rw, rh) {
        let testX = circle.x;
        let testY = circle.y;

        if (circle.x < rx) testX = rx; // левый край
        else if (circle.x > rx + rw) testX = rx + rw; // правый край

        if (circle.y < ry) testY = ry; // верхний край
        else if (circle.y > ry + rh) testY = ry + rh; // нижний край

        let distX = circle.x - testX;
        let distY = circle.y - testY;
        let distance = Math.sqrt((distX*distX) + (distY*distY));

        return distance <= circle.r;
    }

    function drawAndLogic() {
        // Отрисовка труб
        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= baseSpeed;

            // Движение труб по вертикали (если активно)
            if (p.moving) {
                p.top += p.speedY * p.dir;
                p.bottom += p.speedY * p.dir;
                if (p.top < 40 || p.bottom > ch - 40) p.dir *= -1;
            }

            // Дизайн Лазерных Ворот
            ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff';
            let grad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
            grad.addColorStop(0, '#001a33'); grad.addColorStop(0.5, '#00ffff'); grad.addColorStop(1, '#001a33');
            ctx.fillStyle = grad;

            // Верх
            ctx.fillRect(p.x, 0, pipeWidth, p.top);
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 4, p.top - 12, pipeWidth + 8, 12);
            
            // Низ
            ctx.fillStyle = grad; ctx.fillRect(p.x, p.bottom, pipeWidth, ch - p.bottom);
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 4, p.bottom, pipeWidth + 8, 12);
            ctx.shadowBlur = 0;

            // Проверка столкновений (Честная Математика!)
            if (isCollision(player, p.x, 0, pipeWidth, p.top) || 
                isCollision(player, p.x, p.bottom, pipeWidth, ch - p.bottom)) {
                gameOver();
            }

            // Очки
            if (!p.passed && player.x > p.x + pipeWidth) {
                p.passed = true;
                score++;
                document.getElementById('score').innerText = score;
                
                // Вспышка экрана при прохождении
                let flash = document.getElementById('flash-overlay');
                flash.classList.remove('flash');
                void flash.offsetWidth; // Триггер рефлоу
                flash.classList.add('flash');

                // Сложность
                if (score % 5 === 0) {
                    baseSpeed += 0.25;
                    gapSize = Math.max(120, gapSize - 8);
                }
            }
            if (p.x + pipeWidth < 0) pipes.splice(i, 1);
        }

        // Отрисовка и сбор монет
        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.x -= baseSpeed;
            c.angle += 0.1;

            if (!c.collected) {
                ctx.save(); ctx.translate(c.x, c.y);
                ctx.scale(Math.sin(c.angle), 1); // 3D вращение монеты
                ctx.shadowBlur = 15; ctx.shadowColor = '#ffd700';
                ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ccaa00'; ctx.beginPath(); ctx.arc(0, 0, c.r*0.6, 0, Math.PI*2); ctx.fill();
                ctx.restore();

                // Сбор (расстояние между кругами)
                let dx = player.x - c.x; let dy = player.y - c.y;
                if (Math.sqrt(dx*dx + dy*dy) < player.r + c.r) {
                    c.collected = true;
                    let earned = score > 30 ? 20 : 10;
                    sessionCoins += earned; localCoins += earned;
                    document.getElementById('coins').innerText = sessionCoins;
                    createParticles(c.x, c.y, '#ffd700', 15, 6);
                }
            }
            if (c.x < -20) coins.splice(i, 1);
        }
    }

    function loop() {
        requestAnimationFrame(loop);
        if (gameState === 'paused' || gameState === 'gameover') return;

        // Космический фон (Глубокий синий)
        ctx.fillStyle = '#030108'; ctx.fillRect(0, 0, cw, ch);

        // Звезды
        stars.forEach(s => {
            s.x -= s.speed + (gameState === 'playing' ? baseSpeed * 0.2 : 0);
            if (s.x < 0) { s.x = cw; s.y = Math.random() * ch; }
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.r > 1 ? 1 : 0.5;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;

        let skin = SKINS.find(s => s.id === activeSkin);

        if (gameState === 'playing') {
            player.update();
            if (frames % Math.floor(110 / (baseSpeed/4.5)) === 0) spawnPipe();
            drawAndLogic();
        } else if (gameState === 'start') {
            player.y = ch/2 + Math.sin(frames * 0.05) * 15;
            ctx.fillStyle = '#0ff'; ctx.font = '900 24px Arial'; ctx.textAlign = 'center'; ctx.shadowBlur = 20; ctx.shadowColor = '#0ff';
            ctx.fillText("ТАПНИ ЧТОБЫ ВЗЛЕТЕТЬ", cw/2, ch/2 + 60);
            ctx.shadowBlur = 0;
        }

        player.draw(skin);

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
        frames++;
    }

    // ==========================================
    // 4. УПРАВЛЕНИЕ И МЕНЮ (ААА UX)
    // ==========================================
    window.addEventListener('touchstart', (e) => {
        if(e.target.closest('.smart-menu-btn') || e.target.closest('.modal')) return;
        if(gameState === 'start') { gameState = 'playing'; player.jump(); return; }
        if(gameState === 'playing') player.jump();
    });

    function gameOver() {
        gameState = 'gameover';
        createParticles(player.x, player.y, '#ff0055', 50, 15); // Мега взрыв
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);
        
        localStorage.setItem('aero_coins', localCoins);
        setTimeout(() => {
            document.getElementById('gameOverScreen').classList.add('active');
            canvas.style.filter = 'blur(8px) brightness(0.5)';
        }, 600);
    }

    function resetGame() {
        document.getElementById('gameOverScreen').classList.remove('active');
        canvas.style.filter = 'none';
        
        player.y = ch / 2; player.vy = 0;
        pipes = []; coins = []; particles = [];
        score = 0; frames = 0;
        baseSpeed = (cw > 600) ? 7 : 4.5; 
        gapSize = Math.max(150, ch * 0.25);
        
        document.getElementById('score').innerText = score;
        gameState = 'start';
    }

    // МЕНЮ
    document.getElementById('mainMenuBtn').onclick = () => {
        if (gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.add('active');
    };
    function closeMenu() {
        document.getElementById('smartModal').classList.remove('active');
        if (gameState === 'paused') gameState = 'playing';
    }

    function openShop() {
        document.getElementById('smartModal').classList.remove('active');
        document.getElementById('shopModal').classList.add('active');
        document.getElementById('shopCoins').innerText = localCoins;
        
        const list = document.getElementById('shopList');
        list.innerHTML = '';
        
        SKINS.forEach(skin => {
            let isUnl = unlocked.includes(skin.id);
            let isAct = activeSkin === skin.id;
            
            let btnHtml = isAct ? `<button class="buy-btn btn-selected">АКТИВЕН</button>` :
                          isUnl ? `<button class="buy-btn btn-select" onclick="equipSkin('${skin.id}')">ВЫБРАТЬ</button>` :
                          `<button class="buy-btn btn-buy" onclick="buySkin('${skin.id}', ${skin.price})">КУПИТЬ ${skin.price}💰</button>`;

            list.innerHTML += `
                <div class="skin-card ${isAct ? 'active' : ''}">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div class="skin-icon" style="background: radial-gradient(${skin.c2}, ${skin.c1});"></div>
                        <div class="skin-name">${skin.name}</div>
                    </div>
                    ${btnHtml}
                </div>
            `;
        });
    }

    function closeShop() { document.getElementById('shopModal').classList.remove('active'); document.getElementById('smartModal').classList.add('active'); }

    window.buySkin = function(id, price) {
        if (localCoins >= price) {
            localCoins -= price; unlocked.push(id);
            localStorage.setItem('aero_coins', localCoins);
            localStorage.setItem('aero_unlocked', JSON.stringify(unlocked));
            equipSkin(id);
        } else {
            tg.showAlert('⚠ Ошибка Транзакции: Недостаточно кредитов.');
        }
    }

    window.equipSkin = function(id) { activeSkin = id; localStorage.setItem('aero_active_skin', activeSkin); openShop(); }

    window.saveAndExit = function() {
        let data = {
            game: "aero", coins: sessionCoins, score: score,
            time_spent: Math.floor((Date.now() - startTime) / 1000), active_skin: activeSkin
        };
        tg.sendData(JSON.stringify(data));
    }

    requestAnimationFrame(loop);

</script>
</body>
</html>
