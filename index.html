<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пенальти PRO: Битва Легенд</title>
    <style>
        /* Базовые стили и шрифты */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Экраны */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; background: radial-gradient(circle, #2b2b52, #1a1a2e); }
        .active-screen { display: flex; }

        h1 { font-size: 3rem; margin-bottom: 20px; color: #f39c12; text-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; }
        h2 { font-size: 2rem; margin-bottom: 15px; }

        /* Кнопки меню */
        .btn { padding: 15px 40px; font-size: 1.5rem; margin: 10px; border: none; border-radius: 50px; background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4); text-transform: uppercase; font-weight: bold; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(46, 204, 113, 0.6); }
        .btn-blue { background: linear-gradient(135deg, #2980b9, #3498db); box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4); }
        .btn-blue:hover { box-shadow: 0 8px 20px rgba(52, 152, 219, 0.6); }

        /* Экран выбора (Драфт) */
        .draft-container { display: flex; gap: 30px; width: 90%; max-width: 1000px; height: 60vh; }
        .roster-col { flex: 1; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; overflow-y: auto; border: 2px solid #34495e; }
        .roster-col h3 { text-align: center; margin-bottom: 15px; color: #f1c40f; }
        .card { display: flex; align-items: center; padding: 10px; background: #2c3e50; margin-bottom: 10px; border-radius: 10px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .card:hover { background: #34495e; }
        .card.selected { border-color: #f1c40f; background: #3d566e; transform: scale(1.02); }
        .card-emoji { font-size: 2rem; margin-right: 15px; }
        .card-name { font-size: 1.2rem; font-weight: bold; }
        
        #draft-status { font-size: 1.5rem; margin: 20px 0; color: #e74c3c; font-weight: bold; }

        /* Игровой экран */
        #scoreboard { display: flex; justify-content: space-between; align-items: center; width: 800px; background: rgba(0,0,0,0.8); padding: 15px 30px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.7); z-index: 10; border: 1px solid #555; }
        .team-info { display: flex; flex-direction: column; align-items: center; }
        .team-name { font-size: 1.2rem; font-weight: bold; color: #f1c40f; }
        .dots { display: flex; gap: 5px; margin-top: 5px; }
        .dot { width: 15px; height: 15px; border-radius: 50%; background: #555; border: 2px solid #222; }
        .dot.goal { background: #2ecc71; border-color: #27ae60; box-shadow: 0 0 10px #2ecc71; }
        .dot.miss { background: #e74c3c; border-color: #c0392b; box-shadow: 0 0 10px #e74c3c; }
        #score-center { font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* Футбольное поле (3D эффект) */
        #game-area { position: relative; width: 800px; height: 500px; background: repeating-linear-gradient(0deg, #27ae60, #27ae60 40px, #2ecc71 40px, #2ecc71 80px); border: 5px solid white; border-bottom: none; border-radius: 10px 10px 0 0; overflow: hidden; box-shadow: inset 0 50px 100px rgba(0,0,0,0.5); perspective: 1000px; }
        .penalty-arc { position: absolute; bottom: 350px; left: 300px; width: 200px; height: 80px; border: 4px solid white; border-radius: 100px 100px 0 0; border-bottom: none; }
        .penalty-box { position: absolute; bottom: 0; left: 150px; width: 500px; height: 350px; border: 4px solid white; border-bottom: none; }
        .penalty-spot { position: absolute; bottom: 120px; left: 390px; width: 16px; height: 16px; background: white; border-radius: 50%; box-shadow: 0 0 5px rgba(255,255,255,0.8); }

        /* Ворота */
        #goal { position: absolute; top: 30px; left: 150px; width: 500px; height: 200px; border: 8px solid #ecf0f1; border-bottom: none; border-radius: 5px 5px 0 0; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #net { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.3) 50%, transparent 52%), linear-gradient(-45deg, transparent 48%, rgba(255,255,255,0.3) 50%, transparent 52%); background-size: 20px 20px; z-index: 1; }

        /* Игровые объекты */
        #gk-container { position: absolute; bottom: 270px; left: 375px; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; z-index: 2; transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
        #gk-emoji { font-size: 60px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); transition: transform 0.7s; }
        #gk-name-tag { position: absolute; top: -20px; background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 5px; font-size: 12px; white-space: nowrap; }

        #ball-container { position: absolute; bottom: 105px; left: 375px; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; z-index: 3; transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        #ball { font-size: 40px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transition: transform 0.5s linear; }

        #striker-container { position: absolute; bottom: 10px; left: 360px; width: 80px; text-align: center; z-index: 4; }
        #striker-emoji { font-size: 80px; filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6)); transition: transform 0.3s; }
        #striker-name-tag { background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 5px; font-size: 14px; margin-top: -10px; }

        /* Оверлей выбора 9 зон */
        #action-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; display: none; }
        .grid-9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; width: 400px; }
        .zone-btn { height: 80px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); }
        .zone-btn:hover { background: rgba(46, 204, 113, 0.4); border-color: #2ecc71; transform: scale(1.05); }

        #announcer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: bold; text-transform: uppercase; color: #fff; text-shadow: 0 0 20px #000, 0 0 30px #f1c40f; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <!-- Экран 1: Главное Меню -->
    <div id="screen-menu" class="screen active-screen">
        <h1>🏆 Пенальти PRO</h1>
        <button class="btn btn-blue" onclick="setMode('1p')">1 Игрок (Против ИИ)</button>
        <button class="btn" onclick="setMode('2p')">2 Игрока (Локально)</button>
    </div>

    <!-- Экран 2: Драфт (Выбор игроков) -->
    <div id="screen-draft" class="screen">
        <h2 id="draft-title">Драфт: Игрок 1 выбирает команду</h2>
        <div id="draft-status">Выбери Нападающего</div>
        <div class="draft-container">
            <div class="roster-col" id="strikers-list">
                <h3>Нападающие ⚽</h3>
                <!-- Генерируется через JS -->
            </div>
            <div class="roster-col" id="gks-list">
                <h3>Вратари 🧤</h3>
                <!-- Генерируется через JS -->
            </div>
        </div>
    </div>

    <!-- Экран 3: Игровое поле -->
    <div id="screen-game" class="screen">
        <div id="scoreboard">
            <div class="team-info">
                <div class="team-name" id="t1-name">Команда 1</div>
                <div class="dots" id="t1-dots"></div>
            </div>
            <div id="score-center">0 - 0</div>
            <div class="team-info">
                <div class="team-name" id="t2-name">Команда 2</div>
                <div class="dots" id="t2-dots"></div>
            </div>
        </div>

        <div id="game-area">
            <div class="penalty-arc"></div>
            <div class="penalty-box"></div>
            <div class="penalty-spot"></div>
            <div id="goal"><div id="net"></div></div>

            <div id="gk-container">
                <div id="gk-name-tag">Вратарь</div>
                <div id="gk-emoji">🧍‍♂️</div>
            </div>

            <div id="ball-container"><div id="ball">⚽</div></div>

            <div id="striker-container">
                <div id="striker-emoji">🧑‍.</div>
                <div id="striker-name-tag">Игрок</div>
            </div>

            <!-- Экран выбора куда бить/прыгать -->
            <div id="action-overlay">
                <h2 id="action-title" style="color: #f1c40f;">Ход Игрока 1</h2>
                <p id="action-desc" style="font-size: 1.2rem;">Отвернись от соперника! Выбери зону.</p>
                <div class="grid-9" id="grid-zones">
                    <!-- 9 кнопок генерируются в JS -->
                </div>
            </div>

            <div id="announcer">ГОЛ!</div>
        </div>
    </div>

    <script>
        // Базы данных игроков
        const dbStrikers = [
            { id: 1, name: "Л. Месси", img: "🇦🇷" }, { id: 2, name: "К. Роналду", img: "🇵🇹" },
            { id: 3, name: "К. Мбаппе", img: "🇫🇷" }, { id: 4, name: "Э. Холанд", img: "🇳🇴" },
            { id: 5, name: "Неймар", img: "🇧🇷" }, { id: 6, name: "Р. Левандовски", img: "🇵🇱" },
            { id: 7, name: "М. Салах", img: "🇪🇬" }, { id: 8, name: "К. Де Брюйне", img: "🇧🇪" },
            { id: 9, name: "З. Ибрагимович", img: "🇸🇪" }, { id: 10, name: "Винисиус", img: "🇧🇷" }
        ];

        const dbGKs = [
            { id: 11, name: "М. Нойер", img: "🇩🇪" }, { id: 12, name: "Дж. Буффон", img: "🇮🇹" },
            { id: 13, name: "Л. Яшин", img: "🇷🇺" }, { id: 14, name: "И. Касильяс", img: "🇪🇸" },
            { id: 15, name: "Т. Куртуа", img: "🇧🇪" }, { id: 16, name: "Алиссон", img: "🇧🇷" },
            { id: 17, name: "Я. Облак", img: "🇸🇮" }, { id: 18, name: "Эми Мартинес", img: "🇦🇷" },
            { id: 19, name: "П. Чех", img: "🇨🇿" }, { id: 20, name: "Доннарумма", img: "🇮🇹" }
        ];

        // Координаты зон на поле (1-9). Формат: top, left
        const zones = {
            1: { bY: 40, bX: 170, gY: 40, gX: 180, gRot: -70 }, // Лев Вер
            2: { bY: 40, bX: 375, gY: 40, gX: 375, gRot: 0 },   // Цен Вер
            3: { bY: 40, bX: 580, gY: 40, gX: 570, gRot: 70 },  // Прав Вер
            4: { bY: 130, bX: 170, gY: 130, gX: 190, gRot: -80 },// Лев Сре
            5: { bY: 130, bX: 375, gY: 130, gX: 375, gRot: 0 },  // Цен Сре
            6: { bY: 130, bX: 580, gY: 130, gX: 560, gRot: 80 }, // Прав Сре
            7: { bY: 200, bX: 170, gY: 210, gX: 200, gRot: -90 },// Лев Низ
            8: { bY: 200, bX: 375, gY: 220, gX: 375, gRot: 0 },  // Цен Низ
            9: { bY: 200, bX: 580, gY: 210, gX: 550, gRot: 90 }  // Прав Низ
        };
        const zoneNames = ["Лев Вер", "Цен Вер", "Прав Вер", "Лев Сре", "Цен Сре", "Прав Сре", "Лев Низ", "Цен Низ", "Прав Низ"];

        // Состояние игры
        let gameState = {
            mode: '1p', // '1p' или '2p'
            p1: { striker: null, gk: null, score: 0, history: [] },
            p2: { striker: null, gk: null, score: 0, history: [] },
            draftPhase: 1, // 1: P1 Striker, 2: P1 GK, 3: P2 Striker, 4: P2 GK
            round: 1, // Текущий раунд пенальти (до 5)
            turn: 1, // 1: P1 бьет, 2: P2 бьет
            actionPhase: 'shot', // 'shot' или 'dive'
            currentShotTarget: null,
            currentDiveTarget: null,
            suddenDeath: false
        };

        // --- НАВИГАЦИЯ ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        }

        // --- ЭТАП 1: МЕНЮ ---
        function setMode(mode) {
            gameState.mode = mode;
            renderDraft();
            showScreen('screen-draft');
        }

        // --- ЭТАП 2: ДРАФТ ---
        function renderDraft() {
            const sList = document.getElementById('strikers-list');
            const gList = document.getElementById('gks-list');
            sList.innerHTML = '<h3>Нападающие ⚽</h3>';
            gList.innerHTML = '<h3>Вратари 🧤</h3>';

            dbStrikers.forEach(p => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<div class="card-emoji">${p.img}</div><div class="card-name">${p.name}</div>`;
                div.onclick = () => selectPlayer(p, 'striker', div);
                sList.appendChild(div);
            });

            dbGKs.forEach(p => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<div class="card-emoji">${p.img}</div><div class="card-name">${p.name}</div>`;
                div.onclick = () => selectPlayer(p, 'gk', div);
                gList.appendChild(div);
            });

            updateDraftUI();
        }

        function updateDraftUI() {
            const title = document.getElementById('draft-title');
            const status = document.getElementById('draft-status');
            
            if (gameState.draftPhase === 1) {
                title.innerText = "Игрок 1 (Твоя команда)"; status.innerText = "Выбери Нападающего ⚽";
            } else if (gameState.draftPhase === 2) {
                title.innerText = "Игрок 1 (Твоя команда)"; status.innerText = "Выбери Вратаря 🧤";
            } else if (gameState.draftPhase === 3) {
                title.innerText = gameState.mode === '2p' ? "Игрок 2 (Соперник)" : "Компьютер выбирает...";
                status.innerText = "Выбор Нападающего ⚽";
                if (gameState.mode === '1p') setTimeout(cpuDraft, 500);
            } else if (gameState.draftPhase === 4) {
                title.innerText = gameState.mode === '2p' ? "Игрок 2 (Соперник)" : "Компьютер выбирает...";
                status.innerText = "Выбор Вратаря 🧤";
                if (gameState.mode === '1p') setTimeout(cpuDraft, 500);
            } else {
                startMatch();
            }
        }

        function selectPlayer(player, type, el) {
            if (gameState.draftPhase === 1 && type === 'striker') {
                gameState.p1.striker = player; gameState.draftPhase = 2;
            } else if (gameState.draftPhase === 2 && type === 'gk') {
                gameState.p1.gk = player; gameState.draftPhase = 3;
            } else if (gameState.draftPhase === 3 && type === 'striker' && gameState.mode === '2p') {
                gameState.p2.striker = player; gameState.draftPhase = 4;
            } else if (gameState.draftPhase === 4 && type === 'gk' && gameState.mode === '2p') {
                gameState.p2.gk = player; gameState.draftPhase = 5;
            }
            if(el) el.classList.add('selected');
            setTimeout(updateDraftUI, 200);
        }

        function cpuDraft() {
            if (gameState.draftPhase === 3) {
                gameState.p2.striker = dbStrikers[Math.floor(Math.random() * dbStrikers.length)];
                gameState.draftPhase = 4;
            } else if (gameState.draftPhase === 4) {
                gameState.p2.gk = dbGKs[Math.floor(Math.random() * dbGKs.length)];
                gameState.draftPhase = 5;
            }
            updateDraftUI();
        }

        // --- ЭТАП 3: ИГРОВОЙ ПРОЦЕСС ---
        function startMatch() {
            showScreen('screen-game');
            document.getElementById('t1-name').innerText = "Игрок 1";
            document.getElementById('t2-name').innerText = gameState.mode === '2p' ? "Игрок 2" : "Компьютер";
            
            // Генерация кнопок зон
            const grid = document.getElementById('grid-zones');
            grid.innerHTML = '';
            for(let i=1; i<=9; i++) {
                let btn = document.createElement('button');
                btn.className = 'zone-btn';
                btn.innerText = zoneNames[i-1];
                btn.onclick = () => handleZoneSelection(i);
                grid.appendChild(btn);
            }
            
            renderScoreDots();
            setupTurnRoles();
        }

        function renderScoreDots() {
            const t1 = document.getElementById('t1-dots');
            const t2 = document.getElementById('t2-dots');
            t1.innerHTML = ''; t2.innerHTML = '';
            
            // Показываем минимум 5 точек или больше при Sudden Death
            let maxDots = Math.max(5, gameState.p1.history.length, gameState.p2.history.length);
            
            for(let i=0; i<maxDots; i++) {
                let d1 = document.createElement('div'); d1.className = 'dot';
                if(gameState.p1.history[i] === 1) d1.classList.add('goal');
                else if(gameState.p1.history[i] === 0) d1.classList.add('miss');
                t1.appendChild(d1);

                let d2 = document.createElement('div'); d2.className = 'dot';
                if(gameState.p2.history[i] === 1) d2.classList.add('goal');
                else if(gameState.p2.history[i] === 0) d2.classList.add('miss');
                t2.appendChild(d2);
            }
            document.getElementById('score-center').innerText = `${gameState.p1.score} - ${gameState.p2.score}`;
        }

        function setupTurnRoles() {
            const strikerData = gameState.turn === 1 ? gameState.p1.striker : gameState.p2.striker;
            const gkData = gameState.turn === 1 ? gameState.p2.gk : gameState.p1.gk;

            document.getElementById('striker-emoji').innerText = strikerData.img;
            document.getElementById('striker-name-tag').innerText = strikerData.name;
            document.getElementById('gk-emoji').innerText = gkData.img;
            document.getElementById('gk-name-tag').innerText = gkData.name;

            gameState.actionPhase = 'shot';
            showActionOverlay();
        }

        function showActionOverlay() {
            const overlay = document.getElementById('action-overlay');
            const title = document.getElementById('action-title');
            const desc = document.getElementById('action-desc');
            
            overlay.style.display = 'flex';

            if (gameState.actionPhase === 'shot') {
                let activePlayerName = gameState.turn === 1 ? "ИГРОК 1" : (gameState.mode === '2p' ? "ИГРОК 2" : "КОМПЬЮТЕР");
                title.innerText = `${activePlayerName}: УДАР!`;
                desc.innerText = gameState.mode === '2p' ? "Второй игрок, отвернись! Куда бьем?" : "Выбери цель для удара.";
                
                if(gameState.turn === 2 && gameState.mode === '1p') {
                    // CPU бьет
                    overlay.style.display = 'none';
                    setTimeout(() => {
                        handleZoneSelection(Math.floor(Math.random() * 9) + 1);
                    }, 800);
                }
            } else {
                let activePlayerName = gameState.turn === 1 ? (gameState.mode === '2p' ? "ИГРОК 2" : "КОМПЬЮТЕР") : "ИГРОК 1";
                title.innerText = `${activePlayerName}: СЕЙВ!`;
                desc.innerText = gameState.mode === '2p' ? "Бьющий, отвернись! Куда прыгаем?" : "Угадай, куда полетит мяч!";
                
                if(gameState.turn === 1 && gameState.mode === '1p') {
                    // CPU на воротах
                    overlay.style.display = 'none';
                    setTimeout(() => {
                        handleZoneSelection(Math.floor(Math.random() * 9) + 1);
                    }, 800);
                }
            }
        }

        function handleZoneSelection(zoneId) {
            if (gameState.actionPhase === 'shot') {
                gameState.currentShotTarget = zoneId;
                gameState.actionPhase = 'dive';
                
                // Эффект перехода (черный экран на секунду для смены игроков)
                document.getElementById('action-overlay').style.background = 'black';
                document.getElementById('grid-zones').style.display = 'none';
                
                setTimeout(() => {
                    document.getElementById('action-overlay').style.background = 'rgba(0,0,0,0.85)';
                    document.getElementById('grid-zones').style.display = 'grid';
                    showActionOverlay();
                }, 1000);

            } else {
                gameState.currentDiveTarget = zoneId;
                document.getElementById('action-overlay').style.display = 'none';
                playAnimationSequence();
            }
        }

        // --- АНИМАЦИЯ И ЛОГИКА СЕЙВА ---
        function playAnimationSequence() {
            const ball = document.getElementById('ball-container');
            const ballImg = document.getElementById('ball');
            const gk = document.getElementById('gk-container');
            const gkImg = document.getElementById('gk-emoji');
            const strikerImg = document.getElementById('striker-emoji');
            
            // 1. Замах
            strikerImg.style.transform = "rotate(-20deg) scale(1.1) translateX(-10px)";
            
            setTimeout(() => {
                // 2. Удар
                strikerImg.style.transform = "rotate(15deg) scale(0.9) translateX(10px)";
                
                // Настройки полета мяча (уменьшается в перспективе)
                let targetB = zones[gameState.currentShotTarget];
                ball.style.bottom = targetB.bY + 'px';
                ball.style.left = targetB.bX + 'px';
                ball.style.transform = "scale(0.5)"; // улетает вдаль
                ballImg.style.transform = "rotate(1080deg)"; // сильное вращение

                // Настройки прыжка вратаря
                let targetG = zones[gameState.currentDiveTarget];
                gk.style.bottom = targetG.gY + 'px';
                gk.style.left = targetG.gX + 'px';
                gkImg.style.transform = `rotate(${targetG.gRot}deg) scale(1.2)`;

                setTimeout(resolveOutcome, 600); // Ждем прилета мяча
            }, 400);
        }

        function resolveOutcome() {
            let isGoal = true;
            
            // Жесткая проверка: если зоны совпали = 100% сейв (как ты и просил)
            if (gameState.currentShotTarget === gameState.currentDiveTarget) {
                isGoal = false;
            }

            const ann = document.getElementById('announcer');
            if (isGoal) {
                ann.innerText = "⚽ ГОЛ!";
                ann.style.color = "#2ecc71";
                if(gameState.turn === 1) { gameState.p1.score++; gameState.p1.history.push(1); }
                else { gameState.p2.score++; gameState.p2.history.push(1); }
            } else {
                ann.innerText = "🧤 СЕЙВ!";
                ann.style.color = "#e74c3c";
                // Анимация отскока мяча при сейве
                const ball = document.getElementById('ball-container');
                ball.style.bottom = '100px'; 
                ball.style.left = (parseInt(ball.style.left) - 100) + 'px'; // отскок в сторону
                
                if(gameState.turn === 1) gameState.p1.history.push(0);
                else gameState.p2.history.push(0);
            }

            ann.style.opacity = 1;
            renderScoreDots();

            setTimeout(() => {
                ann.style.opacity = 0;
                resetPositions();
                checkMatchEnd();
            }, 2500);
        }

        function resetPositions() {
            const ball = document.getElementById('ball-container');
            const ballImg = document.getElementById('ball');
            const gk = document.getElementById('gk-container');
            const gkImg = document.getElementById('gk-emoji');
            const strikerImg = document.getElementById('striker-emoji');

            // Отключаем плавность для мгновенного возврата
            ball.style.transition = "none"; gk.style.transition = "none"; 
            ballImg.style.transition = "none"; gkImg.style.transition = "none"; strikerImg.style.transition = "none";

            // Исходные координаты
            ball.style.bottom = "105px"; ball.style.left = "375px"; ball.style.transform = "scale(1)";
            ballImg.style.transform = "rotate(0deg)";
            gk.style.bottom = "270px"; gk.style.left = "375px"; 
            gkImg.style.transform = "rotate(0deg) scale(1)";
            strikerImg.style.transform = "rotate(0deg) scale(1) translateX(0)";

            // Возвращаем плавность
            setTimeout(() => {
                ball.style.transition = "all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)";
                ballImg.style.transition = "transform 0.5s linear";
                gk.style.transition = "all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1)";
                gkImg.style.transition = "transform 0.7s";
                strikerImg.style.transition = "transform 0.3s";
            }, 50);
        }

        function checkMatchEnd() {
            let p1Shots = gameState.p1.history.length;
            let p2Shots = gameState.p2.history.length;
            let p1Score = gameState.p1.score;
            let p2Score = gameState.p2.score;

            // Логика футбольных пенальти (основные 5 ударов)
            let remainingP1 = 5 - p1Shots;
            let remainingP2 = 5 - p2Shots;
            
            let gameEnded = false;
            let winner = 0;

            if (p1Shots <= 5 && p2Shots <= 5 && !gameState.suddenDeath) {
                // Математически невозможно отыграться
                if (p1Score > p2Score + remainingP2) { gameEnded = true; winner = 1; }
                if (p2Score > p1Score + remainingP1) { gameEnded = true; winner = 2; }
                
                // Если пробили по 5 и ничья - включаем внезапную смерть
                if (p1Shots === 5 && p2Shots === 5 && p1Score === p2Score) {
                    gameState.suddenDeath = true;
                    document.getElementById('announcer').innerText = "ВНЕЗАПНАЯ СМЕРТЬ!";
                    document.getElementById('announcer').style.opacity = 1;
                    setTimeout(() => { document.getElementById('announcer').style.opacity = 0; advanceTurn(); }, 2000);
                    return;
                }
            } else if (gameState.suddenDeath) {
                // Если равное количество ударов и счет разный - конец игры
                if (p1Shots === p2Shots) {
                    if (p1Score > p2Score) { gameEnded = true; winner = 1; }
                    if (p2Score > p1Score) { gameEnded = true; winner = 2; }
                }
            }

            if (gameEnded) {
                document.getElementById('announcer').innerText = winner === 1 ? "🏆 ПОБЕДА ИГРОКА 1!" : (gameState.mode==='2p' ? "🏆 ПОБЕДА ИГРОКА 2!" : "💻 КОМПЬЮТЕР ПОБЕДИЛ!");
                document.getElementById('announcer').style.opacity = 1;
                document.getElementById('announcer').style.color = "#f1c40f";
                
                // Кнопка рестарта
                let btn = document.createElement('button');
                btn.innerText = "Играть снова";
                btn.className = "btn";
                btn.style.marginTop = "80px";
                btn.onclick = () => location.reload();
                document.getElementById('announcer').appendChild(document.createElement('br'));
                document.getElementById('announcer').appendChild(btn);
            } else {
                advanceTurn();
            }
        }

        function advanceTurn() {
            if (gameState.turn === 1) {
                gameState.turn = 2; // Очередь второго
            } else {
                gameState.turn = 1; // Возврат к первому
                gameState.round++;
            }
            setupTurnRoles();
        }
    </script>
</body>
</html>
