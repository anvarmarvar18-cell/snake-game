<!DOCTYPE html>
<html>
<head>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #222; color: white; font-family: sans-serif; }
  canvas { border: 2px solid white; background-color: black; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const grid = 20;
  let snake = [{x: 160, y: 160}];
  let dx = grid, dy = 0;
  let food = {x: 320, y: 320};
  let score = 0;

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && dx === 0) { dx = -grid; dy = 0; }
    if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -grid; }
    if (e.key === "ArrowRight" && dx === 0) { dx = grid; dy = 0; }
    if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = grid; }
  });

  function gameLoop() {
    snake.unshift({x: snake[0].x + dx, y: snake[0].y + dy});
    if (snake[0].x === food.x && snake[0].y === food.y) {
      score += 10;
      food = {x: Math.floor(Math.random() * (canvas.width / grid)) * grid, y: Math.floor(Math.random() * (canvas.height / grid)) * grid};
    } else { snake.pop(); }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "red"; ctx.fillRect(food.x, food.y, grid - 2, grid - 2);
    ctx.fillStyle = "lime"; snake.forEach(part => ctx.fillRect(part.x, part.y, grid - 2, grid - 2));

    if (snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height || snake.slice(1).some(part => part.x === snake[0].x && part.y === snake[0].y)) {
      alert("Game Over! Score: " + score);
      snake = [{x: 160, y: 160}]; dx = grid; dy = 0; score = 0;
    }
  }
  setInterval(gameLoop, 100);
</script>
</body>
</html>
