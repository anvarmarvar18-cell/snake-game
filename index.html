<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Drive</title>
    <!-- Подключаем библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0f0f1b; overflow: hidden; color: white; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10%; left: 0; width: 100%; text-align: center; pointer-events: none; }
        h1 { font-size: 50px; margin: 0; text-shadow: 0 0 15px #00ffcc; color: #00ffcc; }
        p { font-size: 20px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>
    <div id="ui">
        <h1 id="scoreBoard">0</h1>
        <p id="msg">Нажми на экран, чтобы лететь</p>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Связь с ботом
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем на весь экран

        let frames = 0;
        let score = 0;
        let gameActive = false;
        let gameOver = false;

        // Настройки машины
        const car = {
            x: 50, y: canvas.height/2, width: 40, height: 20,
            velocity: 0, gravity: 0.6, jump: -10,
            draw() {
                ctx.fillStyle = '#ff00ff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff00ff';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            },
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                if(this.y + this.height > canvas.height || this.y < 0) endGame();
            },
            flap() { this.velocity = this.jump; }
        };

        const obstacles = [];
        function handleObstacles() {
            if (frames % 100 === 0) {
                let gap = 200; // Ширина прохода
                let topHeight = Math.random() * (canvas.height - gap - 100) + 50;
                obstacles.push({ x: canvas.width, top: topHeight, bottom: topHeight + gap, width: 50, passed: false });
            }
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= 5; // Скорость игры

                ctx.fillStyle = '#00ffcc';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffcc';
                ctx.fillRect(obs.x, 0, obs.width, obs.top);
                ctx.fillRect(obs.x, obs.bottom, obs.width, canvas.height - obs.bottom);
                ctx.shadowBlur = 0;

                // Столкновение
                if (car.x < obs.x + obs.width && car.x + car.width > obs.x &&
                    (car.y < obs.top || car.y + car.height > obs.bottom)) {
                    endGame();
                }

                // Очки
                if (obs.x + obs.width < car.x && !obs.passed) {
                    score++;
                    document.getElementById('scoreBoard').innerText = score;
                    obs.passed = true;
                }
            }
            if (obstacles.length > 0 && obstacles[0].x < -60) obstacles.shift();
        }

        function endGame() {
            gameActive = false;
            gameOver = true;
            document.getElementById('msg').innerText = 'Игра окончена! Сохраняем рекорд...';
            
            // Самая важная строчка: отправляем счет в Python-бота!
            setTimeout(() => {
                tg.sendData(JSON.stringify({ score: score }));
            }, 1500);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameActive) {
                car.update();
                car.draw();
                handleObstacles();
                frames++;
                requestAnimationFrame(animate);
            } else if (!gameOver) {
                car.draw();
                requestAnimationFrame(animate);
            }
        }

        // Управление касанием экрана
        window.addEventListener('touchstart', () => {
            if (!gameActive && !gameOver) { gameActive = true; document.getElementById('msg').innerText = ''; }
            if (gameActive) car.flap();
        });
        window.addEventListener('mousedown', () => {
            if (!gameActive && !gameOver) { gameActive = true; document.getElementById('msg').innerText = ''; }
            if (gameActive) car.flap();
        });

        animate();
    </script>
</body>
</html>
