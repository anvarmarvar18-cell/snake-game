<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aero City PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: linear-gradient(to bottom, #0a0a2a, #1a0b2e); overflow: hidden; touch-action: none; color: white; font-family: 'Courier New', monospace;}
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10%; width: 100%; text-align: center; font-size: 60px; font-weight: 900; color: #00ffcc; text-shadow: 0 0 20px #00ffcc; pointer-events: none; z-index: 10;}
    </style>
</head>
<body>
    <div id="ui">ТАПАЙ!</div>
    <canvas id="gameCanvas"></canvas>
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        // Читаем ГЛОБАЛЬНЫЙ СКИН из бота
        const urlParams = new URLSearchParams(window.location.search);
        const currentSkin = urlParams.get('skin') || 'neon';

        // Загрузка фото друга
        const imgFriend = new Image();
        imgFriend.src = 'friend.png'; // ТВОЙ PNG ФАЙЛ НА GITHUB
        let imgLoaded = false;
        imgFriend.onload = () => { imgLoaded = true; };

        let gameActive = false, gameOver = false, score = 0, frames = 0;
        let gameSpeed = 5;

        const player = {
            x: 50, y: canvas.height/2, size: 36, velocity: 0, gravity: 0.5, jump: -8,
            draw() {
                // Отрисовка скинов (размер физического хитбокса - 36px, картинки рисуются крупнее)
                if (currentSkin === 'friend') {
                    if (imgLoaded) ctx.drawImage(imgFriend, this.x-10, this.y-10, 56, 56);
                    else { ctx.fillStyle = '#fff'; ctx.fillRect(this.x, this.y, this.size, this.size); }
                } else if (currentSkin === 'rocket') {
                    ctx.font = "45px Arial"; ctx.fillText("🚀", this.x-5, this.y + 35);
                } else if (currentSkin === 'btc') {
                    ctx.font = "45px Arial"; ctx.fillText("₿", this.x, this.y + 35);
                } else if (currentSkin === 'ball') {
                    ctx.font = "45px Arial"; ctx.fillText("🏀", this.x-5, this.y + 35);
                } else if (currentSkin === 'bird') {
                    ctx.font = "45px Arial"; ctx.fillText("🦅", this.x-5, this.y + 35);
                } else if (currentSkin === 'star') {
                    ctx.font = "45px Arial"; ctx.fillText("⭐", this.x-5, this.y + 35);
                } else {
                    ctx.fillStyle = '#00ffcc'; ctx.shadowBlur = 20; ctx.shadowColor = '#00ffcc';
                    ctx.beginPath(); ctx.arc(this.x+this.size/2, this.y+this.size/2, this.size/2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                }
            }
        };

        let obstacles = [];
        function spawnObstacle() {
            let gap = 220 - (score * 2.5); if (gap < 120) gap = 120; // Проход сужается!
            let topH = Math.random() * (canvas.height - gap - 100) + 50;
            obstacles.push({ x: canvas.width, w: 70, top: topH, bottom: canvas.height - (topH + gap), passed: false });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Звездный фон
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for(let i=0; i<30; i++) ctx.fillRect((frames*0.5 + i*50)%canvas.width, (i*47)%canvas.height, 2, 2);

            if (gameActive) {
                player.velocity += player.gravity; player.y += player.velocity;
                if (player.y > canvas.height || player.y < -50) endGame();
                
                if (frames % 90 === 0) spawnObstacle();
                
                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.x -= gameSpeed;
                    
                    // Неоновые башни
                    ctx.fillStyle = '#ff00ff'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff00ff';
                    ctx.fillRect(obs.x, 0, obs.w, obs.top);
                    ctx.fillRect(obs.x, canvas.height - obs.bottom, obs.w, obs.bottom);
                    ctx.shadowBlur = 0;
                    
                    // Жесткий Хитбокс
                    if (player.x < obs.x + obs.w && player.x + player.size > obs.x &&
                        (player.y < obs.top || player.y + player.size > canvas.height - obs.bottom)) {
                        endGame();
                    }
                    
                    if (obs.x + obs.w < player.x && !obs.passed) {
                        score++; document.getElementById('ui').innerText = score; obs.passed = true;
                        if(score % 5 === 0) gameSpeed += 0.5; // Ускорение!
                    }
                }
                obstacles = obstacles.filter(o => o.x + o.w > 0);
                frames++;
            }
            player.draw();
            if (!gameOver) requestAnimationFrame(draw);
        }

        function endGame() {
            gameActive = false; gameOver = true; document.getElementById('ui').innerText = "РАЗБИТ!";
            setTimeout(() => tg.sendData(JSON.stringify({ game: "drive", earned: score * 10, score: score })), 1500);
        }
        
        function flap() {
            if (!gameActive && !gameOver) { gameActive = true; document.getElementById('ui').innerText = "0"; }
            if (gameActive) player.velocity = player.jump;
        }
        window.addEventListener('touchstart', flap); window.addEventListener('mousedown', flap);
        draw();
    </script>
</body>
</html>
