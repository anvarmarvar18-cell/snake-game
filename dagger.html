<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Dagger 7.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at center, #1a1a2e, #050510); overflow: hidden; touch-action: none; color: white; height: 100vh; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 100; text-shadow: 0 0 10px #000; font-weight: bold; pointer-events: none; }
        .score-text { color: #fff; font-size: 26px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 10px #0ff; }
        .coins-text { color: #ffd700; font-size: 22px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .level-text { color: #ff00ff; font-size: 18px; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #ff00ff; }
        
        .smart-menu-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: rgba(0, 0, 0, 0.7); color: #0ff; border: 2px solid #0ff; border-radius: 8px; padding: 10px 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #0ff; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        .modal-content { background: linear-gradient(135deg, #111, #1a1a2e); border: 2px solid #0ff; border-radius: 15px; width: 85%; max-height: 85vh; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); }
        
        .btn { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; color: white; border: none; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .btn-blue { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .btn-red { background: linear-gradient(45deg, #ff416c, #ff4b2b); }

        .shop-container { overflow-y: auto; max-height: 50vh; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 5px; }
        .skin-card { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .skin-card.active { border-color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .buy-btn { padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; }
        .btn-buy { background: #ffd700; color: #000; }
        .btn-select { background: #0ff; color: #000; }
        .btn-selected { background: #444; color: #888; }
        
        .floating-text { position: absolute; font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #0f0; pointer-events: none; animation: floatUp 1s ease-out forwards; z-index: 500; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="score-text">Очки: <span id="score">0</span></div>
        <div class="coins-text"><span id="coins">0</span> 💰</div>
        <div class="level-text" id="levelText">УРОВЕНЬ 1</div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">⚙️ МЕНЮ</button>
    
    <!-- Индикатор оставшихся ножей -->
    <div id="daggers-left" style="position: absolute; bottom: 20px; left: 20px; z-index: 50; display: flex; flex-direction: column-reverse; gap: 5px;"></div>

    <canvas id="gameCanvas"></canvas>

    <!-- Главное Меню -->
    <div id="smartModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: white;">ПАУЗА</h2>
            <button class="btn btn-blue" onclick="openShop()">🗡 АРСЕНАЛ (НОЖИ)</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ВЫХОД В БОТА</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- Ангар -->
    <div id="shopModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: #0ff;">АРСЕНАЛ</h2>
            <div style="color: #ffd700;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="shopList"></div>
            <button class="btn btn-green" onclick="closeShop()">НАЗАД</button>
        </div>
    </div>

    <!-- Смерть -->
    <div id="gameOverScreen" class="modal hidden">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;">
            <h1 style="color: #ff416c; font-size: 45px; text-shadow: 0 0 20px red; margin-bottom: 20px;">КЛИНОК СЛОМАН!</h1>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 15px;">🔄 НАЧАТЬ ЗАНОВО</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ЗАБРАТЬ МОНЕТЫ</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ И БЛОКИРОВКИ ТЕЛЕГРАМА
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', e => {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗА СКИНОВ НОЖЕЙ (10 ШТУК)
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'Cyber Kunai', price: 0, c1: '#ccc', c2: '#0ff' },
        { id: 'katana', name: 'Mini Katana', price: 1000, c1: '#fff', c2: '#ff0055' },
        { id: 'gold', name: 'Golden Dagger', price: 1500, c1: '#ffd700', c2: '#fff' },
        { id: 'emerald', name: 'Emerald Blade', price: 2000, c1: '#00ff00', c2: '#005500' },
        { id: 'blood', name: 'Blood Spike', price: 2500, c1: '#ff0000', c2: '#550000' },
        { id: 'shuriken', name: 'Ninja Shuriken', price: 3000, c1: '#777', c2: '#0ff' },
        { id: 'laser_blue', name: 'Laser Sword', price: 3000, c1: '#fff', c2: '#0055ff', isLaser: true },
        { id: 'laser_red', name: 'Sith Laser', price: 3000, c1: '#fff', c2: '#ff0000', isLaser: true },
        { id: 'amethyst', name: 'Amethyst Shiv', price: 3000, c1: '#d400ff', c2: '#5500ff' },
        { id: 'black_hole', name: 'Dark Matter (+20%)', price: 3000, c1: '#222', c2: '#800080' }
    ];

    let localCoins = parseInt(localStorage.getItem('dagger_coins')) || 0;
    let unlocked = JSON.parse(localStorage.getItem('dagger_unlocked')) || ['default'];
    let activeSkin = localStorage.getItem('dagger_skin') || 'default';
    
    let sessionCoins = 0;
    let startTime = Date.now();

    // ==========================================
    // 3. МАТЕМАТИКА И ДВИЖОК ИГРЫ
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = canvas.width = window.innerWidth;
    let ch = canvas.height = window.innerHeight;

    let gameState = 'start'; 
    let score = 0;
    let level = 1;
    let particles = [];

    // Мишень
    let target = {
        x: cw / 2,
        y: ch * 0.35,
        r: 70,
        angle: 0,
        speed: 0.03,
        stuckDaggers: [], // Углы уже воткнутых ножей (в радианах)
        type: 'wood' // wood, melon, gear, reactor
    };

    // Активный нож (который летит)
    let activeDagger = null;
    let daggersToThrow = 5;
    let daggersLeft = 5;

    // Отрисовка ножа
    function drawDagger(ctx, skin, isStuck = false) {
        ctx.shadowBlur = skin.isLaser ? 15 : 5;
        ctx.shadowColor = skin.c2;
        
        if (skin.id === 'shuriken') {
            // Сюрикен (если летит - крутится, если воткнут - стоит)
            ctx.fillStyle = skin.c1;
            ctx.beginPath();
            ctx.moveTo(0, -20); ctx.lineTo(5, -5); ctx.lineTo(20, 0); ctx.lineTo(5, 5);
            ctx.lineTo(0, 20); ctx.lineTo(-5, 5); ctx.lineTo(-20, 0); ctx.lineTo(-5, -5);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = skin.c2;
            ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
        } 
        else if (skin.isLaser) {
            // Лазерный меч
            ctx.fillStyle = skin.c1;
            ctx.beginPath(); ctx.roundRect(-4, -30, 8, 40, 5); ctx.fill(); // Лезвие
            ctx.fillStyle = '#555';
            ctx.fillRect(-6, 10, 12, 15); // Рукоять
        }
        else {
            // Классический Кунай / Клинок
            ctx.fillStyle = skin.c1;
            ctx.beginPath();
            ctx.moveTo(0, -30); // Острие
            ctx.lineTo(8, -5); // Правый край
            ctx.lineTo(3, 5); // Начало рукояти
            ctx.lineTo(3, 20); // Конец рукояти
            ctx.arc(0, 23, 3, 0, Math.PI*2); // Кольцо
            ctx.lineTo(-3, 20);
            ctx.lineTo(-3, 5);
            ctx.lineTo(-8, -5);
            ctx.closePath(); ctx.fill();
            // Кровосток/Свечение в центре
            ctx.fillStyle = skin.c2;
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(2, -5); ctx.lineTo(-2, -5); ctx.closePath(); ctx.fill();
        }
    }

    // Отрисовка Мишени (Босса)
    function drawTarget() {
        ctx.save();
        ctx.translate(target.x, target.y);
        ctx.rotate(target.angle);

        ctx.shadowBlur = 10;
        
        if (target.type === 'wood') {
            ctx.shadowColor = '#5c4033'; ctx.fillStyle = '#8b5a2b';
            ctx.beginPath(); ctx.arc(0, 0, target.r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#5c4033'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(0, 0, target.r * 0.7, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, target.r * 0.4, 0, Math.PI*2); ctx.stroke();
        } 
        else if (target.type === 'melon') {
            ctx.shadowColor = '#00ff00';
            let grad = ctx.createRadialGradient(0,0,10, 0,0,target.r);
            grad.addColorStop(0, '#ff4b2b'); grad.addColorStop(0.8, '#ff416c'); grad.addColorStop(1, '#00b09b');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(0, 0, target.r, 0, Math.PI*2); ctx.fill();
            // Семечки
            ctx.fillStyle = '#000';
            for(let i=0; i<6; i++) {
                ctx.beginPath(); ctx.ellipse(Math.cos(i)*20, Math.sin(i)*20, 3, 6, i, 0, Math.PI*2); ctx.fill();
            }
        }
        else if (target.type === 'gear') {
            ctx.shadowColor = '#888'; ctx.fillStyle = '#444';
            ctx.beginPath();
            for (let i = 0; i < 12; i++) {
                let a = (Math.PI*2 / 12) * i;
                ctx.lineTo(Math.cos(a)*target.r, Math.sin(a)*target.r);
                ctx.lineTo(Math.cos(a+0.1)*(target.r+10), Math.sin(a+0.1)*(target.r+10));
                ctx.lineTo(Math.cos(a+0.4)*(target.r+10), Math.sin(a+0.4)*(target.r+10));
            }
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, 0, target.r*0.5, 0, Math.PI*2); ctx.fill();
        }
        else if (target.type === 'reactor') {
            ctx.shadowColor = '#0ff'; ctx.shadowBlur = 20;
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(0, 0, target.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#0ff';
            ctx.beginPath(); ctx.arc(0, 0, target.r*0.6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, 0, target.r*0.3, 0, Math.PI*2); ctx.fill();
        }

        // Рисуем воткнутые ножи
        let skin = SKINS.find(s => s.id === activeSkin);
        for (let a of target.stuckDaggers) {
            ctx.save();
            ctx.rotate(a);
            ctx.translate(0, target.r); // Сдвигаем на край мишени
            drawDagger(ctx, skin, true);
            ctx.restore();
        }
        ctx.restore();
    }

    function initLevel() {
        target.stuckDaggers = [];
        target.angle = 0;
        
        // Усложнение и смена боссов
        if (level % 20 === 0) target.type = 'reactor';
        else if (level % 10 === 0) target.type = 'gear';
        else if (level % 5 === 0) target.type = 'melon';
        else target.type = 'wood';

        // Скорость и количество ножей
        daggersToThrow = 5 + Math.floor(level / 3);
        if (daggersToThrow > 12) daggersToThrow = 12; // Максимум ножей
        daggersLeft = daggersToThrow;
        
        target.speed = 0.02 + (level * 0.002);
        
        activeDagger = null;
        updateDaggerUI();
        document.getElementById('levelText').innerText = 'УРОВЕНЬ ' + level;
    }

    function spawnDagger() {
        if (daggersLeft <= 0) return;
        activeDagger = {
            x: cw / 2, y: ch - 100, isFlying: false, speed: 25, spinAngle: 0
        };
    }

    function updateDaggerUI() {
        let container = document.getElementById('daggers-left');
        container.innerHTML = '';
        let skin = SKINS.find(s => s.id === activeSkin);
        for (let i = 0; i < daggersLeft; i++) {
            container.innerHTML += `<div style="width:10px; height:25px; background:${skin.c1}; border-radius:3px; box-shadow:0 0 5px ${skin.c2};"></div>`;
        }
    }

    function throwDagger() {
        if (activeDagger && !activeDagger.isFlying) {
            activeDagger.isFlying = true;
        }
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<30; i++) particles.push({x: x, y: y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, c: color});
    }
    
    function createFloatingText(txt, color) {
        let el = document.createElement('div');
        el.className = 'floating-text'; el.innerText = txt;
        el.style.left = (cw/2 - 40) + 'px'; el.style.top = (ch/2) + 'px';
        if(color) el.style.color = color; el.style.textShadow = `0 0 15px ${color}`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function loop() {
        requestAnimationFrame(loop);
        if (gameState !== 'playing') return;

        ctx.clearRect(0, 0, cw, ch);
        let skin = SKINS.find(s => s.id === activeSkin);

        // Хардкор: меняем направление мишени на высоких уровнях
        if (level > 3 && Math.random() < 0.01) target.speed *= -1;
        target.angle += target.speed;

        drawTarget();

        // Полет ножа и ИДЕАЛЬНАЯ МАТЕМАТИКА СТОЛКНОВЕНИЙ
        if (activeDagger) {
            if (activeDagger.isFlying) {
                activeDagger.y -= activeDagger.speed;
                if (skin.id === 'shuriken') activeDagger.spinAngle += 0.5;

                // Если нож достиг мишени
                if (activeDagger.y <= target.y + target.r) {
                    
                    // Вычисляем угол втыкания (относительно повернутой мишени)
                    // Нож летит снизу (Math.PI/2), мишень повернута на target.angle
                    let hitAngle = (Math.PI / 2 - target.angle) % (Math.PI * 2);
                    if (hitAngle < 0) hitAngle += Math.PI * 2;

                    // Проверяем столкновение с ДРУГИМИ ножами
                    let crashed = false;
                    const hitBoxRadius = 0.25; // Радианы (Ширина ножа)

                    for (let a of target.stuckDaggers) {
                        let diff = Math.abs(a - hitAngle);
                        // Нормализация разницы (чтобы 0 и 359 градусов считались рядом)
                        if (diff > Math.PI) diff = Math.PI * 2 - diff;
                        if (diff < hitBoxRadius) { crashed = true; break; }
                    }

                    if (crashed) {
                        createExplosion(activeDagger.x, activeDagger.y, '#f00');
                        activeDagger = null;
                        gameOver();
                        return;
                    } else {
                        // УСПЕШНОЕ ВТЫКАНИЕ
                        target.stuckDaggers.push(hitAngle);
                        createExplosion(activeDagger.x, activeDagger.y, '#fff');
                        
                        score++;
                        document.getElementById('score').innerText = score;
                        
                        daggersLeft--;
                        updateDaggerUI();
                        activeDagger = null;

                        // Если ножи кончились - УРОВЕНЬ ПРОЙДЕН
                        if (daggersLeft === 0) {
                            createExplosion(target.x, target.y, skin.c2);
                            let reward = (level % 5 === 0) ? 100 : 10; // Босс дает 100 монет!
                            sessionCoins += reward; localCoins += reward;
                            document.getElementById('coins').innerText = sessionCoins;
                            createFloatingText(`+${reward} 💰`, '#0f0');
                            
                            level++;
                            setTimeout(initLevel, 1000);
                        } else {
                            setTimeout(spawnDagger, 200);
                        }
                    }
                }
            }
            
            // Отрисовка летящего/ожидающего ножа
            if (activeDagger) {
                ctx.save();
                ctx.translate(activeDagger.x, activeDagger.y);
                if (skin.id === 'shuriken' && activeDagger.isFlying) ctx.rotate(activeDagger.spinAngle);
                drawDagger(ctx, skin, false);
                ctx.restore();
            }
        } else if (daggersLeft > 0 && target.stuckDaggers.length < daggersToThrow) {
            spawnDagger();
        }

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            ctx.globalAlpha = p.life > 0 ? p.life : 0;
            ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
    }

    // ==========================================
    // 4. УПРАВЛЕНИЕ И UI
    // ==========================================
    window.addEventListener('touchstart', e => {
        if(e.target.closest('.smart-menu-btn') || e.target.closest('.modal')) return;
        if(gameState === 'start') { initLevel(); gameState = 'playing'; spawnDagger(); return; }
        if(gameState === 'playing') throwDagger();
    });

    function gameOver() {
        gameState = 'gameover';
        localStorage.setItem('dagger_coins', localCoins);
        setTimeout(() => document.getElementById('gameOverScreen').classList.remove('hidden'), 500);
    }

    function resetGame() {
        document.getElementById('gameOverScreen').classList.add('hidden');
        score = 0; level = 1;
        document.getElementById('score').innerText = score;
        initLevel(); gameState = 'playing'; spawnDagger();
    }

    // МЕНЮ И МАГАЗИН
    document.getElementById('mainMenuBtn').onclick = () => {
        if(gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.remove('hidden');
    }
    function closeMenu() {
        document.getElementById('smartModal').classList.add('hidden');
        if(gameState === 'paused') gameState = 'playing';
    }
    
    function openShop() {
        document.getElementById('smartModal').classList.add('hidden');
        document.getElementById('shopModal').classList.remove('hidden');
        document.getElementById('shopCoins').innerText = localCoins;
        let list = document.getElementById('shopList'); list.innerHTML = '';
        
        SKINS.forEach(s => {
            let isUnl = unlocked.includes(s.id); let isAct = activeSkin === s.id;
            let btn = isAct ? `<button class="buy-btn btn-selected">ВЫБРАН</button>` :
                      isUnl ? `<button class="buy-btn btn-select" onclick="equipSkin('${s.id}')">НАДЕТЬ</button>` :
                      `<button class="buy-btn btn-buy" onclick="buySkin('${s.id}', ${s.price})">КУПИТЬ (${s.price})</button>`;
            list.innerHTML += `
                <div class="skin-card ${isAct ? 'active' : ''}">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:30px; height:30px; background:linear-gradient(${s.c1}, ${s.c2}); border-radius:5px; box-shadow:0 0 10px ${s.c2};"></div>
                        <div style="font-weight:bold;">${s.name}</div>
                    </div>
                    ${btn}
                </div>`;
        });
    }
    function closeShop() { document.getElementById('shopModal').classList.add('hidden'); document.getElementById('smartModal').classList.remove('hidden'); }
    
    window.buySkin = function(id, price) {
        if (localCoins >= price) { localCoins -= price; unlocked.push(id); equipSkin(id); saveData(); }
        else tg.showAlert('Нужно больше монет! Убивай боссов.');
    }
    window.equipSkin = function(id) { activeSkin = id; openShop(); saveData(); updateDaggerUI(); }
    
    function saveData() {
        localStorage.setItem('dagger_coins', localCoins);
        localStorage.setItem('dagger_unlocked', JSON.stringify(unlocked));
        localStorage.setItem('dagger_skin', activeSkin);
    }

    window.saveAndExit = function() {
        tg.sendData(JSON.stringify({
            game: "dagger", coins: sessionCoins, score: score,
            time_spent: Math.floor((Date.now() - startTime) / 1000), active_skin: activeSkin
        }));
    }

    // Запуск
    ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#0ff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
    ctx.fillText("ТАПНИ ЧТОБЫ МЕТАТЬ", cw/2, ch/2);
    requestAnimationFrame(loop);

</script>
</body>
</html>
