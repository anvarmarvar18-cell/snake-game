<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Hacker AAA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗА И ИДЕАЛЬНАЯ ЗАЩИТА */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Courier New', Courier, monospace; -webkit-tap-highlight-color: transparent; }
        body { background: #010400; overflow: hidden; touch-action: none; color: white; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; z-index: 10; }
        
        /* ГЛАССМОРФИЗМ UI (Стиль Терминала) */
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .hud-panel { background: rgba(0, 15, 0, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 0, 0.4); padding: 15px 25px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        .score-label { color: #0f0; font-size: 14px; letter-spacing: 2px; font-weight: bold; text-shadow: 0 0 5px #0f0; }
        .score-val { color: #fff; font-size: 36px; font-weight: 900; text-shadow: 0 0 15px #0f0; line-height: 1; margin: 5px 0; }
        .coins-val { color: #ffd700; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); display: flex; align-items: center; gap: 8px; }
        
        .smart-menu-btn { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(0, 15, 0, 0.8); backdrop-filter: blur(10px); color: #0f0; border: 1px solid rgba(0,255,0,0.5); border-radius: 10px; padding: 12px 20px; font-weight: 900; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3); transition: 0.2s; pointer-events: auto; }
        .smart-menu-btn:active { transform: scale(0.92); }

        /* ЭЛИТНЫЕ МОДАЛЬНЫЕ ОКНА */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 5, 0, 0.9); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content { background: radial-gradient(circle at top, #002200, #000); border: 2px solid #0f0; border-radius: 16px; width: 88%; max-width: 420px; padding: 30px; display: flex; flex-direction: column; gap: 15px; text-align: center; box-shadow: 0 0 50px rgba(0, 255, 0, 0.2); transform: scale(0.95); transition: 0.3s; }
        .modal.active .modal-content { transform: scale(1); }
        
        .modal-title { color: #0f0; text-transform: uppercase; letter-spacing: 4px; font-size: 26px; font-weight: 900; text-shadow: 0 0 10px #0f0; margin-bottom: 10px; }
        
        .btn { padding: 15px; font-size: 16px; font-weight: 900; border-radius: 10px; color: #000; border: none; text-transform: uppercase; cursor: pointer; transition: 0.2s; font-family: 'Courier New', Courier, monospace; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: #0f0; box-shadow: 0 0 15px #0f0; }
        .btn-blue { background: #0ff; box-shadow: 0 0 15px #0ff; }
        .btn-red { background: #f00; box-shadow: 0 0 15px #f00; color: white; }
        .btn-gold { background: #ffd700; box-shadow: 0 0 15px #ffd700; }

        /* МАГАЗИН (ДАРКНЕТ) */
        .shop-container { overflow-y: auto; max-height: 50vh; display: flex; flex-direction: column; gap: 12px; padding: 5px; border-radius: 10px; }
        .shop-container::-webkit-scrollbar { width: 4px; }
        .shop-container::-webkit-scrollbar-thumb { background: #0f0; border-radius: 5px; }
        
        .card { display: flex; justify-content: space-between; align-items: center; background: rgba(0,255,0,0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(0,255,0,0.2); transition: 0.2s; text-align: left; }
        .card.active { background: rgba(0, 255, 0, 0.15); border-color: #0f0; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .card-icon { font-size: 26px; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; background: #000; border: 1px solid #0f0; border-radius: 8px; color: #0f0; }
        
        .buy-btn { padding: 10px 15px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; font-family: 'Courier New'; }
        .btn-buy { background: #ffd700; color: #000; }
        .btn-select { background: #0f0; color: #000; }
        .btn-max { background: #333; color: #777; pointer-events: none; }

        /* Анимации текста и эффектов */
        .float-text { position: absolute; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; z-index: 500; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.5); } }

        .glitch { animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both; }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-5px, 5px) } 40% { transform: translate(-5px, -5px) } 60% { transform: translate(5px, 5px) } 80% { transform: translate(5px, -5px) } 100% { transform: translate(0) } }

        .flash { position: fixed; top:0; left:0; width:100%; height:100%; background: #0f0; z-index: 1500; pointer-events: none; opacity: 0; transition: 0.3s; mix-blend-mode: overlay; }
        .flash.active { opacity: 0.5; transition: 0s; }
        .flash.error { background: #f00; opacity: 0.5; transition: 0s; }
    </style>
</head>
<body>

    <div class="flash" id="flashScreen"></div>

    <div id="ui-layer">
        <div class="hud-panel">
            <div class="score-label">СЕРВЕРОВ ВЗЛОМАНО</div>
            <div class="score-val" id="score">0</div>
            <div class="coins-val">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffd700"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.64-2.25 1.64-1.74 0-2.24-1.06-2.28-1.92H7.9c.04 1.46 1.06 2.67 2.97 3.03V19h1.76v-1.67c1.76-.3 2.94-1.42 2.94-2.93 0-2.36-1.98-3.07-3.26-3.36z"/></svg>
                <span id="coins">0</span>
            </div>
            <div id="levelTxt" style="color: #fff; font-size: 14px; margin-top: 5px; opacity: 0.7;">УРОВЕНЬ БЕЗОПАСНОСТИ: 1</div>
        </div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">/ROOT</button>
    <canvas id="gameCanvas"></canvas>

    <!-- МЕНЮ ПАУЗЫ -->
    <div id="smartModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">ДАРКНЕТ</div>
            <button class="btn btn-gold" onclick="openShop('boosts')">💾 СОФТ (АПГРЕЙДЫ)</button>
            <button class="btn btn-blue" onclick="openShop('skins')">👁 ИНТЕРФЕЙС (СКИНЫ)</button>
            <button class="btn btn-red" onclick="saveAndExit()">🔌 ОТКЛЮЧИТЬСЯ</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ ВЗЛОМ</button>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="shopTitle">СОФТ</div>
            <div style="color: #ffd700; font-weight: 900; font-size: 18px; margin-bottom: 5px;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="shopList"></div>
            <button class="btn btn-green" onclick="closeShop()">НАЗАД</button>
        </div>
    </div>

    <!-- СМЕРТЬ -->
    <div id="gameOverScreen" class="modal">
        <div class="modal-content" style="background: rgba(20,0,0,0.95); border-color: #f00;">
            <h1 style="color: #f00; font-size: 40px; text-shadow: 0 0 30px #f00; font-weight: 900;">СИСТЕМА ЗАБЛОКИРОВАНА</h1>
            <p style="color: #aaa; font-size: 16px; margin-bottom: 20px;">Вас вычислили. Соединение сброшено.</p>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 12px;">🔄 ПОВТОРИТЬ ВЗЛОМ</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 СОХРАНИТЬ ДАННЫЕ</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', e => {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗЫ ДАННЫХ (СКИНЫ И СОФТ)
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'Matrix Green', price: 0, bg: '#010400', c1: '#00ff00', c2: '#004400', matrix: '#0f0', icon: '💻' },
        { id: 'neon', name: 'Cyber Neon', price: 1000, bg: '#050010', c1: '#00ffff', c2: '#ff00ff', matrix: '#0ff', icon: '🌐' },
        { id: 'firewall', name: 'Firewall', price: 1500, bg: '#1a0000', c1: '#ff0000', c2: '#ff8800', matrix: '#f00', icon: '🔥' },
        { id: 'gold', name: 'Billionaire', price: 2000, bg: '#0a0a00', c1: '#ffd700', c2: '#aa8800', matrix: '#ffd700', icon: '👑' },
        { id: 'quantum', name: 'Quantum CPU', price: 2500, bg: '#00001a', c1: '#aaaaff', c2: '#0000ff', matrix: '#00f', icon: '⚛' },
        { id: 'black_hole', name: 'Dark Web (+20%)', price: 5000, bg: '#000000', c1: '#800080', c2: '#440044', matrix: '#800080', icon: '🕷' }
    ];

    const UPGRADES = {
        decoder: { name: 'Дешифратор зон', desc: 'Расширяет зеленую зону взлома', icon: '🔓', baseCost: 1500, costMult: 1.5, maxLvl: 5, val: 0.1 }, // Увеличивает угол
        slowmo: { name: 'Замедлитель CPU', desc: 'Кольца крутятся чуть медленнее', icon: '⏱', baseCost: 2000, costMult: 1.6, maxLvl: 5, val: 0.05 } // Уменьшает скорость
    };

    // Используем dagger_keys для сохранения совместимости с ботом
    let localCoins = parseInt(localStorage.getItem('dagger_coins')) || 0; 
    let unlockedSkins = JSON.parse(localStorage.getItem('hacker_skins')) || ['default'];
    let activeSkin = localStorage.getItem('hacker_active_skin') || 'default';
    let levels = JSON.parse(localStorage.getItem('hacker_levels')) || { decoder: 1, slowmo: 1 };
    
    let sessionCoins = 0; let startTime = Date.now();

    // ==========================================
    // 3. АРХИТЕКТУРА ИГРЫ (HACK ENGINE)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = canvas.width = window.innerWidth;
    let ch = canvas.height = window.innerHeight;
    let cx = cw / 2; let cy = ch / 2;

    let gameState = 'start'; 
    let score = 0; // Взломанные сервера
    let currentLevel = 1; // Уровень сложности текущего сервера
    let frames = 0;

    // МАТРИЦА (Дождь из цифр на фоне)
    const columns = Math.floor(cw / 20);
    const drops = [];
    for(let x = 0; x < columns; x++) drops[x] = Math.random() * ch;

    let rings = [];
    let activeRingIndex = 0;
    let particles = [];

    function getStats() {
        return {
            zoneBonus: (levels.decoder - 1) * UPGRADES.decoder.val,
            speedSlow: (levels.slowmo - 1) * UPGRADES.slowmo.val
        };
    }

    // ГЕНЕРАЦИЯ СЕРВЕРА (ЗАМКА)
    function generateServer() {
        rings = [];
        activeRingIndex = 0;
        let numRings = Math.min(3 + Math.floor(currentLevel / 3), 7); // От 3 до 7 колец
        let baseRadius = Math.min(cw, ch) * 0.4;
        let ringThickness = baseRadius / (numRings + 1);

        let stats = getStats();

        for (let i = 0; i < numRings; i++) {
            // Чем ближе к центру (i больше), тем сложнее
            let speed = (0.02 + (currentLevel * 0.002) + (i * 0.005)) * (1 - stats.speedSlow);
            let dir = Math.random() > 0.5 ? 1 : -1;
            
            // Базовая ширина зоны (уменьшается к центру)
            let targetWidth = Math.max(0.2, (0.8 - i * 0.1)) + stats.zoneBonus;

            rings.push({
                radius: baseRadius - i * ringThickness,
                thickness: ringThickness * 0.8,
                angle: Math.random() * Math.PI * 2,
                speed: speed * dir,
                targetAngle: Math.random() * Math.PI * 2,
                targetWidth: targetWidth, // В радианах
                isLocked: false
            });
        }
    }

    function createParticles(x, y, color, count=20) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12,
                life: 1, color: color, size: Math.random()*3 + 1
            });
        }
    }

    function createFloatText(x, y, txt, color) {
        const el = document.createElement('div');
        el.className = 'float-text'; el.innerText = txt; el.style.color = color;
        el.style.textShadow = `0 0 10px ${color}`;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function initGame() {
        score = 0; sessionCoins = 0; currentLevel = 1;
        document.getElementById('score').innerText = score;
        document.getElementById('coins').innerText = sessionCoins;
        document.getElementById('levelTxt').innerText = `УРОВЕНЬ БЕЗОПАСНОСТИ: ${currentLevel}`;
        
        generateServer();
        particles = [];
        gameState = 'playing';
        updateColors();
    }

    function updateColors() {
        let s = SKINS.find(sk => sk.id === activeSkin);
        document.body.style.background = s.bg;
    }

    // --- ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ ---
    function loop() {
        requestAnimationFrame(loop);
        if (gameState !== 'playing' && gameState !== 'start') return;

        let skin = SKINS.find(s => s.id === activeSkin);

        // 1. ОТРИСОВКА МАТРИЦЫ (ФОН)
        ctx.fillStyle = `rgba(${hexToRgb(skin.bg)}, 0.2)`; // Полупрозрачный фон для шлейфа
        ctx.fillRect(0, 0, cw, ch);

        ctx.fillStyle = skin.matrix; ctx.font = "16px Courier";
        for (let i = 0; i < drops.length; i++) {
            let text = Math.random() > 0.5 ? "1" : "0";
            if(Math.random() > 0.95) text = String.fromCharCode(0x30A0 + Math.random() * 96); // Японские символы для стиля
            ctx.fillText(text, i * 20, drops[i] * 20);
            if (drops[i] * 20 > ch && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }

        // 2. ОТРИСОВКА ЗАМКА (СЕРВЕРА)
        if (gameState === 'playing') {
            for (let i = 0; i < rings.length; i++) {
                let r = rings[i];
                
                // Движение (только если не заблокировано)
                if (!r.isLocked && i === activeRingIndex) r.angle += r.speed;

                // Базовое кольцо (фон)
                ctx.beginPath(); ctx.arc(cx, cy, r.radius, 0, Math.PI*2);
                ctx.lineWidth = r.thickness;
                ctx.strokeStyle = `rgba(${hexToRgb(skin.c2)}, 0.3)`;
                ctx.stroke();

                // ЦЕЛЕВАЯ ЗОНА (Уязвимость)
                ctx.beginPath();
                ctx.arc(cx, cy, r.radius, r.targetAngle - r.targetWidth/2, r.targetAngle + r.targetWidth/2);
                ctx.strokeStyle = r.isLocked ? skin.c1 : 'rgba(255, 255, 255, 0.5)';
                if (i === activeRingIndex && !r.isLocked) {
                    ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
                }
                ctx.stroke(); ctx.shadowBlur = 0;

                // СКАНЕР (Указатель игрока)
                ctx.beginPath();
                // Делаем сканер как точку/короткую дугу
                ctx.arc(cx, cy, r.radius, r.angle - 0.05, r.angle + 0.05);
                ctx.strokeStyle = r.isLocked ? skin.c1 : skin.matrix;
                ctx.lineWidth = r.thickness * 1.2;
                if (i === activeRingIndex) {
                    ctx.shadowBlur = 15; ctx.shadowColor = skin.matrix;
                }
                ctx.stroke(); ctx.shadowBlur = 0;

                // Если кольцо пройдено, рисуем линии соединения
                if (r.isLocked && i < rings.length - 1 && rings[i+1].isLocked) {
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(r.targetAngle)*r.radius, cy + Math.sin(r.targetAngle)*r.radius);
                    ctx.lineTo(cx + Math.cos(rings[i+1].targetAngle)*rings[i+1].radius, cy + Math.sin(rings[i+1].targetAngle)*rings[i+1].radius);
                    ctx.strokeStyle = skin.c1; ctx.lineWidth = 2; ctx.stroke();
                }
            }
            
            // Центр сервера (Ядро)
            ctx.beginPath(); ctx.arc(cx, cy, rings[rings.length-1].radius - 20, 0, Math.PI*2);
            ctx.fillStyle = activeRingIndex >= rings.length ? skin.c1 : skin.c2;
            ctx.shadowBlur = 30; ctx.shadowColor = activeRingIndex >= rings.length ? skin.c1 : 'transparent';
            ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#000'; ctx.font = 'bold 20px Courier'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(activeRingIndex >= rings.length ? "ACCESS" : "LOCKED", cx, cy);
        } else if (gameState === 'start') {
            ctx.fillStyle = skin.matrix; ctx.font = 'bold 24px Courier'; ctx.textAlign = 'center';
            ctx.shadowBlur = 15; ctx.shadowColor = skin.matrix;
            ctx.fillText("> ТАПНИ ДЛЯ ВЗЛОМА <", cw/2, ch/2);
            ctx.shadowBlur = 0;
        }

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1;
        frames++;
    }

    function hexToRgb(hex) {
        let r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return r ? `${parseInt(r[1], 16)}, ${parseInt(r[2], 16)}, ${parseInt(r[3], 16)}` : '0,255,0';
    }

    // ==========================================
    // 4. МЕХАНИКА ВЗЛОМА (ТАП)
    // ==========================================
    window.addEventListener('touchstart', e => {
        if(e.target.closest('.smart-menu-btn') || e.target.closest('.modal')) return;
        if(gameState === 'start') { initGame(); return; }
        if(gameState !== 'playing') return;

        if (activeRingIndex < rings.length) {
            let r = rings[activeRingIndex];
            
            // Идеальная математика кратчайшего угла
            let normalizedAngle = ((r.angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
            let normalizedTarget = ((r.targetAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
            
            let diff = Math.abs(normalizedAngle - normalizedTarget);
            if (diff > Math.PI) diff = Math.PI * 2 - diff; // Кратчайшее расстояние по кругу
            
            let skin = SKINS.find(s => s.id === activeSkin);

            // ПРОВЕРКА ПОПАДАНИЯ
            if (diff <= r.targetWidth / 2) {
                // УСПЕХ
                r.isLocked = true;
                // Фиксируем сканер ровно по центру зоны для красоты
                r.angle = r.targetAngle; 
                
                let px = cx + Math.cos(r.targetAngle) * r.radius;
                let py = cy + Math.sin(r.targetAngle) * r.radius;
                createParticles(px, py, skin.c1, 15);
                
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                
                // Эффект вспышки
                let flash = document.getElementById('flashScreen');
                flash.style.background = skin.c1;
                flash.classList.add('active'); setTimeout(() => flash.classList.remove('active'), 50);

                activeRingIndex++;

                // СЕРВЕР ВЗЛОМАН ПОЛНОСТЬЮ!
                if (activeRingIndex >= rings.length) {
                    score++; currentLevel++;
                    let earnedCoins = 10 * currentLevel;
                    sessionCoins += earnedCoins; localCoins += earnedCoins;
                    
                    document.getElementById('score').innerText = score;
                    document.getElementById('coins').innerText = sessionCoins;
                    document.getElementById('levelTxt').innerText = `УРОВЕНЬ БЕЗОПАСНОСТИ: ${currentLevel}`;
                    
                    createParticles(cx, cy, skin.c1, 50);
                    createFloatText(cx, cy - 50, `ACCESS GRANTED +${earnedCoins}💰`, skin.c1);
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    
                    // Переход к следующему уровню через 1 сек
                    setTimeout(generateServer, 1000);
                }
            } else {
                // ОШИБКА (ПРОВАЛ)
                gameOver();
            }
        }
    });

    // ==========================================
    // 5. ОКОНЧАНИЕ И МЕНЮ
    // ==========================================
    function gameOver() {
        gameState = 'gameover';
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        
        document.body.classList.add('glitch');
        setTimeout(() => document.body.classList.remove('glitch'), 300);
        
        let flash = document.getElementById('flashScreen');
        flash.className = 'flash error active';
        setTimeout(() => flash.className = 'flash', 150);
        
        localStorage.setItem('dagger_coins', localCoins); 
        setTimeout(() => document.getElementById('gameOverScreen').classList.add('active'), 500);
    }

    function resetGame() {
        document.getElementById('gameOverScreen').classList.remove('active');
        initGame();
    }

    // МЕНЮ
    document.getElementById('mainMenuBtn').onclick = () => {
        if(gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.add('active');
    }
    function closeMenu() {
        document.getElementById('smartModal').classList.remove('active');
        if(gameState === 'paused') gameState = 'playing';
    }

    function openShop(type) {
        document.getElementById('smartModal').classList.remove('active');
        document.getElementById('shopModal').classList.add('active');
        document.getElementById('shopCoins').innerText = localCoins.toLocaleString();
        
        const list = document.getElementById('shopList'); list.innerHTML = '';
        
        if (type === 'skins') {
            document.getElementById('shopTitle').innerText = 'ИНТЕРФЕЙСЫ';
            SKINS.forEach(s => {
                let isUnl = unlockedSkins.includes(s.id); let isAct = activeSkin === s.id;
                let btn = isAct ? `<button class="buy-btn btn-max">АКТИВЕН</button>` :
                          isUnl ? `<button class="buy-btn btn-select" onclick="equipSkin('${s.id}')">ВЫБРАТЬ</button>` :
                          `<button class="buy-btn btn-buy" onclick="buySkin('${s.id}', ${s.price})">${s.price.toLocaleString()}💰</button>`;

                list.innerHTML += `
                    <div class="card ${isAct ? 'active' : ''}">
                        <div class="card-icon" style="color:${s.matrix}; border-color:${s.matrix};">${s.icon}</div>
                        <div style="flex-grow:1; margin-left:15px; font-weight:900; font-size:16px; color:${s.matrix};">${s.name}</div>
                        ${btn}
                    </div>`;
            });
        } else if (type === 'boosts') {
            document.getElementById('shopTitle').innerText = 'СОФТ ДЛЯ ВЗЛОМА';
            Object.keys(UPGRADES).forEach(key => {
                let u = UPGRADES[key]; let lvl = levels[key];
                let isMax = lvl >= u.maxLvl;
                let cost = Math.floor(u.baseCost * Math.pow(u.costMult, lvl));
                
                let btn = isMax ? `<button class="buy-btn btn-max">MAX LVL</button>` :
                                  `<button class="buy-btn btn-buy" onclick="buyUpgrade('${key}', ${cost})">${cost.toLocaleString()}💰</button>`;

                list.innerHTML += `
                    <div class="card">
                        <div class="card-icon">${u.icon}</div>
                        <div style="flex-grow:1; margin-left:15px;">
                            <div style="font-weight:900; font-size:16px; color:#0f0;">${u.name} <span style="color:#fff; font-size:12px;">Lvl ${lvl}</span></div>
                            <div style="font-size:12px; color:#aaa;">${u.desc}</div>
                        </div>
                        ${btn}
                    </div>`;
            });
        }
    }

    function closeShop() { document.getElementById('shopModal').classList.remove('active'); document.getElementById('smartModal').classList.add('active'); }

    window.buySkin = function(id, price) {
        if (localCoins >= price) { localCoins -= price; unlockedSkins.push(id); equipSkin(id); saveData(); }
        else tg.showAlert('Доступ запрещен: Недостаточно средств!');
    }
    window.equipSkin = function(id) { activeSkin = id; openShop('skins'); saveData(); updateColors(); }

    window.buyUpgrade = function(key, cost) {
        if (localCoins >= cost) {
            localCoins -= cost; levels[key]++; openShop('boosts'); saveData();
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else {
            tg.showAlert('Доступ запрещен: Недостаточно средств!');
        }
    }

    function saveData() {
        localStorage.setItem('dagger_coins', localCoins); // Старый ключ
        localStorage.setItem('hacker_skins', JSON.stringify(unlockedSkins));
        localStorage.setItem('hacker_active_skin', activeSkin);
        localStorage.setItem('hacker_levels', JSON.stringify(levels));
    }

    window.saveAndExit = function() {
        saveData();
        tg.sendData(JSON.stringify({ game: "dagger", coins: sessionCoins, score: score, time_spent: Math.floor((Date.now() - startTime) / 1000), active_skin: activeSkin }));
    }

    // СТАРТ
    updateColors();
    requestAnimationFrame(loop);

</script>
</body>
</html>
