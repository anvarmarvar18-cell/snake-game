<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Orbit 5.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗА И ЗАЩИТА */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #000; overflow: hidden; touch-action: none; color: white; height: 100vh; transition: background 2s; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* ИНТЕРФЕЙС ИГРЫ */
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 100; text-shadow: 0 0 10px #0ff; font-weight: bold; pointer-events: none; }
        .score-text { color: #fff; font-size: 24px; margin-bottom: 5px; }
        .coins-text { color: #ffd700; font-size: 22px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .stage-text { color: #ff00ff; font-size: 16px; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; }
        
        .smart-menu-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: rgba(0, 0, 0, 0.7); color: #0ff; border: 2px solid #0ff; border-radius: 8px; padding: 10px 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #0ff; }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        .modal-content { background: linear-gradient(135deg, #111, #1a1a2e); border: 2px solid #0ff; border-radius: 15px; width: 85%; max-height: 85vh; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); }
        
        .btn { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; color: white; border: none; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .btn-blue { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .btn-red { background: linear-gradient(45deg, #ff416c, #ff4b2b); }

        /* МАГАЗИН (С ИДЕАЛЬНЫМ СКРОЛЛОМ) */
        .shop-container { overflow-y: auto; max-height: 50vh; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding: 5px; }
        .skin-card { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .skin-card.active { border-color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .buy-btn { padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; }
        .btn-buy { background: #ffd700; color: #000; }
        .btn-select { background: #0ff; color: #000; }
        .btn-selected { background: #444; color: #888; }
        
        .floating-text { position: absolute; font-size: 24px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px #ff0; pointer-events: none; animation: floatUp 1s ease-out forwards; z-index: 500; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="score-text">Орбита: <span id="score">0</span></div>
        <div class="coins-text"><span id="coins">0</span> 💰</div>
        <div class="stage-text" id="stageText">СЕКТОР: ЗЕМЛЯ</div>
    </div>
    
    <button id="mainMenuBtn" class="smart-menu-btn">⚙️ МЕНЮ</button>
    <canvas id="gameCanvas"></canvas>

    <!-- Главное Меню -->
    <div id="smartModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: white;">ПАУЗА</h2>
            <button class="btn btn-blue" onclick="openShop()">🚀 СКИНЫ (ЯДРА)</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ВЫХОД В БОТА</button>
            <button class="btn btn-green" onclick="closeMenu()">▶ ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- Ангар -->
    <div id="shopModal" class="modal hidden">
        <div class="modal-content">
            <h2 style="color: #0ff;">МАГАЗИН ЯДЕР</h2>
            <div style="color: #ffd700;">Баланс: <span id="shopCoins">0</span> 💰</div>
            <div class="shop-container" id="shopList"></div>
            <button class="btn btn-green" onclick="closeShop()">НАЗАД</button>
        </div>
    </div>

    <!-- Смерть -->
    <div id="gameOverScreen" class="modal hidden">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;">
            <h1 style="color: #ff416c; font-size: 45px; text-shadow: 0 0 20px red; margin-bottom: 20px;">СГОРЕЛ!</h1>
            <button class="btn btn-blue" onclick="resetGame()" style="margin-bottom: 15px;">🔄 НОВЫЙ СТАРТ</button>
            <button class="btn btn-red" onclick="saveAndExit()">💾 ЗАБРАТЬ МОНЕТЫ</button>
        </div>
    </div>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ И БЛОКИРОВКА СВАЙПОВ
    // ==========================================
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast('6.1')) tg.enableClosingConfirmation();

    document.body.addEventListener('touchmove', e => {
        if (!e.target.closest('.shop-container')) e.preventDefault();
    }, { passive: false });

    // ==========================================
    // 2. БАЗА СКИНОВ (10 шт, с хвостами и свечением)
    // ==========================================
    const SKINS = [
        { id: 'default', name: 'Cyber Core', price: 0, c1: '#00ffff', c2: '#0055ff' },
        { id: 'proton', name: 'Proton', price: 1000, c1: '#ff416c', c2: '#ff4b2b' },
        { id: 'electron', name: 'Electron', price: 1500, c1: '#e0c3fc', c2: '#8ec5fc' },
        { id: 'photon', name: 'Photon', price: 2000, c1: '#f6d365', c2: '#fda085' },
        { id: 'toxic', name: 'Toxic Isotope', price: 2500, c1: '#00b09b', c2: '#96c93d' },
        { id: 'magma', name: 'Magma Sphere', price: 3000, c1: '#cb2d3e', c2: '#ef473a' },
        { id: 'ice', name: 'Ice Comet', price: 3000, c1: '#89f7fe', c2: '#66a6ff' },
        { id: 'gold', name: 'Golden Orb', price: 3000, c1: '#fceabb', c2: '#f8b500' },
        { id: 'plasma', name: 'Plasma Ball', price: 3000, c1: '#f857a6', c2: '#ff5858' },
        { id: 'black_hole', name: 'Black Hole (+20%)', price: 3000, c1: '#000000', c2: '#800080', dark: true }
    ];

    let localCoins = parseInt(localStorage.getItem('orbit_coins')) || 0;
    let unlocked = JSON.parse(localStorage.getItem('orbit_unlocked')) || ['default'];
    let activeSkin = localStorage.getItem('orbit_skin') || 'default';
    
    let sessionCoins = 0;
    let startTime = Date.now();

    // ==========================================
    // 3. ДВИЖОК ИГРЫ И ИДЕАЛЬНАЯ МАТЕМАТИКА
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = canvas.width = window.innerWidth;
    let ch = canvas.height = window.innerHeight;

    let gameState = 'start'; 
    let score = 0;
    
    // Эффекты
    let particles = [];
    let trail = [];

    // Динамика сложности
    let gapSize = Math.PI / 1.5; // Начальный размер дыры (120 градусов)
    let minGap = Math.PI / 4;    // Минимальный размер (45 градусов) - Гарантия проходимости!
    let shieldSpeed = 0.02;

    // Игрок
    const player = {
        x: 0, y: 0, r: 10,
        orbiting: true, currentCore: null, nextCore: null,
        angle: 0, angularSpeed: 0.05, clockwise: 1,
        vx: 0, vy: 0, flySpeed: 18,
        
        draw() {
            let s = SKINS.find(sk => sk.id === activeSkin);
            
            // Рисуем хвост (Trail)
            if (trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
                ctx.strokeStyle = s.c1; ctx.lineWidth = this.r; ctx.lineCap = 'round';
                ctx.shadowBlur = 15; ctx.shadowColor = s.c1;
                ctx.globalAlpha = 0.4; ctx.stroke(); ctx.globalAlpha = 1;
            }

            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            let grad = ctx.createRadialGradient(this.x - 3, this.y - 3, 2, this.x, this.y, this.r);
            grad.addColorStop(0, s.c1); grad.addColorStop(1, s.c2);
            ctx.fillStyle = grad;
            ctx.shadowBlur = 20; ctx.shadowColor = s.c2;
            if(s.dark) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 5; } // Для Черной дыры
            ctx.fill();
        },
        update() {
            // Сохраняем позицию для хвоста
            trail.push({x: this.x, y: this.y});
            if (trail.length > 15) trail.shift();

            if (this.orbiting) {
                this.angle += this.angularSpeed * this.clockwise;
                // Вращение вокруг текущего ядра
                this.x = this.currentCore.x + this.currentCore.orbitR * Math.cos(this.angle);
                this.y = this.currentCore.y + this.currentCore.orbitR * Math.sin(this.angle);
            } else {
                // Полет по прямой
                this.x += this.vx; this.y += this.vy;
                
                // Проверка выхода за экран
                if (this.x < -50 || this.x > cw + 50 || this.y > ch + 50 || this.y < -500) {
                    gameOver();
                }

                // ИДЕАЛЬНАЯ МАТЕМАТИКА СТОЛКНОВЕНИЙ
                if (this.nextCore) {
                    let dx = this.nextCore.x - this.x;
                    let dy = this.nextCore.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    // 1. Проверка столкновения со щитом (Красным кольцом)
                    for (let shield of this.nextCore.shields) {
                        // Если мы пересекаем линию щита
                        if (Math.abs(dist - shield.radius) < this.r + shield.thickness/2) {
                            // Вычисляем наш угол относительно ядра
                            let pAngle = Math.atan2(-dy, -dx);
                            if (pAngle < 0) pAngle += Math.PI * 2;
                            
                            // Нормализуем угол щита и дыры
                            let sStart = shield.angle % (Math.PI*2);
                            if (sStart < 0) sStart += Math.PI*2;
                            let sEnd = (sStart + shield.gap) % (Math.PI*2);
                            
                            // Проверяем, попали ли мы в ДЫРУ (Безопасную зону)
                            let inGap = false;
                            if (sStart < sEnd) {
                                if (pAngle >= sStart && pAngle <= sEnd) inGap = true;
                            } else {
                                // Если дыра пересекает нулевой меридиан
                                if (pAngle >= sStart || pAngle <= sEnd) inGap = true;
                            }
                            
                            if (!inGap) gameOver(); // Врезались в стену щита!
                        }
                    }

                    // 2. Успешный захват новым ядром
                    if (dist <= this.nextCore.orbitR + 5) {
                        this.orbiting = true;
                        this.currentCore = this.nextCore;
                        // Вычисляем угол, под которым мы прилетели
                        this.angle = Math.atan2(-dy, -dx);
                        // Меняем направление вращения случайным образом
                        this.clockwise = Math.random() > 0.5 ? 1 : -1;
                        this.angularSpeed = this.currentCore.speed;
                        
                        score++;
                        let earned = 5 + Math.floor(score / 5); // Экономика растет
                        sessionCoins += earned; localCoins += earned;
                        document.getElementById('score').innerText = score;
                        document.getElementById('coins').innerText = sessionCoins;
                        
                        createFloatingText(this.x, this.y, `+${earned}`);
                        createExplosion(this.x, this.y, '#0ff');
                        
                        generateNextCore();
                        updateBackground();
                    }
                }
            }
        },
        jump() {
            if (!this.orbiting) return;
            this.orbiting = false;
            // Идеальная физика: Тангенциальный отрыв (под 90 градусов к радиусу)
            let dir = this.clockwise;
            this.vx = this.flySpeed * Math.cos(this.angle + dir * Math.PI/2);
            this.vy = this.flySpeed * Math.sin(this.angle + dir * Math.PI/2);
        }
    };

    // Класс Ядра
    class Core {
        constructor(y, isStart = false) {
            this.x = cw / 2;
            this.y = y;
            this.r = 20; // Само ядро
            this.orbitR = 70; // Радиус орбиты игрока
            this.speed = 0.04 + Math.min(score * 0.002, 0.06); // Ускорение со временем
            this.shields = [];
            this.moveDir = Math.random() > 0.5 ? 1 : -1;
            this.isMoving = score > 15 && Math.random() > 0.5;

            // Генерация препятствий (Математика проходимости)
            if (!isStart) {
                // Первый щит
                this.shields.push({
                    radius: this.orbitR + 40,
                    thickness: 10,
                    angle: Math.random() * Math.PI * 2,
                    speed: shieldSpeed * (Math.random() > 0.5 ? 1 : -1),
                    gap: gapSize
                });

                // Второй щит (на хардкорных уровнях)
                if (score > 10) {
                    this.shields.push({
                        radius: this.orbitR + 70,
                        thickness: 10,
                        angle: Math.random() * Math.PI * 2,
                        speed: shieldSpeed * 1.5 * (Math.random() > 0.5 ? 1 : -1),
                        gap: Math.max(gapSize * 0.8, minGap) // Второе кольцо чуть строже, но в рамках минимума
                    });
                }
            }
        }
        draw() {
            // Рисуем само ядро
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 20; ctx.shadowColor = '#fff'; ctx.fill();
            
            // Линия орбиты
            ctx.beginPath(); ctx.arc(this.x, this.y, this.orbitR, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
            ctx.shadowBlur = 0; ctx.stroke();

            // Рисуем Щиты (Красные, смертельные)
            for (let s of this.shields) {
                ctx.beginPath();
                // Рисуем арку от конца дыры до начала дыры (то есть саму стену)
                ctx.arc(this.x, this.y, s.radius, s.angle + s.gap, s.angle + Math.PI*2);
                ctx.strokeStyle = '#ff003c'; ctx.lineWidth = s.thickness;
                ctx.lineCap = 'round'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff003c';
                ctx.stroke();
            }
        }
        update() {
            // Вращение щитов
            for (let s of this.shields) s.angle += s.speed;
            
            // Движение ядра (влево-вправо)
            if (this.isMoving) {
                this.x += this.moveDir * 1.5;
                if (this.x > cw - 80) this.moveDir = -1;
                if (this.x < 80) this.moveDir = 1;
            }
        }
    }

    let cores = [];
    let cameraY = 0;

    function initGame() {
        score = 0; sessionCoins = 0; gapSize = Math.PI / 1.5; shieldSpeed = 0.02;
        document.getElementById('score').innerText = score;
        document.getElementById('coins').innerText = sessionCoins;
        
        let startCore = new Core(ch - 150, true);
        cores = [startCore];
        
        player.currentCore = startCore;
        player.nextCore = null;
        player.orbiting = true;
        player.angle = -Math.PI/2;
        
        generateNextCore();
        updateBackground();
        gameState = 'playing';
    }

    function generateNextCore() {
        let dist = 250 + Math.min(score * 2, 100); // Расстояние растет
        let newCore = new Core(player.currentCore.y - dist);
        cores.push(newCore);
        player.nextCore = newCore;
        
        // Усложнение математики
        if (gapSize > minGap) gapSize -= 0.05;
        if (shieldSpeed < 0.08) shieldSpeed += 0.002;
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, c: color });
    }
    
    function createFloatingText(x, y, txt) {
        let el = document.createElement('div');
        el.className = 'floating-text'; el.innerText = txt;
        el.style.left = (x - 20) + 'px'; el.style.top = (y - 30) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function updateBackground() {
        const bgColors = ['#000814', '#1a0500', '#1a1300', '#0a001a']; // Земля, Марс, Юпитер, Космос
        const names = ['СЕКТОР: ЗЕМЛЯ', 'СЕКТОР: МАРС', 'СЕКТОР: ЮПИТЕР', 'ГЛУБОКИЙ КОСМОС'];
        let stage = Math.min(Math.floor(score / 10), 3);
        document.body.style.background = bgColors[stage];
        document.getElementById('stageText').innerText = names[stage];
    }

    function loop() {
        requestAnimationFrame(loop);
        if (gameState !== 'playing') return;

        ctx.clearRect(0, 0, cw, ch);

        // Плавная камера (следит за текущим ядром)
        let targetCamY = ch - 200 - player.currentCore.y;
        cameraY += (targetCamY - cameraY) * 0.1;

        ctx.save();
        ctx.translate(0, cameraY);

        // Обновляем и рисуем ядра
        for (let i = cores.length - 1; i >= 0; i--) {
            cores[i].update(); cores[i].draw();
            // Удаляем старые ядра, которые ушли вниз
            if (cores[i].y > player.currentCore.y + 500) cores.splice(i, 1);
        }

        player.update();
        player.draw();

        // Частицы
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            ctx.globalAlpha = p.life > 0 ? p.life : 0;
            ctx.fillStyle = p.c; ctx.shadowBlur = 10; ctx.shadowColor = p.c;
            ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }

        ctx.restore();
    }

    // ==========================================
    // 4. УПРАВЛЕНИЕ И UI
    // ==========================================
    window.addEventListener('touchstart', e => {
        if(e.target.closest('.smart-menu-btn') || e.target.closest('.modal')) return;
        if(gameState === 'start') { initGame(); return; }
        if(gameState === 'playing' && player.orbiting) player.jump();
    });

    function gameOver() {
        gameState = 'gameover';
        createExplosion(player.x, player.y, '#ff0000');
        localStorage.setItem('orbit_coins', localCoins);
        setTimeout(() => document.getElementById('gameOverScreen').classList.remove('hidden'), 500);
    }

    function resetGame() {
        document.getElementById('gameOverScreen').classList.add('hidden');
        initGame();
    }

    // МЕНЮ И МАГАЗИН
    document.getElementById('mainMenuBtn').onclick = () => {
        if(gameState === 'playing') gameState = 'paused';
        document.getElementById('smartModal').classList.remove('hidden');
    }
    function closeMenu() {
        document.getElementById('smartModal').classList.add('hidden');
        if(gameState === 'paused') gameState = 'playing';
    }
    
    function openShop() {
        document.getElementById('smartModal').classList.add('hidden');
        document.getElementById('shopModal').classList.remove('hidden');
        document.getElementById('shopCoins').innerText = localCoins;
        let list = document.getElementById('shopList'); list.innerHTML = '';
        
        SKINS.forEach(s => {
            let isUnl = unlocked.includes(s.id); let isAct = activeSkin === s.id;
            let btn = isAct ? `<button class="buy-btn btn-selected">ВЫБРАН</button>` :
                      isUnl ? `<button class="buy-btn btn-select" onclick="equipSkin('${s.id}')">НАДЕТЬ</button>` :
                      `<button class="buy-btn btn-buy" onclick="buySkin('${s.id}', ${s.price})">КУПИТЬ (${s.price})</button>`;
            list.innerHTML += `
                <div class="skin-card ${isAct ? 'active' : ''}">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:30px; height:30px; background:radial-gradient(${s.c1}, ${s.c2}); border-radius:50%; box-shadow:0 0 10px ${s.c2};"></div>
                        <div style="font-weight:bold;">${s.name}</div>
                    </div>
                    ${btn}
                </div>`;
        });
    }
    function closeShop() { document.getElementById('shopModal').classList.add('hidden'); document.getElementById('smartModal').classList.remove('hidden'); }
    
    window.buySkin = function(id, price) {
        if (localCoins >= price) { localCoins -= price; unlocked.push(id); equipSkin(id); saveData(); }
        else tg.showAlert('Мало монет, играй дальше!');
    }
    window.equipSkin = function(id) { activeSkin = id; openShop(); saveData(); }
    
    function saveData() {
        localStorage.setItem('orbit_coins', localCoins);
        localStorage.setItem('orbit_unlocked', JSON.stringify(unlocked));
        localStorage.setItem('orbit_skin', activeSkin);
    }

    window.saveAndExit = function() {
        tg.sendData(JSON.stringify({
            game: "orbit", coins: sessionCoins, score: score,
            time_spent: Math.floor((Date.now() - startTime) / 1000), active_skin: activeSkin
        }));
    }

    // Запуск стартового экрана
    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
    ctx.fillText("ТАПНИ ДЛЯ ЗАПУСКА ОРБИТЫ", cw/2, ch/2);
    requestAnimationFrame(loop);

</script>
</body>
</html>
