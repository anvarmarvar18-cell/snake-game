<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower: Skyscraper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; font-family: 'Arial', sans-serif; }
        body { background-color: #000; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
        .score-box { font-size: 35px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ffcc; display: flex; flex-direction: column; }
        .combo-text { font-size: 16px; color: #ffaa00; text-shadow: 0 0 10px #ffaa00; opacity: 0; transition: opacity 0.3s; }
        .balance-box { font-size: 24px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 15px; }

        .controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10; padding: 0 20px; }
        .btn { padding: 15px 30px; border: none; border-radius: 20px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .btn-shop { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .btn-exit { background: #333; }

        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        h1 { color: #ff3333; font-size: 45px; margin-bottom: 10px; text-shadow: 0 0 20px #ff0000; text-transform: uppercase; }
        
        /* Магазин */
        .skins-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 400px; overflow-y: auto; max-height: 65vh; padding-bottom: 20px; margin-top: 10px; }
        .skin-card { background: rgba(20,20,30,0.9); border: 2px solid #444; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .skin-card.active { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.4); }
    </style>
</head>
<body>

    <div class="hud">
        <div class="score-box">
            <span id="scoreVal">0</span>
            <span id="comboVal" class="combo-text">PERFECT +10💰</span>
        </div>
        <div class="balance-box" id="balanceVal">0 💰</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <button class="btn btn-shop" onclick="openShop()">🏢 Скины</button>
        <button class="btn btn-exit" onclick="saveAndExit()">💾 Выход</button>
    </div>

    <!-- Экран смерти -->
    <div class="overlay" id="gameOverScreen">
        <h1>БАШНЯ РУХНУЛА</h1>
        <p style="font-size: 20px; color: #ccc; margin-bottom: 10px;">Высота: <span id="finalScore" style="color:#fff; font-weight:bold;">0</span> этажей</p>
        <p style="font-size: 24px; color: #ffd700; margin-bottom: 30px;">Заработано: +<span id="earnedCoins">0</span> 💰</p>
        <button class="btn" style="background: linear-gradient(45deg, #ff8800, #ff0055); width: 250px; margin-bottom: 15px;" onclick="restartGame()">СТРОИТЬ ЗАНОВО</button>
        <button class="btn btn-exit" style="width: 250px;" onclick="saveAndExit()">В МЕНЮ</button>
    </div>

    <!-- Магазин -->
    <div class="overlay" id="shopModal">
        <div style="width:100%; max-width:400px; display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:white; font-size: 26px;">Стройматериалы</h2>
            <button style="background:none; border:none; color:#ff3333; font-size:40px; cursor:pointer;" onclick="closeShop()">&times;</button>
        </div>
        <div class="skins-grid" id="skinsGrid"></div>
    </div>

    <script>
        let tg; try { tg = window.Telegram.WebApp; tg.expand(); } catch(e) {}

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let balance = 1500;
        let inventory = ['neon'];
        let activeSkinId = 'neon';

        // --- 10 ПРОЦЕДУРНЫХ СКИНОВ (Математическая отрисовка 3D-эффекта) ---
        const skins = [
            { id: 'neon', name: 'Кибер-Неон', render: (x, y, w, h) => {
                ctx.fillStyle = '#051122'; ctx.fillRect(x,y,w,h);
                ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 3; ctx.strokeRect(x,y,w,h);
                ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc'; ctx.fillStyle = '#00ffcc'; ctx.fillRect(x+w/2-10, y+h/2-2, 20, 4); ctx.shadowBlur = 0;
            }},
            { id: 'gold', name: 'Золото', render: (x, y, w, h) => {
                let g = ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,'#ffea00'); g.addColorStop(0.5,'#cc9900'); g.addColorStop(1,'#664400');
                ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
                ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x+2,y+2,w-4,4); // Блик
            }},
            { id: 'marble', name: 'Мрамор', render: (x, y, w, h) => {
                ctx.fillStyle = '#eeeeee'; ctx.fillRect(x,y,w,h);
                ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 2; ctx.strokeRect(x,y,w,h);
                ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x+10, y); ctx.lineTo(x+30, y+h); ctx.moveTo(x+w-20, y); ctx.lineTo(x+w-5, y+h); ctx.stroke();
            }},
            { id: 'lava', name: 'Лава', render: (x, y, w, h) => {
                ctx.fillStyle = '#222222'; ctx.fillRect(x,y,w,h);
                ctx.shadowBlur = 10; ctx.shadowColor = '#ff3300'; ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(x, y+h/2); ctx.lineTo(x+w/3, y+h/3); ctx.lineTo(x+w/1.5, y+h/1.5); ctx.lineTo(x+w, y+h/3); ctx.stroke(); ctx.shadowBlur = 0;
            }},
            { id: 'wood', name: 'Дерево', render: (x, y, w, h) => {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(x,y,w,h);
                ctx.strokeStyle = '#5c2e0b'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x, y+h*0.3); ctx.lineTo(x+w, y+h*0.3); ctx.moveTo(x, y+h*0.7); ctx.lineTo(x+w, y+h*0.7); ctx.stroke();
            }},
            { id: 'steel', name: 'Сталь', render: (x, y, w, h) => {
                let g = ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,'#999'); g.addColorStop(0.5,'#ccc'); g.addColorStop(1,'#666');
                ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
                ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(x+10, y+10, 3, 0, Math.PI*2); ctx.arc(x+w-10, y+10, 3, 0, Math.PI*2); ctx.fill();
            }},
            { id: 'ice', name: 'Лед', render: (x, y, w, h) => {
                ctx.fillStyle = 'rgba(100, 200, 255, 0.6)'; ctx.fillRect(x,y,w,h);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(x+2,y+2,w-4,h-4);
            }},
            { id: 'ruby', name: 'Рубин', render: (x, y, w, h) => {
                let g = ctx.createLinearGradient(x,y,x+w,y+h); g.addColorStop(0,'#ff0055'); g.addColorStop(1,'#660022');
                ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
                ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w/2,y+h/2); ctx.lineTo(x+w,y); ctx.fill();
            }},
            { id: 'toxic', name: 'Токсик', render: (x, y, w, h) => {
                ctx.fillStyle = '#333'; ctx.fillRect(x,y,w,h);
                ctx.fillStyle = '#ccff00';
                for(let i=0; i<w; i+=20) { ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i+10,y); ctx.lineTo(x+i-5,y+h); ctx.lineTo(x+i-15,y+h); ctx.fill(); }
            }},
            { id: 'magnet', name: 'Магнит', render: (x, y, w, h) => {
                ctx.fillStyle = '#cc0000'; ctx.fillRect(x,y,w/2,h);
                ctx.fillStyle = '#0000cc'; ctx.fillRect(x+w/2,y,w/2,h);
                ctx.fillStyle = '#fff'; ctx.fillRect(x+w/2-2, y, 4, h);
            }}
        ];

        // Игровые переменные
        let score = 0;
        let earnedCoins = 0;
        let gameOver = false;
        
        let blocks = [];
        let debris = [];
        let currentBlock = null;
        let cameraY = 0;
        let cameraTargetY = 0;

        let blockHeight = 40;
        let initialWidth = canvas.width * 0.7;
        let currentSpeed = 4;

        // --- 10 ФОНОВ (Рендеринг в реальном времени) ---
        function drawBackground() {
            let stage = Math.floor(score / 10);
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            
            if (stage === 0) { grad.addColorStop(0,'#001133'); grad.addColorStop(1,'#000000'); } // Город
            else if (stage === 1) { grad.addColorStop(0,'#ff5500'); grad.addColorStop(1,'#440055'); } // Закат
            else if (stage === 2) { grad.addColorStop(0,'#00aaff'); grad.addColorStop(1,'#ffffff'); } // Облака
            else if (stage === 3) { grad.addColorStop(0,'#000055'); grad.addColorStop(1,'#0055ff'); } // Стратосфера
            else if (stage === 4) { grad.addColorStop(0,'#000000'); grad.addColorStop(1,'#002288'); } // Орбита
            else if (stage === 5) { grad.addColorStop(0,'#000000'); grad.addColorStop(1,'#111111'); } // Космос
            else if (stage === 6) { grad.addColorStop(0,'#220044'); grad.addColorStop(1,'#000000'); } // Туманность
            else if (stage === 7) { grad.addColorStop(0,'#330000'); grad.addColorStop(1,'#000000'); } // Красная галактика
            else if (stage === 8) { grad.addColorStop(0,'#002200'); grad.addColorStop(1,'#000000'); } // Матрица
            else { grad.addColorStop(0,'#ffffff'); grad.addColorStop(1,'#000000'); } // Гиперпрыжок

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Спецэффекты фона (Звезды/Облака)
            if (stage >= 4) {
                ctx.fillStyle = '#fff';
                for(let i=0; i<30; i++) {
                    ctx.beginPath(); ctx.arc((Math.sin(i*7)*canvas.width/2)+canvas.width/2, (Math.cos(i*13)*canvas.height/2)+canvas.height/2, Math.random()*2, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        function initGame() {
            score = 0; earnedCoins = 0; gameOver = false;
            blocks = []; debris = []; currentSpeed = 4;
            cameraY = 0; cameraTargetY = 0;

            // Стартовый фундамент
            blocks.push({ x: canvas.width/2 - initialWidth/2, y: canvas.height - blockHeight - 20, w: initialWidth, h: blockHeight });
            
            spawnBlock();
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('gameOverScreen').style.display = 'none';
            updateUI();
            gameLoop();
        }

        function spawnBlock() {
            let lastBlock = blocks[blocks.length - 1];
            currentBlock = {
                x: 0,
                y: lastBlock.y - blockHeight,
                w: lastBlock.w,
                h: blockHeight,
                speed: currentSpeed * (Math.random() > 0.5 ? 1 : -1)
            };
            if (currentBlock.speed < 0) currentBlock.x = canvas.width - currentBlock.w;
        }

        // --- ГЛАВНАЯ ЛОГИКА И ФИЗИКА ---
        function gameLoop() {
            if (gameOver) return;
            drawBackground();

            // Плавная камера
            cameraY += (cameraTargetY - cameraY) * 0.1;

            let skinDef = skins.find(s => s.id === activeSkinId);

            // Отрисовка построенной башни
            blocks.forEach(b => { skinDef.render(b.x, b.y + cameraY, b.w, b.h); });

            // Отрисовка обломков (Физика падения)
            for (let i = debris.length - 1; i >= 0; i--) {
                let d = debris[i];
                d.vy += 0.5; // Гравитация
                d.y += d.vy; d.x += d.vx; d.angle += d.va;
                
                ctx.save();
                ctx.translate(d.x + d.w/2, d.y + cameraY + d.h/2);
                ctx.rotate(d.angle);
                skinDef.render(-d.w/2, -d.h/2, d.w, d.h);
                ctx.restore();

                if (d.y > canvas.height) debris.splice(i, 1);
            }

            // Движение текущего блока
            if (currentBlock) {
                currentBlock.x += currentBlock.speed;
                if (currentBlock.x <= 0 || currentBlock.x + currentBlock.w >= canvas.width) {
                    currentBlock.speed *= -1; // Отскок от стен
                }
                skinDef.render(currentBlock.x, currentBlock.y + cameraY, currentBlock.w, currentBlock.h);
            }

            requestAnimationFrame(gameLoop);
        }

        // --- ЛОГИКА УСТАНОВКИ БЛОКА ---
        function placeBlock() {
            if (gameOver || !currentBlock) return;

            let lastBlock = blocks[blocks.length - 1];
            let diff = currentBlock.x - lastBlock.x;
            let absDiff = Math.abs(diff);

            // ИДЕАЛЬНАЯ УСТАНОВКА (PERFECT COMBO)
            if (absDiff < 10) { 
                currentBlock.x = lastBlock.x; // Выравниваем идеально
                currentBlock.w = lastBlock.w;
                
                // Бонус и эффект
                let comboEl = document.getElementById('comboVal');
                comboEl.style.opacity = '1';
                setTimeout(() => { comboEl.style.opacity = '0'; }, 1000);
                
                balance += 10; earnedCoins += 10; // Бонус за идеальность
            } 
            // ЧАСТИЧНАЯ УСТАНОВКА (Отрезание куска)
            else if (absDiff < lastBlock.w) {
                let choppedWidth = absDiff;
                let newWidth = lastBlock.w - choppedWidth;
                
                // Создаем обломок, который улетит вниз
                let debrisX = currentBlock.x < lastBlock.x ? currentBlock.x : currentBlock.x + newWidth;
                debris.push({
                    x: debrisX, y: currentBlock.y, w: choppedWidth, h: blockHeight,
                    vx: (currentBlock.x < lastBlock.x ? -2 : 2), vy: 0, angle: 0, va: (currentBlock.x < lastBlock.x ? -0.1 : 0.1)
                });

                currentBlock.w = newWidth;
                if (currentBlock.x < lastBlock.x) currentBlock.x = lastBlock.x;
            } 
            // ПРОМАХ (Игра окончена)
            else {
                // Весь блок падает
                debris.push({ x: currentBlock.x, y: currentBlock.y, w: currentBlock.w, h: blockHeight, vx: currentBlock.speed, vy: 0, angle: 0, va: 0.1 });
                currentBlock = null;
                setTimeout(triggerGameOver, 500); // Ждем, пока упадет
                return;
            }

            blocks.push({ ...currentBlock });
            score++;
            
            // Базовый доход (1 очко = 10 монет, после 30 этажа = 20 монет)
            let reward = score > 30 ? 20 : 10;
            balance += reward; earnedCoins += reward;

            document.getElementById('scoreVal').innerText = score;
            updateUI();

            // Подъем камеры и ускорение
            cameraTargetY += blockHeight;
            if (score % 5 === 0) currentSpeed += 0.5;

            spawnBlock();
        }

        window.addEventListener('touchstart', placeBlock);
        window.addEventListener('mousedown', placeBlock);
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') placeBlock(); });

        function triggerGameOver() {
            gameOver = true;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('earnedCoins').innerText = earnedCoins;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            initGame();
        }

        function updateUI() { document.getElementById('balanceVal').innerText = `${balance} 💰`; }

        // --- МАГАЗИН СКИНОВ ---
        function openShop() { document.getElementById('shopModal').style.display = 'flex'; renderShop(); }
        function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

        function renderShop() {
            const grid = document.getElementById('skinsGrid');
            grid.innerHTML = '';
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 100; tempCanvas.height = 40;
            const tCtx = tempCanvas.getContext('2d');

            skins.forEach(skin => {
                const isOwned = inventory.includes(skin.id);
                const isActive = activeSkinId === skin.id;
                const card = document.createElement('div');
                card.className = `skin-card ${isActive ? 'active' : ''}`;
                
                tCtx.clearRect(0,0,100,40);
                
                // Временно подменяем глобальный ctx на tCtx для рендера превью
                const oldCtx = window.ctx;
                window.ctx = tCtx; 
                skin.render(5, 5, 90, 30);
                window.ctx = oldCtx;

                let dataURL = tempCanvas.toDataURL();

                let btn = isActive ? `<button style="width:100%; padding:10px; background:#555; color:#fff; border:none; border-radius:10px; font-weight:bold;" disabled>НАДЕТО</button>` :
                          isOwned ? `<button style="width:100%; padding:10px; background:#00ffcc; color:#000; font-weight:bold; border:none; border-radius:10px; cursor:pointer;" onclick="applySkin('${skin.id}')">НАДЕТЬ</button>` :
                          `<button style="width:100%; padding:10px; background:#ffaa00; color:#000; font-weight:bold; border:none; border-radius:10px; cursor:pointer;" onclick="buySkin('${skin.id}')">1000 💰</button>`;

                card.innerHTML = `<img src="${dataURL}" style="width:100px; height:40px; margin-bottom:10px;">
                                  <div style="font-size:16px; font-weight:bold; color:#fff; margin-bottom:10px;">${skin.name}</div>${btn}`;
                grid.appendChild(card);
            });
        }

        function buySkin(id) {
            if(balance >= 1000) { balance -= 1000; inventory.push(id); updateUI(); renderShop(); }
            else alert("Не хватает монет!");
        }
        function applySkin(id) { activeSkinId = id; renderShop(); }

        function saveAndExit() {
            if(tg && tg.sendData) {
                tg.sendData(JSON.stringify({ game: 'tower', score: score, coins: balance, activeSkin: activeSkinId, inventory: inventory.join(',') }));
                tg.close();
            } else alert(`Выход. Баланс: ${balance}`);
        }

        // Стартуем
        window.ctx = ctx; // Глобальный хак для рендера магазина
        initGame();
    </script>
</body>
</html>
